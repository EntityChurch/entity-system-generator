`./x`, `../x` and `*/x` are the reserved forms core §1.4/§5.4 name as errors. This port
canonicalizes through **the peer's own** `entity_core.peer.capability.canonicalize`, which
returns `None` for all three; `typescript`'s port re-derives the rule inline as
`path.startsWith("/") ? path : "/" + peer + "/" + path`, which accepts them and produces a path
that resolves to nothing.

** THE INTERESTING PART IS WHY, NOT WHICH. ** The divergence is not a reading — it is that one
port called the primitive and one port wrote three characters of it. D12's *use the peer's
own function* is usually argued from correctness-of-semantics; here it bought a §1.4 refusal
nobody in this repo had noticed was required. Worklist item against the other port.
