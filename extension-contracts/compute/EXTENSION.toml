q23_install_enforcement = { value = "the Q23 shape check runs in the install audit", cite = "§2.1 [MUST] against §3.3's audit_walk", note = """
** DEVIATION FROM §3.3's LISTING (A-18), and §2.1 calls the alternative internally
inconsistent. ** §2.1: *"It is enforced at install time too … where `path` is a static
literal under `system/compute/builtins/`, the whole condition is decidable without
