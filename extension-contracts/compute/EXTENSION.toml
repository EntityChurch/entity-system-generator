# ── [sdk_surface] — D16. Ungated by anything upstream, so ours to set ───────────────
#
# THE DECISION, made deliberately and matching HISTORY: FLAT names are the contract in every
# port. There is no `ComputeTypes` bundle object and there will not be one. CONTENT's 18 drift
# entries were one decision made once in `typescript` and never made again.
#
# ** REWRITTEN 2026-09-12, AT THE SECOND PORT, AND THE REASON IS THE FINDING. **
#
# This block shipped on 2026-09-10 as 67 RAW typescript identifiers — `"LITERAL"`,
# `"isComputeExpression"` — where the gate's key form is `kind:snake_case`. It was written
# "NOW rather than at the second port, precisely because that is D16", and that intent was
# right; what nobody checked is that `tools/sdk-parity.py` REFUSES below two ports, so the
# block was authored, reviewed, cited in a handoff and **parsed by nothing for two days**.
#
# The moment `python` landed, `tuple("LITERAL".split(":", 1))` produced a ONE-tuple and the
# gate died with `IndexError: tuple index out of range` — a traceback in the middle of
# `make check`, which is neither a verdict nor a refusal. Had it not crashed the answer would
# have been worse: a one-tuple matches no port key, so all 67 would have read as
# `REQUIRED ... missing from python, typescript`. Sixty-seven fabricated failures on the
# second port's first run, and a false red costs the instrument (AP-4).
#
# **D16's shape in this gate's own declaration file**: a declaration written for a gate that
# cannot run yet is a declaration nothing reads, and *the thing we own is the thing nothing
# watches*. The gate now refuses a malformed entry by name (`_declared_key`), which is the
# enforcement point this paragraph would otherwise be a wish without.
#
# ── AND THE MEASURED RESULT, WHICH IS THE FIRST OF ITS KIND IN THIS REPO ─────────────
#
# **75 required, in every port, 0 drift, on the first two-port run.** CONTENT's first run was
# `24 required · 9 substrate · 18 drift · 51 union`; HISTORY's second port opened at 22 names
# in both with 20 differing. This is full parity out of the gate, and the reason is not virtue:
# it is that HISTORY already paid for the flat-constants decision and the second port was
# written with `[sdk_surface]` open beside it. The gate earned its keep by being consulted
# BEFORE the port rather than after — which is the first time that has happened here.
