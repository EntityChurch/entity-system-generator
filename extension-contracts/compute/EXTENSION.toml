# ── [contract.error_codes] — §9.1's code set, TRANSCRIBED ───────────────────────────
#
# Keyed `<op>.<code>`, because a code set is defined PER OPERATION — Appendix A's own
# framing, adopted here. COMPUTE's §9.1 table is not per-operation, so every row is under
# `eval`: it is the only operation this port implements, and §9.1's codes are all
# evaluation outcomes. `install`/`uninstall` would draw on the same set plus §3.3's
# `embedded_cap_unauthorized`, which is why they are NOT listed — declaring a code for an
# operation we answer `501` for would be a claim about a surface that does not exist.
#
# ** §9.1's TABLE DOES NOT RECORD A PROPERTY v3.27 ADDED, and it decides behaviour. ** Three
# codes differ in whether their counter survives an element: `depth_exceeded` CONTAINS (the
# counter is restored on unwind, §5.1), while `budget_exhausted` and `cascade_limit`
# SHORT-CIRCUIT everywhere — cumulative and chain-wide respectively. That decides what a
# §3.5 collection primitive does with an error in a contained position, is not derivable
# from the table, and is transcribed in the comments below rather than lost.
[contract.error_codes]
"eval.budget_exhausted" = { cite = "§9.1", note = "computation budget reached 0. SHORT-CIRCUITS everywhere (cumulative, v3.27)" }
"eval.depth_exceeded" = { cite = "§9.1", note = "maximum recursion depth. CONTAINS: the counter is restored on unwind (§5.1, v3.27)" }
"eval.type_mismatch" = { cite = "§9.1", note = "incompatible operand types" }
"eval.division_by_zero" = { cite = "§9.1", note = "division or modulo by zero. INTEGER only; float division by zero is IEEE-754 (§4.1)" }
"eval.not_found" = { cite = "§9.1", note = "lookup path missing in scope and tree, or hash unresolvable" }
"eval.unknown_type" = { cite = "§9.1", note = "unrecognized compute entity type" }
"eval.missing_argument" = { cite = "§9.1", note = "required argument not provided to closure" }
"eval.invalid_expression" = { cite = "§9.1", note = "malformed compute expression" }
"eval.cascade_limit" = { cite = "§9.1", note = "reactive cascade depth exceeded. SHORT-CIRCUITS everywhere (chain-wide, v3.27)" }
"eval.permission_denied" = { cite = "§9.1", note = "capability does not cover the target path or operation" }
"eval.installation_grant_invalid" = { cite = "§9.1", note = "installation grant revoked, expired, or missing" }
"eval.index_out_of_range" = { cite = "§9.1", note = "array index negative or >= length (compute/index, builtins/assoc)" }
"eval.cast_out_of_range" = { cite = "§9.1", note = "numeric-cast float->integer out of range, NaN, or +/-Inf" }
"eval.count_out_of_range" = { cite = "§9.1", note = "builtins/range `n` negative or above max array length" }
"eval.scope_unreachable" = { cite = "§9.1", note = "a kind:entity scope binding's hash resolves nowhere (§2.3 N8)" }
"eval.ambiguous_resource" = { cite = "§3.2 handle_eval", note = "NOT IN §9.1 TABLE - the same §9.x-constants drift as the operations table, folded into A-8 rather than filed separately" }

