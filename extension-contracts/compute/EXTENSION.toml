    :4037  "...deprecated in v7.74, removed in v7.75."                    <- still future tense
    :4126  "Deprecated in v7.74; removed in v7.75."                       <- still future tense

Spec @ 0.8.2.20. **A retirement scheduled against a version that shipped without performing it
is expired text, not a date**, and we planned against it as though it were a countdown. Nothing
