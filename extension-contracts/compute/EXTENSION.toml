# ══ ROWS THE SECOND PORT ADDED (2026-09-12). ═══════════════════════════════════════
#
# **THEY ARE ALL ONE KIND, AND IT IS A KIND THE FOUR ROWS ABOVE DO NOT CONTAIN.** Those record
# what a peer CANNOT DO — a missing seam, an unrenderable constraint, a narrower ergonomic
# layer. These record what a runtime DOES BY ITSELF: `%` that floors, a `/` that raises, a
# `bool` that is an `int`, a `put` that suppresses. Nothing is missing in any of them. The peer
# is not narrower; the LANGUAGE has an opinion, and §4.1 has a different one.
#
# That is the substrate model learning a new row KIND at the EIGHTH composition, which is the
# same event `[substrate.oracle_read_path]` was at the sixth — and it is why the tier stays
# CORE. `AGENTS.md`'s revisit criterion is *"when a port stops changing the shape of the
# table"*, and this port added a kind. A model whose row kinds are still being discovered has
# not generalised.

[substrate.native_value_model]
must = "§2.2 / §4.1 / §4.5 — arithmetic, comparison, truthiness and type-class equality over ECF values"
typescript = "TAGGED — the codec hands the evaluator `{kind:'int'|'bool'|'float'|...}` nodes, so every type test is a `.kind` read and the compiler keeps the three apart."
python = "NATIVE — the codec tree is `None/bool/int/float/str/bytes/list/dict`, so every type test is an `isinstance` and **`bool` is an `int` SUBCLASS**. Seven §4.1 rules have a silent wrong answer here that cannot exist over there."
rust = "unknown -- no port"
note = """
The seven, every one of them carrying a unit test with a control, and all seven pre-registered
in `languages/python/compositions/compute/SYSTEM.toml [gate.expectation]` BEFORE the run:

  1. `%` is FLOORED here and TRUNCATED in §4.1 (`-7 % 2` is `1` vs `-1`).
  2. float `/` by zero RAISES where §4.1 says IEEE `±Inf`/`NaN`.
  3. `bool` is an `int`, so `eq(true, 1)` must be forced to FALSE across type classes.
  4. `[-1]` is a legal read where §2.2 says `index_out_of_range`.
  5. `bool({})` and `bool(b"")` are False where §4.5's falsy list has neither.
  6. `//` floors where an exact-quotient `div` wants truncation toward zero.
  7. `sorted()` is lexicographic where §4.1's `canonical_sorted` is length-then-lex.

** ALL SEVEN COST ZERO CHECKS, AND THAT IS THE RESULT RATHER THAN THE LIST. ** The band was
118–125 and the measurement is 125. What the band was really pricing is how many of a
runtime's own semantics an implementer can adopt without noticing, and on this substrate the
answer is that they are all catchable — provided the port is written against the spec's
helpers rather than against the host's operators. `evaluator.ts` carries a comment predicting
exactly item 1 ("a silent cross-port divergence if the python port reaches for its own
operator"), written at port 1 by someone who could not check it. That comment is worth more
than this row.
"""

