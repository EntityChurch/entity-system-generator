audit_walk_containers = { value = "ONE walker for §3.3 and §7.1, descending containers in both", cite = "§3.3 audit_walk against §7.1 walk [MUST, v3.27]", note = """
** DEVIATION FROM §3.3's LISTING, AND IT IS THE AUTHORIZING WALKER THAT IS WRONG (A-17). **
The two sections walk the same graph and their listings differ in one line:

    §3.3  for field_value in entity.data.values():
