## EXTENSION.toml — COMPUTE
##
## The machine-readable contract, against `shared/spec-data/compute-v3.29/EXTENSION-COMPUTE.md`
## (sha256 d1de19425d5dc80a30a4ae228cd15db9681ca27e1fc437bb448a8ecbe732de53).
##
## THE THIRD EXTENSION, AND THE LARGEST BY EVERY MEASURE: 33 owned types against HISTORY's
## six and CONTENT's seven, 128 oracle checks against 34 and 13, and the only one whose
## MUST surface is an interpreter rather than a handler.
##
## `[contract]` IS A TRANSCRIPTION. `EXTENSION-COMPUTE` carries GUIDE-EXTENSION-DEVELOPMENT
## §3.3's declaration header (arrived in arch's GI-5 sweep, `5e6ff77`), so every field below
## is read off a declaration rather than derived from body text — the position HISTORY only
## reached at v1.10. One field is transcribed WITH A NOTE rather than verbatim, and that is
## the §1 finding: see `points_consumed`.
##
## FIVE DECLARED DEVIATIONS from the spec text, all routed as
## `docs/status/ROUTING-2026-09-09-d-arch-computes-machine-readable-furniture-and-the-shape-of-8-5a.md`,
## all implemented the way the REST of the spec requires rather than the way one local
## block says. They are listed in `[assumptions]` and each names the sites on both sides.
## **None is a local decision about semantics** — each is a case where the document
## contradicts itself and the majority of its own normative sites picks the answer.

[extension]
name     = "COMPUTE"
spec     = "EXTENSION-COMPUTE.md"
version  = "3.29"
snapshot = "compute-v3.29"
grade    = "active"                  # spec header "**Status**: Active". Like HISTORY, this
                                     # spec has no "Conformance grade:" line; `active` is
                                     # the Status value and is a DIFFERENT axis from
                                     # GUIDE §9's grade. `ROADMAP-EXTENSIONS` separately
                                     # rates it Stage A / M5 / stable, which is the top
                                     # tier and is a third axis again.

# ── [contract] — TRANSCRIBED from the §3.3 declaration header ───────────────────────
[contract]
depends          = []                # §"Depends": ENTITY-CORE-PROTOCOL v7.33+ only. The
                                     # header is emphatic: "Core protocol (v7.33+) — the
                                     # only dependency... nothing else is required to
                                     # install this." §1 lists INBOX / CONTINUATION /
                                     # SUBSCRIPTION as INDEPENDENT, not as dependencies.
owned_namespaces = ["system/compute/"]   # §3.3's field is scoped to `system/<ext>/…`
                                     # subtrees. The top-level `compute/*` TYPE namespace
                                     # is NOT in this field and its absence is correct —
                                     # see [assumptions].compute_namespace_not_a_finding.
owned_ops        = [
  "system/compute:eval",
  "system/compute:install",
  "system/compute:uninstall",
]
owned_kinds      = []                # header: "Owned `properties.kind` values: none."
points_exposed   = [
  "alternate_engine_admission",      # §11 — AE-1..AE-6. Optional and per-implementation;
                                     # "a performance choice and never a conformance
                                     # surface". We ship the §4 reference evaluator, which
                                     # is the conformance floor.
  "builtins_table",                  # §2 / §3.5
  "reactive_process_surface",        # §7
]
# ** THE ONE FIELD THAT IS NOT A CLEAN TRANSCRIPTION, AND IT IS §1 OF THE PACKET. **
# The header's `Extension points consumed` lists the core protocol and the OPTIONAL
# `budget_consumed` field on EXECUTE_RESPONSE. Neither is a registration hook. Installing
# COMPUTE with reactive mode registers an emit consumer — §7.2's `on_tree_change` — which
# SYSTEM-COMPOSITION §2.2 puts at POSITION 5, class *unbounded reactive*, under the stable
# name `compute/reevaluator` (§2.7A). `EXTENSION-HISTORY`'s header, from the same GI-5
# sweep against the same guide clause, declares `emit.tree_change`.
#
# We transcribe the header AND record the hook, in two fields, because collapsing them
# would lose which one the spec actually says.
points_consumed  = ["execute_response.budget_consumed"]
points_consumed_observed = ["emit.tree_change"]
points_consumed_note = """
`emit.tree_change` is NOT in the declaration header and IS how §7.2 works. Routed as A-6.
It is in `points_consumed_observed` rather than in `points_consumed` so that a reader can
tell a transcription from a correction.

** AND AS OF 2026-09-10 THE CORRECTION IS LOAD-BEARING RATHER THAN OBSERVATIONAL. ** This
port now registers that consumer. A reader who trusts the declaration header and nothing
else concludes that installing COMPUTE consumes one optional EXECUTE_RESPONSE field; what
it actually does is attach a re-entrant writer to every tree bind on the peer. A-6 is
re-sent with that sentence, because the gap between the two readings is no longer a
documentation defect — it is the difference between an extension that observes and one
that participates.
"""

[core_depends]
protocol = ">=7.33"                  # §"Depends", verbatim.
cbor     = ">=1.0"                   # §"Encoding" is ECF. No minimum stated in the header;
                                     # recorded as the unconstrained floor rather than
                                     # invented. The ECF dependence here is TOTAL rather
                                     # than incidental: every expression is referenced by
                                     # content hash from its parent, so canonical form IS
                                     # the addressing.

# ── [surfaces] — FIVE faces, and the fifth is new to this repo ──────────────────────
[surfaces]
handler        = "system/compute"    # §3.1's PROSE. The manifest CODE BLOCK says
                                     # `system/compute/*`, which is the capability-scope
                                     # spelling — see [assumptions].pattern_spelling.
types          = true                # 33 of them (§2.1–§2.6, §3.5)
sdk            = true
emit_consumers = ["compute/reevaluator"]
                                     # ** INSTALLED 2026-09-10. ** §7.2's `on_tree_change`,
                                     # under the stable name SYSTEM-COMPOSITION §2.7A gives
                                     # it, at §2.2 POSITION 5, class *unbounded reactive*.
                                     # It is the only consumer in the corpus that WRITES
                                     # BACK — HISTORY's records and stops — which is what
                                     # makes §7.3's bound load-bearing rather than
                                     # decorative on a sync-inline bus.
evaluator      = true                # ** THE FIFTH FACE. ** `Peer.setExpressionEvaluator`
                                     # — keystone's H7, routed by this repo 2026-09-03,
                                     # landed the same day, measured with five controls on
                                     # 2026-09-04. No other extension in the corpus has
                                     # this, and `DESIGN-THE-SDK-LAYER` §1's four-face
                                     # model has no word for it. `tools/compose.py`'s
                                     # `FACES` grew by one value; whether the design doc
                                     # should say "open-ended, enumerated per extension"
                                     # is the real question and is owed there.
service_owning = false               # §11.6.9 start/stop not required. Reactive mode would
                                     # not change this: §7's dependency index is state, not
                                     # a service.

[install]
model = "sdk-native"                 # in-process against a live peer object. Same value as
                                     # CONTENT and HISTORY and, as of 2026-09-09, the same
                                     # REASON — which is no longer a rule. See
                                     # `extension-contracts/content/EXTENSION.toml`
                                     # `[substrate.wire_install_refusal]`: core §6.2's
                                     # `system/*` reservation was withdrawn (0.8.2.13), the
                                     # two peers we compose against still refuse, and 44 of
                                     # 46 read `unknown`.

# ── [sdk] — the in-process surface ──────────────────────────────────────────────────
# No conformance gate on this face, so THE EXTENSION IS THE INSTRUMENT — and here that is
# stronger than it was for CONTENT or HISTORY, because TWO gated paths run through this
# surface: the `system/compute:eval` handler and the H7 evaluator seam. One implementation,
# two consumers; a defect in it cannot hide in either.
[sdk.ComputeEvaluator]
cite       = "§4.1 evaluate + §4.2 resolve + §4.3 scope"
public     = true
reached_by = ["compute/eval_literal_int", "compute/eval_arithmetic_add", "compute/eval_compare_eq_true"]

[sdk.ComputeHandler]
cite       = "§3.1 manifest + §3.2 handle_eval"
public     = true
reached_by = ["compute/handler_present", "compute/handler_manifest_decode", "compute/handler_op_eval"]

[sdk.assertNotBuiltinOverride]
cite       = "§4 override prohibition (v3.29)"
public     = true
reached_by = []                      # HONESTLY UNMEASURED, and the reason is the finding:
                                     # no oracle check anywhere attempts a registration at
                                     # `system/compute/builtins/*`. Through v3.28 this rule
                                     # delegated to core's `system/*` reservation and needed
                                     # "no separate compute-specific guard"; 0.8.2.13
                                     # withdrew that reservation, so the guard is OURS and
                                     # arrived with nothing upstream measuring it. Unit test
                                     # only. This is D16's shape on a rule that changed
                                     # owners rather than on an axis nobody owned.

[sdk.publishComputeTypes]
cite       = "§10.2 — types registered at system/type/{type_name}"
public     = true
reached_by = ["compute/types_expression", "compute/types_inline", "compute/types_value",
              "compute/types_result_error", "compute/types_subgraph"]

[sdk.isComputeType]
cite       = "§4.2 Tier 1"
public     = true
reached_by = []                      # See [assumptions].membership_lists — the deviation
                                     # this function embodies is measured by nothing,
                                     # because `entity-core-go` silently carries the same
                                     # corrected list, so no vector can fail on it.

[sdk.isComputeExpression]
cite       = "§4.7"
public     = true
reached_by = ["compute/handler_op_eval"]

# ── [assumptions] — where the spec did not decide, or decided twice ─────────────────
#
# READ THIS BLOCK BEFORE READING THE CODE. Five of the seven entries are cases where the
# specification contradicts ITSELF and we followed the majority of its own normative sites.
# Every one is routed; none is a local ruling on semantics.
[assumptions]

membership_lists = { value = "16 expression types, 23 compute types", cite = "§2.2 + §10.1 against §4.2 + §4.7", note = """
** DEVIATION, FUNCTIONAL, AND THE SHARPEST ITEM IN THE PACKET (A-10). ** §4.7's
`is_compute_expression` lists 13 and §4.2's `is_compute_type` lists 20; both omit
`compute/index`, `compute/length` and `compute/numeric-cast`. §2.2 defines all three and
§10.1 MUSTs them by name. We implement 16 and 23.

The §4.2 omission is not cosmetic: every sub-expression is referenced BY HASH and resolved
through `validate_compute_resolvable`, whose Tier 1 IS `is_compute_type` and is the only
tier that admits an ordinary sub-expression outside an installed subgraph. Transcribing
§4.2 literally produces a peer where `arithmetic(add, literal, length(...))` answers
`not_found` on a valid program.

Cause: the N.1 and N.4 amendments added the three types and updated §2.2 and §10.1 without
reaching either predicate. §10.1 even MUSTs `is_compute_type` by name for a DIFFERENT
addition (`compute/lookup/hash`), so the list has been corrected once already.

`entity-core-go`'s `isComputeType` and `IsComputeExpression` both carry all three —
CORROBORATION, not authority (L18), and the reason it matters is that it means no
conformance vector can be failing on this today.
""" }

subgraph_fields = { value = "7 fields including authorized_data_hashes", cite = "§3.3 + §4.2 + §1.1 + §10.1 against §2.5", note = """
** DEVIATION (A-11). ** §2.5's field map declares six; §3.3 Phase 3 WRITES seven. The
seventh is read at §4.2 (Tier 2), named load-bearing at §1.1, and MUSTed at §10.1. Four
normative sites against one type block.

Cost of getting it wrong is cross-implementation rather than runtime: the subgraph entity
is content-addressed, so two peers on the two readings publish different type entities and
write different subgraph entities for one install — and they do not fail against each
other, they stop agreeing. CONTENT §2.1's dedup-identity problem in another namespace.

** THE FIRST DRAFT OF `types.ts` RENDERED SIX. ** What changed it was reading
`entity-core-go`'s `ComputeSubgraphData` — which carries `AuthorizedDataHashes` and
registers its type entity by reflection over that struct — AFTER the decision was already
made. That is the order in which this class of error survives, and it is recorded rather
than smoothed over.
""" }

install_op_declared = { value = "all three operations declared in the manifest", cite = "§3.1 against §10.2", note = """
** AMBIGUITY, RESOLVED BY THE ORACLE AND ROUTED (A-7). ** §10.2 lists the compute handler
itself and the install/uninstall operations as SHOULDs, the latter "required if reactive
mode is implemented" — while §10.1 MUSTs THREE BEHAVIOURS of the install operation.

What settled it here is not a spec reading: `entity-core-go`'s `handler_op_install` and
`handler_op_uninstall` are `FailCheck` on a manifest that omits either, and 6 of the
category's 128 checks are blocked behind `handler_op_install`. So we declare three.

** AND AS OF 2026-09-10 WE IMPLEMENT ALL THREE. ** The reason the previous session shipped
`501 not_implemented` stands and is worth keeping: a partial install audit is worse than
none, because the audit SEALS `authorized_data_hashes` and §4.2 Tier 2 trusts that set
without re-checking. The audit is complete now — four phases, pre-flight before commit —
so Tier 2 is non-empty for the first time in this corpus.

The `501` path is NOT dead code. `ComputeHandler` takes the §7 engine as a constructor
argument and answers `501` when it is absent, because an install with no engine behind it
records a subgraph nothing can ever wake — which is the same lie the old `501` refused to
tell, one level up. A composition that installs the handler without the emit consumer gets
an honest answer rather than a 200.
""" }

pattern_spelling = { value = "system/compute", cite = "§3.1 prose against §3.1 code block", note = """
The manifest code block reads `pattern: "system/compute/*"`; the prose four lines below
reads "Manifest at pattern path `system/compute`. Index entry at
`system/handler/system/compute`." The `/*` is the capability-scope spelling used in grant
examples, not a binding path — binding at a literal `.../*` puts a `*` segment in the tree.

SAME TRAP AS CONTENT §6.1, and measured across the corpus: 2 of 18 manifest blocks use the
`/*` spelling and they are exactly `EXTENSION-CONTENT` and `EXTENSION-COMPUTE` — the two
specs this repo has read for generation. Filed for information (§6), not as an ask.
""" }

compute_namespace_not_a_finding = { value = "owned_namespaces omits `compute/*` and that is CORRECT", cite = "GUIDE-EXTENSION-DEVELOPMENT §3.3", note = """
RECORDED AS A NON-FINDING ON PURPOSE. The declaration header claims `system/compute/`
(closed) and says nothing about the top-level `compute/*` namespace where all 20 IR types
live — a namespace core §1 carves out BY NAME. That reads as a serious omission until you
read the clause it answers: §3.3 defines the field as "every `system/<ext>/…` subtree the
extension claims". `compute/*` is out of scope BY THE FIELD'S OWN DEFINITION.

We nearly routed it. D12/L8 — an artifact is not a conclusion about the thing it names —
caught one step before it became a packet, by reading the canonical source instead of the
plausible inference.
""" }

scope_capture_full = { value = "capture ALL bindings, not referenced-only", cite = "§4.4", note = """
§4.4 makes referenced-only a SHOULD and calls it an optimization ("requires static
analysis"). We take the MAY-equivalent full capture, and the reason is not laziness: the
captured `compute/scope` entity's CONTENT HASH is the one thing §2.3's N2 pins by digest
across implementations (`ecf-sha256:3edc5138…` in all three references). Referenced-only
capture produces a different entity for the same lambda in the same scope, so taking the
SHOULD would put us in disagreement with any peer that did not.

A SHOULD whose two answers produce different content hashes is worth flagging to arch, and
it is NOT in the packet: one instance, and we have not confirmed the references' choice.
Recorded here so the second port makes the same choice deliberately.
""" }

apply_handler_mode = { value = "not implemented; returns invalid_expression naming the reason", cite = "§4.1 dispatch_execute branch", note = """
`compute/apply` CLOSURE mode is implemented; HANDLER mode is not. It needs a re-entrant
dispatch into the peer from inside an evaluation, plus the F2 dual capability check and
V30's `encode_arg_for_field` typed-params construction.

Shipping half of it would be worse than not shipping it, and the direction is the reason:
the F2 dual check only ever NARROWS, so a partial implementation runs WIDER than the caller
asked. The §2.1 Q23 SHAPE checks ARE implemented — builtin path must not carry
capability/resource, capability requires resource, handler mode requires operation —
because their ORDERING is normative (they run before any field is resolved, so the returned
code cannot depend on a field's value).

** UPDATED 2026-09-10: THE BLOCKER IS NAMED AND MEASURED, AND IT IS NOT OURS. ** The
paragraph above says *"it needs a re-entrant dispatch into the peer"* as a scoping
statement. It is now a finding: **the peer exposes no such seam.** `PeerServices` carries
`{localPeerId, localIdentity, tree, contentStore, emit, nowMs, maxFrameBytes}` and no
dispatcher; `HandlerContext.outbound` is §6.13(b)'s OUTBOUND seam — it builds, signs and
sends an authenticated EXECUTE over the §6.11 transport to a URI, and it is `null` unless
the request arrived on a connection. Neither reaches a local handler.

So this is the one §10.1 MUST in this extension that a correct port cannot satisfy on this
substrate, and it is H7's shape exactly: a host-contract gap, not a conformance defect.
Routed to keystone as
`ROUTING-2026-09-10-b-keystone-a-handler-cannot-dispatch-to-a-local-handler`, and deliberately with
NO H-number: H8 and H9 already exist in their sequence — our own tracker row K-1 cites *"the
execution context H8 requires"* — and this packet's first draft called the new item H8 throughout.
The H-series is theirs to number. Cost: 3 of 128 (`v38_apply_handler_mode`,
`v310_apply_resource_field_accepted`, `v314_compute_apply_to_entity_native`).

** AND ONE CORRECTION OF OUR OWN READING, MADE THE SAME HOUR. ** A first pass here
recorded a SECOND blocker — that H7's `ExpressionEvaluator.evaluate` is synchronous, so
even a future async dispatch seam could not be awaited from the entity-native path. That
is wrong: the interface reads
`evaluate(request): Promise<HandlerResult | null> | HandlerResult | null`. It is
async-capable and always was. Recorded because it was a source read of a signature that
would have gone into a packet as a second ask, and one grep of the actual declaration is
what stopped it (D12).

** The FOURTH face of this: the builtin `store` is the same question with a door. ** SA-10
lets a `store` write go through a direct capability-checked write instead of a
`system/tree:put` dispatch, which is why `store` ships and handler mode does not. §4.1's
`dispatch_execute` has no such alternative — the whole point is that the target is an
arbitrary handler.
""" }

value_type_evaluation = { value = "§4.1's evaluate_inner gains an arm for the four §2.3 VALUE types", cite = "§2.3 SA-1 against §4.1", note = """
** DEVIATION, FUNCTIONAL, AND THE THIRD IN THIS FAMILY (A-12). ** §2.3's SA-1 is a MUST:
*"Evaluating a value-type entity returns it unchanged … generalizing the
`compute/lookup/hash` return-non-expressions-as-values rule."* §4.1's `evaluate_inner`
pseudocode has **no arm for any of the four** (`compute/closure`, `compute/scope`,
`compute/result`, `compute/error`), so a literal transcription falls through to
`default: return error("unknown_type", …)`.

MEASURED COST, not inferred: `v319b_scope_unreachable` stores a `compute/closure` at a
tree path and applies it. Through 2026-09-09 this port answered `unknown_type` where the
vector requires `scope_unreachable` — and the reason is worth reading twice, because the
2026-09-09 note guessed at it and guessed wrong. `load_scope` was never reached at all;
the CLOSURE ENTITY itself failed to evaluate. A bug in §4.3's N8 path was diagnosed for a
day and there was never a bug in §4.3.

WHERE THE ARM SITS: at the FALLTHROUGH, guarded by `isValueType`, not as four `case`
labels beside the expression types. SA-1's own words are that it *generalizes* the
lookup/hash rule, which is a statement about the default arm rather than about four names
— so a fifth value type is covered by §2.3's list moving and not by someone remembering
this switch. The negative control is in the unit tests: an unknown compute type and an
ordinary application entity must both still answer `unknown_type`, because
`eval_error_non_expression` is a live oracle check and widening the fallthrough to
"anything that is not an expression" would pass every SA-1 test and turn §4.1's own error
code into dead code.
""" }

construct_in_flight = { value = "compute/construct returns BOTH the bare materialized entity and a typed field map", cite = "§2.3 v3.19c option α against §4.1's construct arm", note = """
** DEVIATION, FUNCTIONAL, AND THE FOURTH IN THIS FAMILY (A-13). ** §2.3's option-α clause
requires two things at once: the materialized form is a *"normal bare entity"* with
entity-valued fields as bare `system/hash` refs, AND navigation *"composes transparently
only where the kind is known (in-flight typed values …); on a bare materialized entity, a
reference is followed explicitly."* §4.1's construct arm implements the first and keeps no
in-flight representation at all —
`result_fields[name] = ctx.content_store.put(materialize(value, ctx))` — and §4.1's
`compute/field` arm returns `target.data[name]` raw. So a transcription of §4.1 can
navigate one level into a constructed entity and answers `type_mismatch` on the second,
which is what `v319c_construct_navigation_chain` measures.

`ConstructedValue` carries both: `.entity` is the bare form (the M1 hash gate's subject,
byte-identical to `entity.NewEntity`, unchanged from the previous port) and `.fields` is
the in-flight typed map. `materialize()` is the single boundary function, called at §2.3
N1's three placement sites plus the SDK's own exit.

** THE BARE FORM IS STILL BUILT EAGERLY AND THAT IS A DECISION. ** Option α is about where
navigation has to go through the materialized form, not about deferring the store write —
§4.1 writes eagerly and `v319c_inline_vs_builtin_construct_hash_agreement` exists because
a second, lazier derivation of the bare form is the defect (`entity-core-rust` shipped
one). Keeping one derivation costs an extra content-store put for an intermediate
construct, which is invisible: the store is content-addressed and §5.3 charges
`evaluate()` steps rather than writes.
""" }

in_flight_container_kind = { value = "an entity-valued ARRAY ELEMENT is materialized eagerly; the reference is not preserved in-flight", cite = "§2.3 v3.19c option α, and its silence", note = """
** A DECLARED CROSS-IMPL DIVERGENCE, FOUND BY READING THE ORACLE'S SOURCE RATHER THAN THE
SPEC, AND ROUTED AS A QUESTION. ** §2.3 says navigation composes *"where the kind is
known (in-flight typed values; kind-tagged `compute/scope` bindings)"* and lists three N1
placement boundaries: scope bindings, construct fields, apply args. **A COLLECTION
POSITION IS IN NEITHER LIST**, and the two implementations answer it differently:

  - `entity-core-go`'s `builtinGroupBy` returns `[]interface{}` of `*constructedValue` —
    IN-FLIGHT values inside an array — so `field(index(group_by(…), 0), 'key')` composes.
  - this port materializes an entity-valued element at the moment it is placed
    (`containedElement`), so the same expression reads a bare `system/hash` and answers
    `type_mismatch` unless the author follows it with `compute/lookup/hash`.

**Boundary bytes AGREE** — both end as bare hashes in the array, so §8.1, §11.1 (AE-1) and
every materialized-hash vector are satisfied by both. What differs is whether a program is
ACCEPTED, which is the thing *"the in-flight representation is implementation-private"*
cannot cover: a program written against one peer errors on the other. And no vector exists
in either direction, because the six passing builtin vectors all carry integer
collections.

Not resolved locally, deliberately: picking Go's answer would be L18 (a cohort
implementation is not evidence a cohort ruling is right) and picking ours would be worse.
Routed to arch for a clause and to core-go for a vector.
""" }

builtin_dispatch_internal = { value = "the builtins are evaluated INSIDE the evaluator; nothing is registered at system/compute/builtins/*", cite = "§3.5's closing paragraph", note = """
NOT A DEVIATION — §3.5 asks for this rather than merely permitting it: *"Because
`map`/`filter`/`fold` apply a caller-provided closure per element, they need the
evaluator's scope/budget/context — a real handler-dispatch boundary would lose these.
Implementations SHOULD therefore evaluate the collection builtins internally within the
evaluator … `system/compute/builtins/{map,filter,fold,range,group-by,concat,assoc}` is a
canonical/LOGICAL operation name; on such implementations it MAY NOT resolve to a distinct
handler entity in the tree (a `tree:get` of that path need not return a handler)."*

RECORDED BECAUSE IT LOOKS LIKE A GAP AND IS NOT. A reviewer grepping for a registration at
those paths finds none, and the peer's handler index has no entry for them. That is
conformant. The §4 override prohibition still applies and is still ours to enforce — see
`builtins_override_guard` — and the two facts sit oddly together on purpose: nothing is
registered there, and a registration there must be refused.

AND THE LEVELS INVERT AGAINST THE READING ORDER. The five inline-equivalent aliases
(`arithmetic`, `compare`, `logic`, `field`, `construct`) are §10.2 **SHOULD**; `map`,
`filter`, `fold`, the four v3.24 primitives and `store` are §10.1 **MUST**, promoted out
of §10.3 at v3.14 on the ground that *"every compute-deterministic capability is
MUST-given-COMPUTE … only resource bounds stay flexible."* All thirteen are implemented
here; the aliases share the inline code path, so a fork between the two forms is
unconstructible rather than untested.
""" }

store_write_mechanism = { value = "a direct EntityTree.put, not a system/tree:put dispatch", cite = "§3.5 SA-10", note = """
SA-10 states a preference and its own alternative in one sentence: *"implementations
dispatch the write via `system/tree:put`, so capability-gating, path normalization,
history, and reactive cascade are uniform with all other tree writes (a direct
capability-checked `emit` is equally compliant, but `tree:put` keeps attribution uniform
across impls)."* We take the second door because the first needs the re-entrant local
dispatch this substrate does not have (see `apply_handler_mode`).

** WHAT WE DO GET, MEASURED IN THE PEER'S SOURCE RATHER THAN ASSUMED: THE EMIT PATHWAY. **
keystone's `EntityTree.put` runs §6.10 itself — the Store step via `ContentStore.put`,
then the Bind step, firing a tree-change event when the binding actually changes. So a
registered emit consumer sees a `store` write exactly as it sees any other tree write, and
a COMPUTE + HISTORY composition would record it. That was the half of SA-10's rationale
worth checking before choosing, and it is the half that survives.

** WHAT WE DO NOT GET, both named: ** no per-path capability check (`canWritePath` answers
at the dispatch boundary — the same declared gap as `canReadPath`, and a distinct member
