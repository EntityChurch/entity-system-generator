sa11_builtin_handler_targets = { value = "NO builtin path is ever a handler_target", cite = "§3.3's subgraph-boundary paragraph against §3.3's audit_walk", note = """
** DEVIATION FROM §3.3's LISTING (A-19), and the two halves are in the same section. **
The prose: *"the pure collection builtins (map/filter/fold) require no install-time
handler-target authorization grant — they perform no tree or capability access (SA-11); only
`store` is authorization-gated at install time, VIA ITS `write_path`."* The listing appends
every `compute/apply` with a non-null `path` to `handler_targets`, builtins included.

Phase 2 then demands the caller's grant cover handler `system/compute/builtins/map`,
operation `eval` — a handler that does not exist, on a path §3.5 says *"MAY NOT resolve to a
distinct handler entity in the tree"*. Under any grant narrower than `*` the listing rejects
a legal `map`; under the degenerate `default → *` seed policy **we** launch with
(`tools/host-launch:137`) the two readings are indistinguishable, which is why the corpus is
silent. Corrected 2026-09-11: the silence is a property of our launch posture, not of the oracle.

We implement the prose: a builtin dispatches no EXECUTE (§2.1 Q23's own premise), so there
is no handler+operation pair to authorize, and `store` is gated by its literal `write_path`
exactly as SA-11 says.
""" }

constraints_location = { value = "compute constraints are read from each GRANT ENTRY, not from a token-level field", cite = "§5.2 + §5.5 against ENTITY-CORE-PROTOCOL §5", note = """
** SPELLING DEVIATION (A-21), small and load-bearing. ** §5.2's `init_budget` and §5.5 both
write `capability.data.constraints["system/compute"]`, which reads as a field on the token.
ENTITY-CORE-PROTOCOL §5 carries `constraints` on each entry of `grants`; this peer's
`CapabilityToken` parses no token-level `constraints` at all, and `GrantEntry.constraints` is
where a delegation preserves it byte-equal.

So a literal transcription of §5.2 reads a field that does not exist, gets `undefined`, and
falls back to the peer defaults — silently ignoring every compute resource limit an issuer
set. That is the §5.5 *"constraint escalation"* the section exists to prevent, arrived at by
following the section.

We scan the grant entries and take the TIGHTEST value across them, because that is the only
reduction that cannot widen a grant. `entity-core-go`'s `reactiveBudget` comments *"its
grant-level compute constraints (ENTITY-CORE-PROTOCOL §5)"* — corroboration, not authority
(L18); the authority here is core §5 itself.
""" }

reentrancy_backstop = { value = "a second cascade bound that does not travel on the emission context", cite = "§7.3 [MUST] `this cascade MUST be bounded`", note = """
NOT A SPEC MECHANISM AND DECLARED AS SUCH. §7.3's counter is `cascade_depth` on the emission
context — it travels through handlers and across peers (SYSTEM-COMPOSITION §3.4) and is what
we implement. Beside it, `ReactiveEngine` keeps a plain re-entrancy counter bounded at
2 x RECOMMENDED_MAX_CASCADE_DEPTH.

WHY: §7.2's ERROR write passes the emission context UNCHANGED — the pseudocode increments
only on the converged-result path — so a subgraph whose error result feeds its own
dependency recurses with a counter that never moves. On this peer emit delivery is
sync-inline, which makes that a stack overflow rather than a runaway loop.

MEASURED, three arms (`test/reactive.test.ts`, self-feeding subgraph): the spec's counter
alone freezes; the backstop alone freezes; with BOTH disabled the peer dies with
`RangeError: Maximum call stack size exceeded`. So it is genuinely a backstop on the corpus
we have — and the last row is why §7.3's MUST is not decoration.
""" }

initial_evaluation_on_install = { value = "every successful install performs one evaluation before returning", cite = "§3.3's re-installation clause (a SHOULD)", note = """
§3.3 names an initial evaluation only in the re-installation paragraph — *"Implementations
SHOULD also clear any `compute/error` entity at the old result_path and perform an initial
evaluation after installation"* — and is silent for a first install.

We do it on BOTH, so install and re-install are one path. A `result_path` that is absent
until the first dependency happens to change is a second state every downstream reader has
to handle, and doing it uniformly satisfies the re-install SHOULD without a branch that
exists only to satisfy it. The oracle asserts nothing about `result_path` at install time in
either direction, so this is a choice and not a measurement.
""" }

