BARE arm of `make conformance` launches keystone's OWN `test/host.js`
(`languages/typescript/host-entry`), which speaks only the deprecated flag. A one-variable
differential requires both arms to take the same posture, so we cannot move the composed arm
to a declared policy while the bare arm cannot follow. Routed to keystone; not worked around
here (`AGENTS.md`: a peer that cannot host what we need is a finding about the seam, never a
patched peer).

** CORRECTED 2026-09-12 — THERE IS NO DEADLINE, AND THAT IS WORSE THAN A DEADLINE. ** This
