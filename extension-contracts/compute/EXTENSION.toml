note = """
** THE ROW IS NOT ABOUT AN EXTENSION LIMIT. IT IS ABOUT WHAT POSTURE WE CAN MEASURE IN. **
Found 2026-09-11 when the operator challenged this tree's standing claim that
`--debug-open-grants` was what the oracle runs under. It is not the oracle's; it is ours
(`tools/host-launch:137`). And the flag is DEPRECATED — V7 §6.9a, v7.74, **removed in v7.75**.
`entity-core-go`'s own `entity-peer` already marks its spelling `-open-access` as
*"[DEPRECATED in v7.74; removed in v7.75] ... Migrate to --seed-policy / WithSeedPolicy"*
(`cmd/entity-peer/main.go:76`, core-go @ `b320c1e`), and we pass it to the reference peer at
`tools/host-launch:220`.

** THE ASYMMETRY IS THE FINDING, AND IT SPLITS THE WORK IN TWO. ** On `typescript` the seed
policy is a first-class value, so the narrow-grant posture that makes §3.3's Phase 2 check
DISCRIMINATING is available to this repo now — which is why A-17's "unmeasurable" was
downgraded to "unmeasured" in the two rows above. On `python` and `rust` the peer library
offers a boolean and nothing else: you may have `default → *` or the discovery floor, and
**no seed policy in between can be expressed at all**. That is not a posture we can choose.

** AND NO HOST BINARY IN THE COHORT IMPLEMENTS THE REPLACEMENT. ** Measured across the three
conformance hosts keystone ships (@ `0f99563d`): `--seed-policy` is accepted by NONE of them.
`protocol-generator/typescript/test/host.ts` and
`protocol-generator/python/src/entity_core/host.py` both print a deprecation warning naming
`--seed-policy` as the thing to prefer — a flag neither binary has a case for.
`protocol-generator/rust/src/bin/host.rs` `die`s on an unknown argument, so the advice is a
hard exit there. Keystone HAS the cross-peer canonical format already
(`protocol-generator/shared/seed-policy/seed-policy.schema.json` plus three worked examples,
one of which is `examples/debug-open.json`, described in its own `_comment` as *"the explicit,
conformant replacement for the DEPRECATED --debug-open-grants flag ... Use ONLY to drive the
validate-peer grant-gated surface"*). The convention exists; the CLI plumbing does not.

** AND IT IS MEASURED, NOT READ (2026-09-11). ** `make seed-policy`, three arms over
`Permissions.checkPathPermission` on this peer, IN-PROCESS:

    default -> * (deprecated)   in-scope=true   out-of-scope=true    <- the posture we run
    narrow (app/allowed/*)      in-scope=true   out-of-scope=false   <- observable
    discovery floor             in-scope=false  out-of-scope=false   <- the scope IS read

**The third arm is load-bearing and is why this is three arms rather than two.** Without it,
*"narrow refuses"* is equally well explained by a policy that refuses everything, and a
two-arm gate passes either way. The planted-defect control (`--self-test`, the predicate
replaced by `() => true`) reddens the narrow arm and leaves `default -> *` **unmoved** — which
is the point, because the degenerate arm permits both paths whether the predicate works or
not. That insensitivity is the finding stated as a measurement.

**So A-17's downgrade from "unmeasurable" to "unmeasured" is now established rather than
argued.** What the gate does NOT show: that a capability DELIVERED by §4.6 authenticate from a
declared policy reaches an install audit over the wire. That is D13's Reach layer, it needs a
host accepting `--seed-policy`, and no host binary in the cohort has one.

