grant_covers_absent_operation = { value = "python: asks the peer about the empty string, which a non-`*` grant refuses. typescript: skips the operations dimension.", cite = "§3.3 Phase 2 check_grant_covers", note = """
A `compute/apply` with a `path` and no `operation` — which §4.1 rejects at EVALUATION as
`invalid_expression`, so no well-formed graph reaches it.

The two ports differ because they reach the §5.2 conjunction differently. `typescript` walks
`capability.grants` directly, because that peer exposes a `CapabilityToken` with typed grant
records, and skips a dimension it has no value for. Here every scope helper is
leading-underscore, so the four dimensions are asked through the public `check_permission` by
SYNTHESISING an EXECUTE — and an EXECUTE has an `operation` field that is either a string or
absent, with no "do not ask" spelling.

** THE SYNTHESIS IS LEGITIMATE HERE AND WAS NOT IN HISTORY §4.2's CASE, AND THE DIFFERENCE IS
THE SHAPE OF THE QUESTION. ** §4.2 asks about a PATH and the peer has a path-shaped primitive
(`check_path_permission`, our own H9). §3.3 asks about a (handler, operation, resource) TRIPLE,
which IS a dispatch authorization and is exactly what `check_permission` reads off an EXECUTE.
The synthetic entity is a carrier for three arguments; it is never dispatched, signed or sent.

Stricter than the sibling, unreachable for any well-formed graph, and invisible under the `*`
posture the suite runs in. Declared rather than reconciled because a difference nobody wrote
down is the one that becomes a bug report.
