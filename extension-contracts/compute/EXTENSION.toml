containers, naming `compute/apply.args` and `compute/let.bindings` as the two enumerated
exceptions. §3.3's walker was not touched.

CONSEQUENCE, and it is not the same as §7.1's: §3.3's walker builds `read_paths`, which is
what Phase 2 capability-checks. A literal transcription authorizes a `compute/lookup/tree`
at the top level of an expression and SKIPS the same read one function-argument deep. That
