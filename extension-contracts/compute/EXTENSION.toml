malformed_expression_disposition = { value = "python: `compute/error{invalid_expression}` at 200. typescript: an exception out of the handler.", cite = "§2.4 / §3.2 F10", note = """
A required expression field that is absent or the wrong ECF type — `compute/lookup/scope` with
no `name`, `compute/arithmetic` with no `left`. `typescript`'s `Ecf.requireText` THROWS, so
that port answers 5xx; this port raises a private `_Malformed` carrier, catches it at the top
of `_evaluate_inner`, and returns a value at 200.

§2.4 and §3.2's F10 say an evaluation fault is a VALUE, so this port's answer is the faithful
one. No oracle vector reaches it — every `compute` vector sends a well-formed graph — so this
is a worklist item against the other port, not a finding about anyone.
