# ── [conformance] — §9.1's requirement inventory, and what measures each row ────────────
#
# **The axis with the most upstream coverage, and therefore the one nobody was asking about.**
# `entity-core-go`'s `history` category is 34 checks deep, cites HISTORY section numbers, and
# scores 33 of 34 on two of our three targets. It reads like coverage of EXTENSION-HISTORY. The
# question it does not answer — and that nothing anywhere answered before `tools/req-coverage.py`
# — is which of §9.1's own ten requirement rows those 34 checks actually reach.
#
# That is D16's third instance generalised: an axis with SOME upstream coverage is more dangerous
# than one with none, because the coverage is what stops anyone asking. Every row below is
# declared with the check that measures it, a `gap` where the check is weaker than the row, or a
# `note` where nothing measures it at all. **An undeclared row is a gate failure**, so a re-pin
# that adds or re-words a requirement cannot land unnoticed.
#
# `gap` is not a softer `note`. A row with an oracle check AND a gap is reported PARTIAL and never
# counted as covered, because "a check is named after this requirement" and "this requirement is
# measured" are two sentences. Collapsing them is exactly the error the four `context_*` checks
# make, and this file is where we stop repeating it.
#
# Scope of every negative claim here: the executed corpus printed by `./tools/req-coverage.py`
# — 764 checks over 18 categories at the time these rows were written. A check in a category we
# have never run is invisible to this file and would read as absent.

