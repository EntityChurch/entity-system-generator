note   = """NOTHING UPSTREAM MEASURES THIS. v1.8 attaches two REQUIRED vectors to it — \
`HIST-CONFIG-SPECIFICITY-1` (key 1 separates: `a/b/*` over `a/*` at `a/b/c`) and \
`HIST-CONFIG-SPECIFICITY-2` (key 1 TIES and only key 2 separates: `/*/a/*` over `*` at `a/b`) — \
each requiring **both insertion orders**, because "an implementation that returns the first match \
rather than the most specific one passes exactly one order, by luck." No check in the executed \
corpus configures two overlapping patterns at all. **AUTHORED 2026-09-08**, one check per vector, \
both admitted on `python` and `typescript` on their first run. Two things about them are worth \
carrying here rather than only in the check files. \
**They are the first checks whose subject is the RECORDER rather than the handler**: selection \
happens in the emit consumer and the outcome is read at §3.1's head pointer with `system/tree`, \
so nothing in either check touches `system/history:query`. `gates/ext-checks/compare.py` \
consequently flipped its own `rust` line from *"an arm would measure 0 of 3"* to \
*"AN ARM WOULD MEASURE 2 of 5 — this target is worth an arm now"*, which is the trigger it was \
built to produce. \
And **"both insertion orders" is not one thing across the cohort**: `python` and `rust` enumerate \
a listing sorted by segment, `typescript` returns the tree index's insertion order. Each check \
inverts write order and name order together so the deeper config is enumerated last in one \
scenario and first in the other on every peer, and a third scenario inverts `enabled` so the \
404s are attributable to the config selected rather than to the pattern never having matched."""

[[conformance.requirement]]
id     = "HIST-R14"
text   = "Compare specificity as the §6.2 tuple, never as a collapsed scalar"
level  = "MUST"
section = "§6.2"
oracle = []
note   = """Satisfied by construction in all three ports — `pattern_specificity` returns an ordered \
`(literals, depth, canonical)` and `compare_specificity` walks the keys — and **v1.8 says out loud \
that no peer can currently exhibit the divergence this MUST forbids.** Its case analysis over \
§5.4's three admissible pattern families shows a scalar and the tuple agree on every constructible \
pair, and it keeps the MUST as forward-looking: "A specification that claimed otherwise would be \
asking implementers to defend against a case they cannot write a test for." v1.7's worked pair \
(`a/*/c/*/e`) was retracted for using a mid-path spelling that is not a pattern. So this row is \
UNMEASURABLE BY CONSTRUCTION today and is filed that way rather than as a gap: authoring a check \
for it would mean authoring one that cannot fail."""

[[conformance.requirement]]
id     = "HIST-R15"
text   = "Canonicalize a leading-`*` config pattern to `/*/` + remainder"
level  = "MUST"
section = "§2.2"
oracle = []
note   = """**This row is our own routed reading, landed as spec text.** At v1.7 §2.2's pseudocode \
returned a leading-`*` pattern unchanged while §2.2's table said it meant "any peer's namespace", \
and core §5.4 rejects the unchanged spelling by name — so the pattern reached `matches_pattern`, \
matched none of the three wildcard forms, fell through to exact string comparison and matched \
nothing. All three ports implement the TABLE (`*/rest` -> `/*/rest`, and bare `*` tested FIRST so \
it cannot be read as a degenerate peer wildcard), declared as a deviation and routed. v1.8 makes \
both the pseudocode and the table read that way and corrects §2.2's own example from \
`*/project/*` to `/*/project/*`. The deviation is closed; no port changes. Unmeasured upstream — \
a config-selection scenario would reach it, which is HIST-R13's vector."""

[[conformance.requirement]]
