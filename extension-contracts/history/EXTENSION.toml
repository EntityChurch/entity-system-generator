note   = """
NEW AT v1.10, and it is OUR OWN ROUTED FINDING COMING BACK AS SPEC — \
`ROUTING-2026-09-07-arch-the-default-config-audits-the-peers-own-protocol-writes`. We measured, on \
real loopback, that one `system/tree:put` under §6.3's worked `pattern: "*"` produces THREE consumer \
events, two of them the peer's own §3.5 signature bookkeeping, accruing one transition per served \
request forever in a store §3.3 says cannot be pruned.

ARCH REVERSED ITS OWN RECORDED LEAN, and that is the part worth carrying. `ROUTING-2026-09-08-e` \
said the lean was to widen §3.2's self-exclusion guard to "local, engine-written protocol paths" \
with the set enumerated, rather than add a config field. What landed is the config field, because \
core §1.9 makes those paths a CONVENTION -- so the spec does not know the set it would have been \
defaulting, and §6.3's list is "an example for the recommended path convention and deliberately not \
a normative set." A lean is not a ruling, and we recorded it as a lean.

**THE NORMATIVE CONTENT IS THE ORDER, NOT THE MATCHING**, which is why this row is a MUST while the \
exclusion list itself is an example. §2.2 states both halves and says why: two conformant readings \
exist without the sentence, and THEY DIFFER ON A PATH TWO CONFIGURATIONS COVER. The other reading \
folds exclusion into `find_history_config` as a non-match, which continues the search and selects a \
LESS SPECIFIC config -- auditing a path the operator excluded, under a config they wrote to be more \
permissive elsewhere.

MEASURED BY NOTHING UPSTREAM, and the oracle could not reach it today: `grep -i pattern_exclude` \
over the executed corpus returns 0, and the `history` category never writes a config at all -- it \
drives an unconfigured peer, which is also why HIST-R13/HIST-R14 are ours. Routed to `entity-core-go` \
with the config-selection scenario those two already ask for; the same scenario reaches all three.

OURS, in all three ports, five cases each, and ONE OF THE FIVE IS THE ONLY ONE THAT DISCRIMINATES: \
`..._does_not_fall_through_to_a_less_specific_config`. The other four pass under BOTH readings. Each \
port also carries an explicit no-exclusion CONTROL, because every other assertion in the block is \
"nothing was recorded" and that is what a peer recording nothing at all also looks like. Verified by \
planting a defect (the exclusion check disabled) and observing 4 of 5 go red on every port, with the \
control staying green -- D15.

THE THREE RIGS DISAGREE ABOUT ABSOLUTE COUNTS AND THAT IS DECLARED, NOT DRIFT. `python` and \
`typescript` install onto a live peer where a `pattern: "*"` config RECORDS ITS OWN WRITE (§3.2 keeps \
config paths out of the self-guard on purpose), so those two assert DELTAS taken after setup. `rust` \
binds configs before the recorder exists and drives it explicitly, so absolute counts are correct \
there. The first python draft asserted absolute counts and failed -- correctly.
"""
