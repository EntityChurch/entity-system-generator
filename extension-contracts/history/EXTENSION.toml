must = "§6.2 `find_history_config` iterates `list_entities(system/history/config/)`. The spec leaves that ORDER unspecified and MUSTs the selection be independent of it (HIST-R13)."
typescript = "INSERTION ORDER"     # `EntityTree.list` returns a `Map` built by iterating the
                                   # tree index, which is a `Map` in first-write order. So the
                                   # config written first is enumerated first, forever, and a
                                   # config path REBOUND keeps its original position.
python     = "SORTED BY SEGMENT"   # `store.listing`: `rows.sort(key=lambda r: r.segment)`
rust       = "SORTED BY SEGMENT"   # `store.listing`: `out.sort_by(|a, b| a.seg.cmp(&b.seg))`
