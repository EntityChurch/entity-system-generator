**Three peers, two disciplines, and neither is wrong** — §3.9 specifies a listing's contents and
not its order, so both are conformant and an extension that depended on either would be the defect.

The consequence is for the CHECKS rather than for the ports. "Both insertion orders", which is what
§6.2's two REQUIRED vectors demand, is not one lever: write order controls `typescript`, name order
controls `python` and `rust`, and a check that moved only one of them would exercise a single
enumeration on two of the three targets while reading as though it had covered both. Each check
therefore inverts write order and name order TOGETHER — scenario A writes and names the broad config
first, scenario B the deeper one — so the deeper config is enumerated last in one scenario and first
in the other on every peer, without the check knowing which discipline it is talking to.

And one order is unreachable, which is a fact about the COMPOSITION rather than about the peer: the
composition writes `system/history/config/everything` at boot as policy (§6.3), so on an
insertion-ordered peer no config a check writes can ever precede it. A check's discriminating power
is bounded by the composition it runs in. Recorded so the next author does not rediscover it as a
mysterious asymmetry.
"""


