## EXTENSION.toml — HISTORY
##
## The machine-readable contract, against `shared/spec-data/history-v1.10/EXTENSION-HISTORY.md`
## (sha256 11de3057555e64ba8e0f9fb2cb285efe81184a800274680bae8abbfc23029c29).
##
## The v1.8 notes below are kept as the record of that re-pin. The derivation argument they make
## closed at v1.10, when the §3.3 header landed: `[contract]` is now transcribed (see its block).
##
## RE-PINNED v1.7 -> v1.8 on 2026-09-08. See `shared/spec-data/history-v1.8/MANIFEST.md` for the
## whole delta. Three of the changes are readings WE routed, landing as spec text; one is a
## contradiction the re-pin exposed and it is routed rather than resolved here.
##
## [contract] IS DERIVED, NOT TRANSCRIBED, AND EVERY FIELD SAYS FROM WHERE.
##
## `EXTENSION-CONTENT` carries GUIDE-EXTENSION-DEVELOPMENT §3.3's declaration header, so its
## `[contract]` is a projection of a declaration. This spec does not carry that header — it is
## one of 24 that do not. That is a documentation gap and it stops nothing: the spec states
## every fact the header would carry, in its body, normatively, and §9.2 in particular is an
## explicit six-line list of installed types that is a declaration in all but placement.
##
## So: `derived_from` on every field, naming the section. **Two fields are inferred from
## ABSENCE rather than read off a statement** — `points_exposed` and `owned_kinds` — and both
## say so inline. That is the entire cost of the missing header, and it is written down rather
## than smoothed over, because a derivation presented as a transcription is the failure this
## whole file exists to prevent.
##
## The header is routed to arch as a filled-in draft (`ROUTING-2026-09-06-c-arch-*`), with the
## derivation table in `shared/spec-data/history-v1.8/MANIFEST.md` as its proposed content.
## STILL OPEN at v1.8: the §3.3 declaration header did not arrive, so `[contract]` stays derived.

# ── spec_lists_none — this spec ENUMERATES NOTHING, and that is a measured claim ─────
#
# `tools/check-spec-lists.py` (2026-09-10) pins each enumeration a spec makes of its own
# type names, because four of COMPUTE's declared deviations are one amendment failing to
# reach a list. This spec has no such list to pin: it declares no membership predicate,
# because it is a handler extension and not an interpreter — nothing in it has to decide
# *"is this entity one of mine"*.
#
# THE SEARCH, so the claim is a measurement and not a reading:
#
#     $ grep -cnE 'type in \[|match [a-z_.]*\.type:|is_[a-z_]+_type\(' \
#           shared/spec-data/history-v1.10/EXTENSION-HISTORY.md
#     0
#
# The only bracketed lists in this corpus are PATH PATTERNS — HISTORY §7's excluded
# namespaces (`"system/signature/*"`, `"system/capability/grants/*"`, `"system/peer/*"`) —
# which are not type names.
#
# DECLARED RATHER THAN LEFT BLANK, because the gate treats an absent declaration as a
# FAILURE. An extension that simply omitted `[[spec_lists]]` would make R2 go quiet, and
# an instrument that reports OK when it has nothing to read is the exact false green this
# gate exists to prevent. When a re-pin adds a predicate, this key is what has to go.
spec_lists_none = "No type-membership enumeration in this spec. Verified by the grep above at history-v1.10: the extension declares no `is_*_type` predicate because it has no IR to admit. If a re-pin adds one, delete this key and declare the list."

[extension]
name     = "HISTORY"
spec     = "EXTENSION-HISTORY.md"
version  = "1.10"
snapshot = "history-v1.10"
grade    = "active"                  # spec header "**Status**: Active". NOTE: this spec has no
                                     # "Conformance grade:" line at all — CONTENT and TYPE are the
                                     # only two that do. `active` is the Status value, and it is a
                                     # DIFFERENT axis from GUIDE §9's grade. Recorded as the
                                     # document's own word rather than mapped onto CONTENT's scale.

# ── [contract] — TRANSCRIBED at v1.10. Every field is the spec's own declaration. ──────
#
# WAS DERIVED THROUGH v1.8. Arch's §3.3 declaration header (GI-5) closed at 26 of 26 on
# 2026-09-08 and EXTENSION-HISTORY carries the full seven fields, so this block stops
# being our reading of the body text and becomes a transcription of a declaration.
# `[contract.derived_from]` below is KEPT, retitled, and is now a RECONCILIATION rather
# than a justification — it records where each value was read from when we had to derive
# it, beside the landed declaration, because the comparison is the finding.
#
# SIX OF SEVEN AGREED. `points_consumed` DID NOT, and it is the one that names another
# extension: we derived `emit.tree_change` alone; the header declares the emit pathway
# AND the extension-contributed context field `clock`, owned by EXTENSION-CLOCK and typed
# `system/clock/state` (SYSTEM-COMPOSITION §1.5). A derivation cannot see a field another
# document contributes -- absence of a mention here is evidence about THIS spec's text and
# none at all about what CLOCK says it gives us (D12 / L8). Nothing breaks today: no port
# consumes `clock`, and `[substrate]` already records that no peer delivers a context at
# all. See `shared/spec-data/history-v1.10/MANIFEST.md`.
[contract]
depends          = []                # §"Depends": ENTITY-CORE-PROTOCOL v7.19+ only. No extension
                                     # prerequisite — see [core_depends]. §1.2 discusses TREE,
                                     # SUBSCRIPTION and REVISION as RELATIONSHIPS, not dependencies,
                                     # and §8.3 is explicit: "They're independent extensions sharing
                                     # the emit pathway as the integration point."
owned_namespaces = ["system/history/"]
owned_ops        = ["system/history:query", "system/history:rollback"]
owned_types      = [
  "system/history/transition",       # §2.1
  "system/history/config",           # §2.2
  "system/history/query-params",     # §2.3
  "system/history/query-result",     # §2.4
  "system/history/rollback-params",  # §4.3.2
  "system/history/rollback-result",  # §4.3.2
]
owned_kinds      = []
points_exposed   = []
points_consumed  = ["emit.tree_change", "context.clock"]

[contract.derived_from]
# HISTORICAL, and deliberately not deleted. Every [contract] field as we DERIVED it through
# v1.8, and the section it was read out of. Kept beside the landed header so the one field
# that disagreed stays visible: a derivation that was six-for-seven reads as vindication
# unless the seventh is written down next to it.
depends          = "the `**Depends**` header line + §8.3 Independence"
owned_namespaces = "§3.1 (head pointers at `system/history/head/{path}`), §6.1 (config at `system/history/config/{name}`), §4.1 (handler at pattern `system/history`)"
owned_ops        = "§4.1 handler manifest + §9.3 Handler Registered — `query` and `rollback`, with input/output types"
owned_types      = "§9.2 Types Installed — an explicit six-entry list. The per-type section cites are §2.1, §2.2, §2.3, §2.4, §4.3.2, §4.3.2"
points_consumed  = "§5.1 Recording Transitions + SYSTEM-COMPOSITION §2.2 position 4. HISTORY does not register a hook; it IS one. ** INCOMPLETE, measured 2026-09-09 against the landed §3.3 header: this derivation found the emit pathway and MISSED `context.clock`. Both are now in [contract]. **"
# ↓ the two that are readings rather than readings-off
points_exposed   = "INFERRED FROM ABSENCE. Nothing in the document exposes a registration hook for another extension to plug into. §8.3 says extensions share the emit pathway as the integration point, which is the CORE's hook and not one HISTORY owns. If arch's header says otherwise this field is wrong and the gate that would have caught it does not exist. ** CONFIRMED 2026-09-09: the landed header reads `Extension points exposed: none.` The inference-from-absence held HERE -- and the sentence above named the right risk, it just named it for the wrong field. **"
owned_kinds      = "INFERRED FROM ABSENCE. No `properties.kind` value appears anywhere in the document (`grep -c 'properties.kind' EXTENSION-HISTORY.md` -> 0). Same caveat as above. ** CONFIRMED 2026-09-09: `Owned properties.kind values: none.` **"

[core_depends]
protocol = ">=7.19"                  # §"Depends". The emit pathway HISTORY consumes is §6.10 /
                                     # v7.74 §6.13(c); 7.19 is the floor the spec names and we do
                                     # not raise it on our own reading.
cbor     = ">=1.0"                   # §"Encoding": ENTITY-CBOR-ENCODING (ECF). No minimum is
                                     # stated in the header — recorded as the unconstrained floor
                                     # rather than invented. §2.1's content-addressing of the
                                     # transition entity is the only ECF dependence.

# ── [surfaces] — FOUR faces, and the fourth is why this extension was chosen ────────────
# CONTENT had three. HISTORY is the first extension this repo builds that registers an EMIT
# CONSUMER, which is the face `DESIGN-THE-SDK-LAYER` §1 named and nothing had exercised.
[surfaces]
handler        = "system/history"    # §4.1 manifest at the pattern path; index at
                                     # system/handler/system/history
types          = true                # §9.2 — six types, published by the module
sdk            = true                # the in-process surface — see [sdk]
emit_consumers = ["tree_change"]     # §5.1. THE NEW FACE. Position 4 of SYSTEM-COMPOSITION §2.2,
                                     # class "bounded reactive", self-guarded per §3.2.
service_owning = false               # §11.6.9 start/stop not required; the recorder is stateless
                                     # over the peer's tree and content store

[install]
model = "sdk-native"                 # UNCHANGED VALUE, WITHDRAWN AUTHORITY. This comment used to
                                     # read *"same forcing as CONTENT: the wire
                                     # `system/handler:register` op refuses `system/*` patterns
                                     # (core §6.2) and this pattern IS `system/history`. Not a
                                     # choice."* `ENTITY-CORE-PROTOCOL` 0.8.2.13 withdrew that
                                     # reservation entirely; a peer that refuses and a peer that
                                     # permits are both conformant. The two peers we compose
                                     # against still refuse, so nothing about this build changes.
                                     # The reading is in CONTENT's
                                     # `[substrate.wire_install_refusal]`, which is the one home
                                     # for it -- this extension inherits the MEASUREMENT and no
                                     # longer inherits a rule.

# ── [emit_consumer] — the position, the class, and the self-guard ───────────────────────
# All three are normative and NONE of them is in `EXTENSION-HISTORY.md` alone, which is why
# SYSTEM-COMPOSITION.md is in this snapshot.
# ── [requires] — what this extension needs FROM A PEER, by keystone contract name (W-16) ──────
#
# The names are keystone's: `protocol-generator/shared/peer-contract/requirements.toml` (REQUIRED and
# MODULE rows) and `CONTRACT-DRAFT.md` §5 (pending). **We never keep a copy of that vocabulary** —
# `tools/check-eligible.py` reads it out of keystone's tree on every run and fails a name it does
# not define. `make eligible` refuses a composition when any name below meets a report row that is
# not `pass` (`ROUTING-2026-09-13-a-entity-system-generator-the-contract-runs-rust-is-certified-and-what-we-changed-in-your-draft` §0).
#
# `pending` is the honest column: a surface this extension USES that no report certifies, because
# keystone lists it as named-not-measured. It is printed on every run and `--strict-pending` fails
# it. It is not a blessing; it is the list of things we build on without evidence.
#
# CENSUS, not recall: every name cites the call site that needs it. Taken on the `rust` cell
# (2026-09-13) and RE-CENSUSED across all three cells 2026-09-14, when keystone's S3 brought the
# `typescript` and `python` peers under the contract and the re-census this block promised came due
# (`ROUTING-2026-09-13-c-entity-system-generator-typescript-and-python-are-certified-your-pre-contract-declarations-now-fail-and-what-changed-under-your-arms`).
# The contract is the same interface in every language up to spelling, so the NAMES are the
# extension's, not the port's.
#
# **The re-census searched for the SPELLINGS, not for one spelling.** A first pass over the three
# cells reported no consumer registration in either `typescript` cell — which was a fact about the
# pattern (`register_tree_consumer`), not about the cells: `registerTreeConsumer`/`EmitBus` is how
# that target spells it, and all six cells do register one. D14's own declared limit, met in the
# work the limit was written about: a grep proves what it matches, and nothing about how the thing
# you are counting is spelled.
[requires]
contract = "keystone-peer-contract"
required = [
  "install.handler", "install.grant", "install.consumer", "context.contents",
  "context.unforgeable", "event.context", "authority.path_permission", "embed.data",
]
modules  = []
# `embed.data` LEFT this list on 2026-09-14 — see the COMPUTE contract's note. The column stays,
# empty, because `pending` being empty is a fact worth being able to read.
pending  = []

[requires.why]
"install.handler"           = "languages/rust/extensions/history/src/lib.rs install_history -> Peer::register_handler(spec, body).detach()"
"install.grant"             = "src/lib.rs install_history reads the bound grant back from system/capability/grants/{pattern} — §2.1's autonomous capability"
"install.consumer"          = "src/lib.rs install_history -> Store::register_tree_consumer, after construction (the recorder)"
"context.contents"          = "src/handler.rs HandlerRequest::from_context: operation, pattern, caller_capability, exec_context"
"context.unforgeable"       = "src/handler.rs authorises on ctx.caller_capability(), sound only if nothing but the dispatcher builds a context"
"event.context"             = "src/sdk.rs HistoryRecorder::on_tree_change reads ev.context for the carried author/chain"
"authority.path_permission" = "src/handler.rs capability::check_path_permission for the §4.2 read gate"
"embed.data"                = "REQUIRED since keystone 13-b. rust: Store::{bind, bind_with_context, get_at, get_by_hash} in src/; python and typescript the same operations in their own spelling — each port's binding row is in that peer's contract/bindings.toml, echoed into its report. The grant read-back still depends on keystone's tree LAYOUT, which no requirement certifies and embed.data does not cover — W-20"

[emit_consumer.tree_change]
position   = 4                       # SYSTEM-COMPOSITION §2.2: "4. History — bounded reactive
                                     # (record transition, self-guarded)"
class      = "bounded-reactive"      # §2.2 ordering principle: transparent first, bounded next,
                                     # unbounded last
fires_after  = "clock context (2) and clock persistence (3)"
fires_before = "compute (5), structural summaries (6), auto-version (7), subscription (8)"
rationale  = "§2.2(4): 'Records the transition. Writes a history entity, which produces a new event, but the self-guard prevents history recording its own writes.'"
self_guard = "system/history/head"   # §3.2 `is_local_history_path`. NARROWER THAN THE NAMESPACE
                                     # ON PURPOSE: the guard targets engine-written paths
                                     # (`system/history/head*`), NOT all of `system/history/`.
                                     # §3.2: "Configuration paths (system/history/config/*) are
                                     # handler-written via explicit EXECUTE and do not create
                                     # recursion risk -- they SHOULD be recorded as normal
                                     # transitions for audit purposes."
guard_is_local_only = true           # §3.2: the guard fires only for the LOCAL peer's namespace.
                                     # A remote peer's `system/history/` arriving via sync MAY be
                                     # tracked; the resulting head pointer is at
                                     # `/{local}/system/history/head/{remote}/...` and is excluded
                                     # by the same check, so there is no recursion.

# ── [sdk] — the in-process surface ──────────────────────────────────────────────────────
# Same rule as CONTENT: no conformance gate on this face, so THE EXTENSION IS THE INSTRUMENT.
# `reached_by` names the oracle check that exercises each entry.
[sdk.RecordTransition]
cite       = "§5.1 emit_entity"
public     = false                   # module-private: it is the emit consumer's body, reachable
                                     # only from the registered consumer, never from a caller
reached_by = ["history/transition_recorded", "history/chain_two_transitions"]

[sdk.FindHistoryConfig]
cite       = "§6.2 find_history_config + §2.2 pattern specificity"
public     = true
reached_by = []                      # HONESTLY UNMEASURED by the oracle's history category, which
                                     # never configures two competing patterns. The spec's OWN
                                     # required vector HIST-CONFIG-SPECIFICITY-1 (§6.2) covers it
                                     # and does not exist upstream -- so we built it as a unit test
                                     # in both insertion orders. See [assumptions].specificity.

[sdk.QueryHistory]
cite       = "§4.3.1"
public     = true
reached_by = ["history/limit_returns_1", "history/limit_has_more", "history/event_filter_only_created"]

[sdk.Rollback]
cite       = "§4.3.2"
public     = true
reached_by = ["history/rollback_restored_hash", "history/rollback_verify_binding", "history/rollback_new_transition", "history/rollback_invalid_hash_rejected"]

[sdk.IsInHistory]
cite       = "§4.3.2 is_in_history + §7.5 exfiltration prevention"
public     = true
reached_by = ["history/rollback_invalid_hash_rejected"]
note       = "§7.5 is the security clause: rollback may only restore an entity that was previously at that path. The check is what stops rollback being an arbitrary write primitive."

# ── [assumptions] — where the spec did not decide, with the value we emitted ─────────────
[assumptions]
event_vocabulary = { value = "modified -> updated", cite = "§2.1 event table vs core §6.10", note = "THE SPEC AND THE PEER DISAGREE ON A STRING. HISTORY §2.1's event table is created/updated/deleted/accessed; the core emit pathway's TreeChangeEvent eventType is created/modified/deleted (all three peers, measured). `updated` and `modified` are the same event under two names. We map at the consumer boundary and record §2.1's spelling in the transition, because §2.1 is what the transition entity's schema says and the oracle's `chain_latest_event_updated` check reads it. Routed to arch as a naming-alignment note, NOT as a blocker." }
default_events   = { value = ["created", "updated", "deleted"], cite = "§2.2 'Default events' + §5.1", note = "accessed is opt-in; see [substrate.accessed_event]" }
max_walk         = { value = "query: 1000 transitions per call (DEFAULT_MAX_WALK); is_in_history: uncapped", cite = "§2.3 limit (default 50, unbounded above) + §4.3.1 walk + §4.3.2 is_in_history", note = """
A LOCAL BOUND THE SPEC DOES NOT HAVE, DECLARED HERE BECAUSE ALL THREE PORTS CITED THIS ENTRY AND IT DID NOT EXIST
(`git log -S"max_walk ="` on this file: never written; found by the 2026-09-12 cross-port review). `query`'s
`limit` is caller-supplied and unbounded above, so `limit: 2^53` would walk and materialise the whole chain; the
ports stop at 1000 transitions and set `has_more`, which is §4.3.1's own continuation signal, so a caller loses no
reachable state. **`is_in_history` is NOT capped**, and it was until the same review: a cap there turned a real
rollback target deeper than 1000 transitions into a false `404 not_in_history`, breaking §4.3.2's MUST with no
continuation available. The chain is content-addressed and cannot cycle. Candidate for arch: §2.3's `limit` has no
upper bound and §4.3.1 names no server-side one.
""" }

default_limit    = { value = 50, cite = "§2.3 'Maximum transitions to return. Default: 50'" }
timestamp_source = { value = "wall-clock ms since epoch, from the host", cite = "§2.1 timestamp + §5.1 system_clock_ms()", note = "§2.1's `clock` field is ABSENT in our transitions: it is `optional: true` and explicitly 'Absent when the clock extension is not installed'. CLOCK is not in this composition. The oracle's `transition_clock_structured` check WARNs on all three targets (`languages/rust/compositions/content-history/SYSTEM.toml`, MEASURED 2, names it as the WARN in the tally the other two ports share) -- recorded so that result is not read as a statement about our transitions beyond the absent field." }
specificity      = { value = "three-key tuple (literal segments, total depth, lexicographic)", cite = "§6.2 v1.8 MUST (HIST-R13/HIST-R14)", note = """NO LONGER AN ASSUMPTION -- v1.8 settled it, and settled it the way our own test docstring had already derived. At v1.7 we implemented the tuple, implemented HIST-CONFIG-SPECIFICITY-1 as a unit test in both insertion orders, and recorded in that test that v1.7's worked pair (`a/b/c/d` vs `a/*/c/*/e`) names no path both patterns match -- because a mid-path `*` is not one of core §5.4's three wildcard forms -- and that consequently "scalar and tuple can never disagree on a pair core §5.4 can express". v1.8 RETRACTS that pair for that reason, proves the same non-constructibility by cases over §5.4's three admissible families, and keeps the MUST as forward-looking: "A specification that claimed otherwise would be asking implementers to defend against a case they cannot write a test for." It replaces the vector with `a/b/*` vs `a/*` at `a/b/c` (key 1 separates) and ADDS HIST-CONFIG-SPECIFICITY-2, `*` vs `/*/a/*` at `a/b`, where key 1 ties at 1 and ONLY KEY 2 SEPARATES -- the case v1.7 had no equivalent of. Both are now unit tests in all three ports, both insertion orders, and all three passed on the first run with no code change. Still measured by nothing upstream: see [conformance] HIST-R13.""" }

# ── [substrate] — MUSTs whose satisfiability differs per peer, measured per peer ─────────
#
# THE ONE THAT DECIDED THE SHAPE OF THIS EXTENSION.
#
# §2.1 makes `author` and `capability` NON-OPTIONAL fields of the transition entity, and §9.1
# makes recording them a MUST. Both come from the execution context that §5.1 says the emit
# pathway delivers with the event. On all three peers, it does not.
[substrate.execution_context]
must = "§2.1 + §9.1 MUST -- record `author` and `capability` (and SHOULD `handler`, `operation`, `chain_id`) from the execution context delivered with the tree-change event (§5.1, SYSTEM-COMPOSITION §1.4)"
# UPDATED 2026-09-12. Keystone landed H8 on all three peers on 2026-09-07: each tree-change event now
# has a context slot, filled on the dispatch path and empty for an autonomous write (typescript
# `HandlerContext.emitContext()`, python `ExecContext`, rust `TreeChangeEvent.context:
# Option<ExecContext>`). The three row values below are that source read; what a running peer
# actually delivers is reported by the recorder's `context_observed()`, never declared. The
# comments under each value describe the pre-H8 state and are kept as the record.
typescript = "CONTEXT SLOT, FILLED ON DISPATCH (H8)"
                                     # WAS "FIELD PRESENT, NEVER POPULATED":
                                     # `EmitContext` (src/emit/emit-bus.ts:11) declares chainId,
                                     # parentChainId, author, callerCapability, requestId, bounds,
                                     # cascadeDepth, handlerGrant, handlerPattern, operation --
                                     # the §1.4 inventory almost exactly. And it is CONSTRUCTED AT
                                     # ZERO SITES.
                                     #
                                     # The decisive check is the type, not the call sites:
                                     #   $ grep -rn 'EmitContext' src/ --include=*.ts
                                     #   emit/emit-bus.ts:11   the interface declaration
                                     #   emit/emit-bus.ts:42   the field on TreeChangeEvent
                                     #   emit/emit-bus.ts:103  the parameter of emitTreeChange
                                     #   store/entity-tree.ts:1,34,45  the import + two defaults
                                     # Six occurrences, no constructor, no object literal, no
                                     # caller. `put`/`remove` default it to `null` and
                                     # `compareAndPut` hardcodes `null` at the emit call
                                     # (entity-tree.ts:88).
                                     #
                                     # Call-site count, for extent rather than proof: 18 tree
                                     # writes outside `entity-tree.ts`, none passing a third
                                     # argument. (An earlier draft of this block said 23 and that
                                     # a regex found 5 three-arg calls; the 5 were false positives
                                     # -- the comma was inside `abs(ctx, pattern)`. Corrected, and
                                     # the type-level check above is why the conclusion did not
                                     # move.) So every event carries `context: null`.
python     = "CONTEXT SLOT, FILLED ON DISPATCH (H8)"
                                     # WAS "NO CONTEXT FIELD":
                                     # `TreeEvent` is (event_type, path, new_hash, previous_hash).
                                     # The dataclass is frozen+slots; there is no slot to fill.
rust       = "CONTEXT SLOT, FILLED ON DISPATCH (H8)"
                                     # WAS "NO CONTEXT FIELD":
                                     # `TreeChangeEvent` is (event_type, path, new_hash,
                                     # previous_hash) -- peer/store.rs:34-39, all four fields
                                     # `pub`, and there is no fifth. PORTED 2026-09-07 and the
                                     # row is unchanged by it: the fallback fires on every write,
                                     # and tests/recorder.rs's
                                     # `every_transition_uses_the_autonomous_fallback_and_says_so`
                                     # asserts that it DOES -- so the day a context arrives, that
                                     # test fails and says so.
probe      = "NONE, AND THAT IS THIS ROW'S OWN FINDING"
probe_note = """
**THIS FIELD CITED `languages/<t>/gates/emit-context/probe-*` (dead) FOR A DAY AND THERE HAS
NEVER BEEN A `gates/emit-context` (dead).** The claim was true and was measured; what it cited was a gate somebody
intended to write. D18's first incident, found 2026-09-07 by `tools/check-citations.py` on its
first run -- not by anyone re-reading the block.

WHAT ACTUALLY MEASURED IT, per port, and none of it is a probe:

  typescript  a TYPE-level read, which is the stronger form here: `EmitContext` is declared and
              CONSTRUCTED AT ZERO SITES -- six occurrences, no constructor, no object literal, no
              caller; `put`/`remove` default it to null and `compareAndPut` hardcodes null.
  python      the event dataclass has four fields and is frozen+slots -- there is no slot.
  rust        the event struct has four pub fields and there is no fifth.

**A PROBE IS THE WRONG INSTRUMENT FOR AN ABSENCE AT THE TYPE LEVEL**, which is why none was
written and why claiming one was the error. D13 asks for an executed probe where the claim is that
an installed thing IS consulted; here the claim is that a field does not exist, and on all three
peers the type settles it more strongly than a running program could. What a probe DOES settle on
this axis is the positive half -- that the consumer is reached at all, so a context WOULD have
arrived if there were one -- and that is
`languages/rust/gates/host-seam/src/bin/probe.rs` scenario 4, arms H/I: a wire PUT reaches the
installed consumer with a witness carrying both a request field and registration-time state, and
an identical peer without the consumer answers the follow-up GET 404.
"""
