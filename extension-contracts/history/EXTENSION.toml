  and the recorder is working perfectly.

**A CATEGORY SCORE IS A STATEMENT ABOUT THE ORACLE'S ACCESS PATH, NOT ABOUT THE EXTENSION**, and
on the other two ports the two are the same sentence. Writing the expectation before the run is
what makes the difference legible -- the composition's `[gate.expectation.history]` predicted all
