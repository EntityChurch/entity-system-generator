# ── [sdk_surface] — OUR standard (D16), and the second extension it has covered ──────
#
# `tools/sdk-parity.py`, in `make check`. Every public name in every port is declared in
# exactly one class; an UNDECLARED name is a failure, because the failure this catches is
# a name arriving without anyone deciding.
#
# **THE GATE PAID FOR ITSELF ON ITS FIRST RUN HERE, AND NOT BY FINDING DRIFT.** CONTENT's
# first run reported 18 drifting names, almost all of it one decision — `typescript`
# bundled the type-name and chunking constants into objects, `python` and `rust` exported
# them flat — made once in the first port and never made again. This extension started
# down the identical path: 22 names in both ports, 20 differing, the same bundle-vs-flat
# split. **Because the gate existed, the decision got made instead of accumulating.** The
# flat names are the contract in every port; the grouped objects survive as aliases.
#
# After: 39 in both ports, 3 differing. Command:
#   `./tools/sdk-parity.py extension-contracts/history`
#
# D16's promotion criterion was "if it survives a second extension, that is two incidents
# in two shapes and it goes upstream as a proposal". It did not survive — which is the
# gate working, and it means the proposal still lacks its second incident. Recorded so
# nobody reads 39-of-42 as the evidence D16 was waiting for.

