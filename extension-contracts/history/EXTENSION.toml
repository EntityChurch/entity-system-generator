own authority, in three implementations at once — the cohort failure L18 names, with the
generator as its multiplier. The ports keep emitting `capability_denied`, which is defensible
under core today and was chosen deliberately; the deviation is now DECLARED rather than
silent, and the packet asks arch which document wins.

**And the §9.1 MUST that depends on this is filed `ours`/`gap`, not `covered`.** Claiming a
check measures "emit codes from Appendix A's set" while we knowingly emit outside it would be
the false-coverage shape `[conformance]` exists to prevent.
"""

