"""

[substrate.accessed_event]
must = "§2.1 + §5.2 -- the `accessed` event is recorded on tree READS for paths whose config lists it. §9.1 grades it MAY."
typescript = "NOT REACHABLE FROM AN EMIT CONSUMER"
python     = "NOT REACHABLE FROM AN EMIT CONSUMER"
rust       = "NOT REACHABLE FROM AN EMIT CONSUMER"
note = """
§5.2 puts read-audit inside `handle_get` -- the TREE HANDLER's body -- not in the emit pathway.
The emit pathway fires on the Bind step (§6.10) and a read binds nothing, so no consumer on any
of the three peers observes a read at all. Implementing `accessed` would require either replacing
the peer's tree handler or patching it, and patching a peer is the one thing this repo does not do.

It is a MAY (§9.1), so NOT implementing it is conformant, and `config.events` accepts "accessed"
and simply never matches. Declared here rather than left as a silent hole: the difference between
"we chose not to" and "the substrate cannot" is exactly what [substrate] blocks are for, and this
one is the second.
"""


# ── [error_surface] — AUTHORED. And the finding is what is NOT in it. ───────────────
#
# **HISTORY HAS NO CODE SET AT ALL.** `EXTENSION-CONTENT` gained Appendix A in v3.7 —
# a table that pins its handler's codes, written because "every code in this document was
# undefined by construction of the corpus". `EXTENSION-HISTORY` v1.7 has no such appendix,
# so the `spec` class below is EMPTY and every code this handler emits is either core
# §3.3's or undefined.
#
# That is the second extension's evidence for the same defect, and it makes it a corpus
# problem rather than one document's oversight. Routed as ROUTING-2026-09-06-c-arch-* A-1,
# with this block as the proposed content of HISTORY's Appendix A.
#
# Measured: `./tools/check-error-codes.py`

[error_surface]
# Class 1 — SPEC. Defined in this extension's own code set. THERE IS NO CODE SET.
spec = []

# Class 2 — CORE. `ENTITY-CORE-PROTOCOL` §3.3's status table, which enumerates its
# more-specific codes by name.
#   unexpected_params      §3.3's 400 row, named
#   capability_denied      §3.3's 403 row default; §4.2's dual check denies with it
#   unsupported_operation  §3.3's 501 row default
#   storage_error          §3.3's 500 row, named — "a content-store or tree bind/read
#                          failed". Used for a rollback target that IS in the chain but
#                          whose entity has been GC'd (§3.3), which is neither a 404 nor
#                          CONTENT's `blob_not_found` — see handler.ts for why borrowing
#                          another extension's code would be wrong under §8.3 independence.
core = ["unexpected_params", "capability_denied", "unsupported_operation", "storage_error"]

# Class 3 — UNRESOLVED. Emitted, named by the spec, defined in NO spec code set.
unresolved = ["path_required", "not_in_history"]

[error_surface.unresolved_detail."path_required"]
dated  = "2026-09-06"
routed = "ROUTING-2026-09-06-b-arch-the-code-set-that-omits-the-code-it-musts"
note = """
Identical to CONTENT's instance and carried for the same reason: GUIDE-EXTENSION-DEVELOPMENT
§4.1 makes a resource-less directly-callable op a `400 path_required` and calls itself the
authority; core §3.3's 400 row does not enumerate it. §4.3.1's and §4.3.2's EXECUTE examples
both carry a `resource`, so the rule applies here.

**The SECOND extension inheriting one unresolved code is the argument that it is a corpus
fact rather than a CONTENT quirk.** Same routing packet, now with two call sites.
"""

[error_surface.unresolved_detail."not_in_history"]
dated  = "2026-09-06"
routed = "ROUTING-2026-09-06-c-arch-the-second-extension-and-what-the-emit-face-measured"
emitted_by = "the rollback path, §4.3.2"
asserted_by = "entity-core-go `history` category, `rollback_invalid_hash_rejected`"
note = """
§4.3.2's algorithm names it directly — `return error(404, "not_in_history", "Target hash not
found in history for this path")` — so unlike `path_required` there is no ambiguity about
what to emit. What is missing is a TABLE: the spec has no Appendix A, so under core §3.3's
default-code force the string is a more-specific 404 that no spec code set defines, and
§3.3's 404 default is `handler_not_found` — which would be actively wrong here.

We emit `not_in_history` because the spec's own pseudocode does and the oracle asserts it.
It is `unresolved` rather than `spec` because pseudocode is not a code set, and that
distinction is the whole content of CONTENT v3.7's Appendix A.

**§7.5 is why this code matters more than most.** It is the refusal that stops rollback
being an unrestricted write primitive; a caller has to be able to tell it apart from a
storage failure, and a code nothing defines is a code an implementation may spell
differently.
"""


# ── [sdk_surface] — OUR standard (D16), and the second extension it has covered ──────
#
# `tools/sdk-parity.py`, in `make check`. Every public name in every port is declared in
# exactly one class; an UNDECLARED name is a failure, because the failure this catches is
# a name arriving without anyone deciding.
#
# **THE GATE PAID FOR ITSELF ON ITS FIRST RUN HERE, AND NOT BY FINDING DRIFT.** CONTENT's
# first run reported 18 drifting names, almost all of it one decision — `typescript`
# bundled the type-name and chunking constants into objects, `python` and `rust` exported
# them flat — made once in the first port and never made again. This extension started
# down the identical path: 22 names in both ports, 20 differing, the same bundle-vs-flat
# split. **Because the gate existed, the decision got made instead of accumulating.** The
# flat names are the contract in every port; the grouped objects survive as aliases.
#
# After: 39 in both ports, 3 differing. Command:
#   `./tools/sdk-parity.py extension-contracts/history`
#
# D16's promotion criterion was "if it survives a second extension, that is two incidents
# in two shapes and it goes upstream as a proposal". It did not survive — which is the
# gate working, and it means the proposal still lacks its second incident. Recorded so
# nobody reads 39-of-42 as the evidence D16 was waiting for.

[sdk_surface]
# Class 1 — THE CONTRACT. Every port exports every one of these.
required = [
  "const:all_types",
  "const:config",
  "const:config_prefix",
  "const:default_events",
  "const:default_query_limit",
  "const:event_accessed",
  "const:event_created",
  "const:event_deleted",
  "const:event_updated",
  "const:head_prefix",
  "const:history_pattern",
  "const:query_params",
  "const:query_result",
  "const:rollback_params",
  "const:rollback_result",
  "const:transition",
  "fn:build_context",
  "fn:canonicalize_pattern",
  "fn:compare_specificity",
  "fn:config_path",
  "fn:from_core_event_type",
  "fn:history_config",
  "fn:history_entity",
  "fn:history_type_defs",
  "fn:history_type_entities",
  "fn:pattern_matches",
  "fn:pattern_specificity",
  "fn:publish_history_types",
  "fn:resolve_config",
  "type:history_config",
  "type:history_handler",
  "type:history_recorder",
  "type:recorded_transition",
  "type:recorder_identity",
  "type:recorder_stats",
  "type:specificity",
  "type:transition_context",
]

# Class 2 — SUBSTRATE-CONDITIONAL. Present only where the substrate forces it.
# Exporting one of these from a port NOT listed is a failure: if the substrate does not
# force it, it is not substrate-conditional, it is drift with an excuse.
[sdk_surface.substrate."type:history_handler_options"]
ports  = ["typescript"]
reason = "the options-object constructor idiom. `python` takes `max_walk` as a keyword argument and `rust` has a `HistoryHandler::with_max_walk` constructor — the same configuration with no type to name. Not a choice a port can make differently without stopping being idiomatic."

# ── THE THIRD PORT, 2026-09-07. `install_history` did not survive it. ────────────────
#
# `fn:install_history` and `type:history_installation` were `required` for two ports and
# are now substrate-conditional, for the reason CONTENT's `install_content` already is:
# the function installs the HANDLER face, and on `entity-core-protocol-rust` that face has
# no install path at any visibility. Measured, both arms, `languages/rust/gates/host-seam`.
#
# **The `rust` names are DIFFERENT names, not a narrower version of the same one**, and
# that is the rule CONTENT set: a caller must not be able to write one call that means
# "installed" on two peers and "partly installed" on a third. What is new here is that
# HISTORY installs TWO faces on this peer rather than CONTENT's one, so there are two
# functions and each is named for the face it installs.

[sdk_surface.substrate."fn:install_history"]
ports  = ["typescript", "python"]
reason = "installs the handler face (§11.6.1 writes + the executable body) alongside types and the consumer. `rust` cannot: 501 no_handler_body with all four tree writes bound, 404 with none, and register_handler/Peer::handlers/Outcome are all private (error[E0624]/[E0609]/[E0603]). languages/rust/gates/host-seam."

[sdk_surface.substrate."type:history_installation"]
ports  = ["typescript", "python"]
reason = "the return of install_history; same cause."

[sdk_surface.substrate."fn:install_history_types"]
ports  = ["rust"]
reason = "one of the TWO install faces that work on that peer. Store::bind is public; the handler container is not."

[sdk_surface.substrate."type:history_type_installation"]
ports  = ["rust"]
reason = "the return of install_history_types; same cause."

[sdk_surface.substrate."fn:install_history_recorder"]
ports  = ["rust"]
reason = "the OTHER install face that works there — Store::register_tree_consumer is public and live (host-seam arms D-I). On the other two ports the consumer is registered inside install_history, so there is no separate name. It takes `&Arc<Peer>` and holds a Weak: a closure capturing Arc<Peer> would be owned by that peer's own store, which is a reference cycle a process-lifetime host would never notice."

[sdk_surface.substrate."type:history_recorder_installation"]
ports  = ["rust"]
reason = "the return of install_history_recorder. Carries `context_available` AND `handler_grant_available`; the other two ports' HistoryInstallation carries only the first, because only on this peer is §2.1's 'handler grant' without a referent."

[sdk_surface.substrate."type:carried_context"]
ports  = ["rust"]
reason = "SYSTEM-COMPOSITION §1.4's inventory as a named shape. `typescript` reads `ev.context`, whose type the PEER declares (EmitContext); `python`'s event has no context field and its build_context takes a dict. Here there is neither a peer type to name nor a structural one to pass, so the shape a peer would have to deliver is declared by us. Nothing on any peer constructs one."

[sdk_surface.substrate."type:config_lookup"]
ports  = ["rust"]
reason = "the return of resolve_config. `typescript` returns an inline object literal and `python` a tuple; neither needs a nominal type. This is the same (structural vs nominal) axis as CONTENT's type:frame_budget row."

[sdk_surface.substrate."type:handler_request"]
ports  = ["rust"]
reason = "there is no dispatch context type to receive. The peer passes (&mut Conn, &Envelope) to private code, so the shape a §11.6.1 body would need is ours to declare. Identical to CONTENT's row of the same name, in a second extension — which is the second incident in the same shape, and makes it a peer fact rather than one extension's workaround."

[sdk_surface.substrate."type:history_outcome"]
ports  = ["rust"]
reason = "the peer's own `Outcome` is a bare struct with no `pub` — error[E0603]. The cell cannot name it, construct it, or return it, so it defines its own. D13's Export layer as a compile error rather than a review finding. CONTENT's `type:content_outcome` is the same row; two extensions, one cause."

# Class 3 — DRIFT. Measured, dated, NOT blessed; `--strict-drift` makes each an error.
#
# **Both entries are the SAME decision and it is a decided one**, which is a distinction
# this gate has no class for: `drift` means "measured, unresolved", and these are
# resolved — the flat constants are the contract (see `required`) and these are ergonomic
# groupings a `typescript` caller may prefer. They are filed here rather than in
# `substrate` because nothing about the substrate forces them; a future port may add its
# own grouping or none.
#
# **The missing class is the finding.** `sdk-parity` has required / substrate / drift and
# no way to say "an alias, deliberately, in one port". Filing a decided difference as
# undecided is the same shape as reporting `unknown` for a measured value — recorded here
# rather than fixed, because a fourth class is a change to a shared instrument and this is
# one extension's evidence for it.
[sdk_surface.drift."type:history_types"]
note = "ts grouping object over the six flat type-path constants, which are `required` and are the contract. Decided, not undecided — see the block comment above."
[sdk_surface.drift."type:history_event"]
note = "ts grouping object over the four flat EVENT_* constants; same decision, same reason."
[sdk_surface.drift."const:operations"]
note = "rust exports the §4.1 op list as a module const; ts carries it as an instance field (`HistoryHandler.operations`, which also carries the input/output types) and py as a class attribute (`HistoryHandler.OPERATIONS`). **CONTENT filed the identical difference as drift** and this is the second extension to reproduce it, which makes it a candidate for a decision rather than a third entry: the ts form carries MORE information than the other two (the §4.1 manifest's input/output types, not just the names), so the resolution is probably to give all three the richer shape rather than to pick a spelling. Not decided here — one instrument, two extensions, and the decision belongs with whoever writes the third."

# ── [conformance] — §9.1's requirement inventory, and what measures each row ────────────
#
# **The axis with the most upstream coverage, and therefore the one nobody was asking about.**
# `entity-core-go`'s `history` category is 34 checks deep, cites HISTORY section numbers, and
# scores 33 of 34 on two of our three targets. It reads like coverage of EXTENSION-HISTORY. The
# question it does not answer — and that nothing anywhere answered before `tools/req-coverage.py`
# — is which of §9.1's own ten requirement rows those 34 checks actually reach.
#
# That is D16's third instance generalised: an axis with SOME upstream coverage is more dangerous
# than one with none, because the coverage is what stops anyone asking. Every row below is
# declared with the check that measures it, a `gap` where the check is weaker than the row, or a
# `note` where nothing measures it at all. **An undeclared row is a gate failure**, so a re-pin
# that adds or re-words a requirement cannot land unnoticed.
#
# `gap` is not a softer `note`. A row with an oracle check AND a gap is reported PARTIAL and never
# counted as covered, because "a check is named after this requirement" and "this requirement is
# measured" are two sentences. Collapsing them is exactly the error the four `context_*` checks
# make, and this file is where we stop repeating it.
#
# Scope of every negative claim here: the executed corpus printed by `./tools/req-coverage.py`
# — 764 checks over 18 categories at the time these rows were written. A check in a category we
# have never run is invisible to this file and would read as absent.

[conformance]
spec_file       = "EXTENSION-HISTORY.md"
section         = "9.1"
shape           = "level-table"
oracle_category = "history"

# ── MUST ────────────────────────────────────────────────────────────────────────────────

[[conformance.requirement]]
id     = "H-R1"
text   = "Store transition entities in content store"
oracle = ["transition_recorded", "transition_hash_matches"]
gap    = """PARTIAL — neither check reads WHERE the transition is stored. `transition_recorded` \
counts transitions returned by `system/history:query`; `transition_hash_matches` compares the \
transition's hash to the put entity's. §3.1 requires the CONTENT STORE specifically, and a port \
that materialised transitions in the entity tree would pass both. `grep content_store` over the \
executed corpus returns 0."""

[[conformance.requirement]]
id     = "H-R2"
text   = "Store head pointers at `system/history/head/{path}`"
oracle = ["head_pointer_set"]
gap    = """PARTIAL — the check reads the head pointer out of the QUERY RESULT ("head pointer set \
in query result"), not out of the tree at `system/history/head/{path}`. The path clause is the \
half that matters for interop: it is how another extension or another peer finds the head without \
going through this extension's handler, and on `rust` — where the handler face is not installable \
— it is the ONLY way. Unmeasured."""

[[conformance.requirement]]
id     = "H-R3"
text   = "Record `author`, `capability`, `timestamp` in transitions"
oracle = ["context_author_present", "context_capability_present", "transition_has_timestamp"]
gap    = """PARTIAL, and this is the row we routed. All three are presence checks — `IsZero()` / \
`== ""` — and none compares a value to anything. A peer that records §2.1's AUTONOMOUS reading for \
every write, including one that arrived over the wire from a remote caller, produces a well-formed \
chained content-addressed transition whose `author` is a lie and passes all three. We proved it \
rather than suspected it: the three checks passed identically before and after keystone's H8 \
landed and all three ports began consuming a real execution context. \
`ROUTING-2026-09-07-b-core-go-the-context-checks-assert-presence-not-provenance.md`."""

[[conformance.requirement]]
id     = "H-R4"
text   = "Exclude local peer's `system/history/*` from history recording"
oracle = []
note   = """NOTHING MEASURES THIS, and it is a MUST. `grep -i recurs` over the executed corpus \
returns 0; no check in `history` or any other category writes to a `system/history/*` path and \
asserts that no transition was recorded for it. §3.2 is the recursion-prevention clause: the \
recorder writes head pointers into `system/history/head/...`, so a port that failed to exclude its \
own namespace would record a transition for each head-pointer write, whose head-pointer write \
records another. Our three ports assert it in their own unit tests, which is our code checking our \
code (L18). Routed to `entity-core-go` — see docs/status/ROUTING-2026-09-07-c-core-go-*."""

[[conformance.requirement]]
id     = "H-R5"
text   = "Dual capability check on all operations"
oracle = []
note   = """NOTHING MEASURES THIS, and it is a MUST. `grep -i dual` over the executed corpus \
returns 0. §4.2 and §7.1 require BOTH the caller's grant for the history operation AND the \
underlying path's read grant; the `history` category drives `query` and `rollback` with a grant \
that satisfies both, and never drives the case that separates them — a caller authorized for \
`system/history:query` but not for the path whose history it asks for. That is the case §7.5 calls \
exfiltration. Routed alongside H-R4."""

[[conformance.requirement]]
id     = "H-R6"
text   = "Validate rollback target is in path history"
oracle = ["rollback_invalid_hash_rejected"]
gap    = """PARTIAL, in two directions. The check plants a syntactically invalid hash and requires \
a non-200; §7.5's requirement is that the target be in THIS PATH's history, and a hash that is \
perfectly valid but belongs to a DIFFERENT path is the exfiltration case the clause exists for. It \
is not exercised. And this is the single check that PASSES on a peer with NO history handler at \
all, because `404 handler_not_found` is not 200 — 1 of 34 in the bare arm on every target. Routed \
as G-1 in `ROUTING-2026-09-07-core-go-the-history-category-on-a-peer-that-has-the-types-and-not-the-handler.md`."""

# ── SHOULD ──────────────────────────────────────────────────────────────────────────────

[[conformance.requirement]]
id     = "H-R7"
text   = "Record `caller_capability` when it differs from `capability`"
oracle = ["w6_caller_cap_absent"]
gap    = """The only check in this category that COMPARES rather than asserts presence, and the \
only one measuring the negative half of the row — §5.1: when `caller_capability` would equal \
`capability` (a caller-authorized write) it is OMITTED. The positive half — a handler-authorized \
write inside an externally-triggered chain, where the two differ and `caller_capability` MUST be \
recorded — is driven by nothing. **This check is FAILING on `typescript` and `python` as of \
2026-09-07T17:41 and the failure is ours**, introduced by the §9.1 execution-context work earlier \
the same day; see docs/status/HANDOFF-2026-09-07-c-*."""

[[conformance.requirement]]
id     = "H-R8"
text   = "Record `handler`, `operation`, `chain_id` in transitions"
oracle = ["context_handler_present", "context_operation_present"]
gap    = """PARTIAL — the row names three fields and two are checked, both for presence only \
(H-R3's mechanism). Nothing reads `chain_id`, which is the field §5.3 makes the multi-path \
correlation key, so a port that omitted it entirely, or emitted a fresh one per write instead of \
propagating the chain's, scores identically."""

[[conformance.requirement]]
id     = "H-R9"
text   = "Support `max_depth` pruning"
oracle = []
note   = """NOTHING MEASURES THIS. `grep -i 'prun|depth'` over the executed corpus returns only \
`resource_bounds/r2_chain_depth_over_limit`, which is the core capability-chain depth and \
unrelated. §3.3 is also one of the four defects we routed to arch on 2026-09-06 — it describes an \
IN-PLACE MUTATION of immutable content-addressed entities — so this row is unmeasured upstream and \
unimplementable as written. Our ports implement the reachable reading and say so."""

# ── MAY ─────────────────────────────────────────────────────────────────────────────────

[[conformance.requirement]]
id     = "H-R10"
text   = 'Support `"accessed"` event type'
oracle = []
note   = """Nothing measures it: `grep -i accessed` over the executed corpus returns 0, and \
`event_filter_only_created` filters on `created`. MAY, so this is reported and never failed — \
§5.2's audit mode is optional by the spec's own word. Recorded because "no check" and "no \
requirement" are different facts and only one of them is a gap."""
