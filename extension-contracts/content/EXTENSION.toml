## EXTENSION.toml — CONTENT
##
## The machine-readable contract. EVERY field in [contract] is TRANSCRIBED from the
## spec header in `shared/spec-data/content-v3.7/EXTENSION-CONTENT.md`
## (sha256 2a40b22b859b2a74f7de4d1c43b4655cb6ece2b791d7769f27fcc87efa65ee87), not
## authored here. GUIDE-EXTENSION-DEVELOPMENT §3.3 requires each spec to declare its
## depends / owned namespaces / owned kinds / owned ops / extension points; this file is a
## projection of that declaration, and the projection is checkable against its source.
##
## RE-PINNED v3.6 -> v3.7 on 2026-09-06. The [contract] block below is UNCHANGED by that
## move and that is a measured fact, not an assumption: the 38-line diff touches the version
## header, one status code in §6.4's pseudocode, and an appended Appendix A. It does not
## touch a single §3.3 header field. See `shared/spec-data/content-v3.7/MANIFEST.md`.
##
## Everything below [contract] IS authored here, and each block says why it exists.

# ── spec_lists_none — this spec ENUMERATES NOTHING, and that is a measured claim ─────
#
# `tools/check-spec-lists.py` (2026-09-10) pins each enumeration a spec makes of its own
# type names, because four of COMPUTE's declared deviations are one amendment failing to
# reach a list. This spec has no such list to pin: it declares no membership predicate,
# because it is a handler extension and not an interpreter — nothing in it has to decide
# *"is this entity one of mine"*.
#
# THE SEARCH, so the claim is a measurement and not a reading:
#
#     $ grep -cnE 'type in \[|match [a-z_.]*\.type:|is_[a-z_]+_type\(' \
#           shared/spec-data/content-v3.7/EXTENSION-CONTENT.md
#     0
#
# The only bracketed lists in this corpus are PATH PATTERNS — HISTORY §7's excluded
# namespaces (`"system/signature/*"`, `"system/capability/grants/*"`, `"system/peer/*"`) —
# which are not type names.
#
# DECLARED RATHER THAN LEFT BLANK, because the gate treats an absent declaration as a
# FAILURE. An extension that simply omitted `[[spec_lists]]` would make R2 go quiet, and
# an instrument that reports OK when it has nothing to read is the exact false green this
# gate exists to prevent. When a re-pin adds a predicate, this key is what has to go.
spec_lists_none = "No type-membership enumeration in this spec. Verified by the grep above at content-v3.7: the extension declares no `is_*_type` predicate because it has no IR to admit. If a re-pin adds one, delete this key and declare the list."

[extension]
name    = "CONTENT"
spec    = "EXTENSION-CONTENT.md"
version = "3.7"                      # see the snapshot's §12 history table
snapshot = "content-v3.7"            # shared/spec-data/<snapshot>/ — the pinned input
                                     # `content-v3.6` stays on disk: it is the input the three
                                     # cycle-1 conformance reports were measured against, and
                                     # deleting it would make those numbers unreproducible.
grade   = "draft"                    # spec header "Conformance grade: Draft" (GUIDE §9)
                                     # draft means: expect defects, and four have already been routed

# ── [contract] — transcribed. Do not edit without re-reading the snapshot. ──────────────
[contract]
depends          = []                # no EXTENSION prerequisite. The spec's "Depends" names
                                     # ENTITY-CORE-PROTOCOL v7.51+ and ENTITY-CBOR-ENCODING v1.4+,
                                     # which are the CORE, not extensions — see [core_depends].
owned_namespaces = ["system/content/"]
owned_ops        = ["system/content:get", "system/content:ingest"]
owned_types      = [
  "system/content/blob",              # §2.1  — §11.1 MUST
  "system/content/chunk",             # §2.2  — §11.1 MUST
  "system/content/descriptor",        # §2.4  — v3.5 A1
  "system/content/get-request",        # §6.2
  "system/content/content-response",   # §6.2
  "system/content/ingest-request",     # §6.3
  "system/content/ingest-result",      # §6.3
]
owned_kinds      = []                # spec declares none
points_exposed   = []                # spec header: "Extension points exposed: None."
points_consumed  = []                # spec header: "Extension points consumed: None."

[core_depends]                       # kept OUT of `depends` on purpose: the closure resolver in
                                     # `compositions/` resolves extension prerequisites, and a core
                                     # version floor is a different check with a different failure.
protocol = ">=7.51"                  # request-side envelope-`included` preservation (v3.4 ingest
                                     # result pass-through + the §4 handler-mediated included map)
cbor     = ">=1.4"                   # canonical ECF for blob/chunk entity-hash stability

# ── [contract.error_codes] — TRANSCRIBED from Appendix A, arrived with v3.7 ─────────────
# Appendix A is new in v3.7 and is the extension's first code set. Its own framing: "a
# more-specific code is conformant only where one is DEFINED FOR THE OPERATION IN A SPEC
# CODE SET, and this table is that set for this handler. An undefined spelling is
# non-conformant and falls back to the status's default."
#
# Transcribed as the document states it. Where our ports emit something this table does not
# contain, the discrepancy is recorded in [error_surface] below and routed — NOT reconciled
# by widening this block. A transcription that quietly absorbs the thing it contradicts is
# the failure mode D14 names: a number computed correctly, then copied into a document that
# outlived it.
[contract.error_codes]
"ingest.ambiguous_input" = { status = 400, cite = "§6.3" }
"ingest.missing_input"   = { status = 400, cite = "§6.3" }
"ingest.hash_mismatch"   = { status = 400, cite = "§6.3" }
"get.blob_not_found"     = { status = 404, cite = "§3.4, §7.1" }
"get.blob_pending_sync"  = { status = 503, cite = "§3.4" }
"any.capability_denied"  = { status = 403, cite = "§6.4" }

# Appendix A also rules that `verify_content`'s three §3.3 pseudocode returns —
# `missing_chunk`, `empty_chunk`, `size_mismatch` — are an INTERNAL PREDICATE and not wire
# codes; where such a failure reaches the wire it is `500 storage_error`. All three ports
# already use them exactly that way (they are `ensure_closure` verdicts, never an error
# result), so the ruling cost no code. Recorded because "we already did it right" is only
# knowable if the rule is written down next to the check that would catch it changing.
internal_predicate_returns = ["missing_chunk", "empty_chunk", "size_mismatch"]
internal_predicate_on_wire = { status = 500, code = "storage_error", cite = "Appendix A" }

# ── [error_surface] — AUTHORED. What the ports emit, and where each code is DEFINED ─────
#
# The gate is `tools/check-error-codes.py`, in `make check`. Every code a handler body puts
# on the wire is declared in exactly one class below; an UNDECLARED code is a failure,
# because the failure this exists to catch is a code arriving — or OUTLIVING ITS SPEC —
# without anyone deciding. `forbidden` did exactly that: correct under v3.6, dead under
# v3.7, and nothing in this tree or in the oracle would have said so.
#
# Measured 2026-09-06 across three ports, 36 emit sites, 7 distinct codes, and the codes
# AGREE across all three ports — which is the opposite of what the SDK surface did on its
# first run (18 drifting names). Command:
#   `./tools/check-error-codes.py`
#
# The site counts are not equal and that is expected rather than ignored: `typescript` 8,
# `python` 14, `rust` 14. The two higher ports validate `envelope.included` entry by entry
# with a distinct emit per failure mode where `typescript` funnels through one catch. Same
# codes, different branch granularity — a procedure difference, not a value difference
# (D17's distinction), so it is recorded and not gated.

[error_surface]

# ── [error_surface].spec_table — WHERE THE SPEC'S OWN CODE TABLE IS ─────────────────
#
# Added 2026-09-10. `tools/check-error-codes.py` re-parses this table out of the pinned
# snapshot and fails any code declared class `spec` that the table does not name — the
# third direction on this axis, after emitted-vs-declared and declared-vs-emitted. Until
# it existed the `spec` class was a hand transcription checked against another hand
# transcription, and the pinned bytes every one of those claims cites were read by nothing.
#
# HEADING AND COLUMN are declared rather than inferred, and the gate's own first draft is
# why: it scanned for `| `token` |` document-wide and produced five FALSE REDS — it matched
# two unrelated tables in COMPUTE, and it missed `capability_denied` here entirely, because
# this appendix puts the code in column 2. A false red costs the instrument (AP-4).
spec_table = { heading = "## Appendix A: Error Codes", code_column = 2 }
# Class 1 — SPEC. Defined in this extension's own code set, `[contract.error_codes]` above.
spec = ["ambiguous_input", "missing_input", "hash_mismatch", "capability_denied"]

# Class 2 — CORE. Defined in `ENTITY-CORE-PROTOCOL` §3.3's status table, which enumerates
# its more-specific codes BY NAME. Both of these are in that enumeration:
#   `unexpected_params`     — §3.3's 400 row, named alongside `invalid_path` / `invalid_params`
#   `unsupported_operation` — §3.3's 501 row default; `unknown_operation` is a forbidden synonym
core = ["unexpected_params", "unsupported_operation"]

# Class 3 — UNRESOLVED. Emitted, MUST-ed by the spec, and defined in NO spec code set.
# Named, dated, routed. NOT a blessing: `--strict` turns each entry into an error, and the
# flag is the switch that gets flipped once upstream pins them.
unresolved = ["path_required"]

# ── Class 4 — SPEC-NAMED AND EMITTED BY NO PORT. NEW 2026-09-08 ─────────────────────────
#
# The direction `tools/check-error-codes.py` could not see until the HISTORY v1.8 re-pin:
# it walked emit sites and asked whether each code was DECLARED, so a code the spec's own
# code set names and no port emits was outside its corpus entirely. Adding the reverse
# check found two here, on an extension whose surface we had already measured and published
# as "36 emit sites, 7 distinct codes, and the codes AGREE across all three ports."
#
# Both are `unreachable` rather than `deviation`, and the distinction is the gate's: we do
# not emit a different code for these conditions, we have no wire path that reaches them.
spec_named_not_emitted = ["blob_not_found", "blob_pending_sync"]

[error_surface.spec_named_detail."blob_not_found"]
kind  = "unreachable"
dated = "2026-09-08"
why   = """Appendix A cites it at §3.4 / §7.1 — the blob REASSEMBLY path, not the `get` op. \
§6.2's `get` is a 200 carrying `found` / `missing` arrays: a hash the store does not hold is a \
FIELD IN A SUCCESSFUL RESPONSE, not an error status, so the handler this composition installs \
has no branch that could emit a 404 here. All three ports do produce the token — as an internal \
predicate verdict in the SDK's reassembly (`ReassembleResult` / `ClosureVerdict`), whose caller \
maps it to a terminal 404 — and that caller is an application, which this composition does not \
have. So the code is reachable through the SDK face and not through the handler face; a \
composition that installs a reassembling caller would emit it and this entry would go stale, \
which `stale_not_emitted()` is what catches."""

[error_surface.spec_named_detail."blob_pending_sync"]
kind  = "unreachable"
dated = "2026-09-08"
why   = """Same path as `blob_not_found`, and this one is DECLARED ABSENT ELSEWHERE ALREADY — \
`handler.ts` §6.2's own comment: "`pending` is OPTIONAL and SHOULD be populated only by an \
implementation with sync-state visibility — an active subscription on the namespace plus an \
inbox feeding the content store. This composition has neither, so the field is OMITTED." The \
503 is the status form of that same absent capability. Recorded here so the two statements are \
in one place: we already decided this, in a comment, where no gate could read it."""

[error_surface.unresolved_detail."path_required"]
dated  = "2026-09-06"
routed = "ROUTING-2026-09-06-b-arch-the-code-set-that-omits-the-code-it-musts"
emitted_by = "all three ports, and by the reference implementations"
asserted_by = "entity-core-go `content` category, 2 checks (`get_path_required`, `ingest_path_required`)"
note = """
CONTENT §6.2 and §6.3 each MUST `400 path_required`. It is defined in neither code set the
handler may draw on:

  ENTITY-CORE-PROTOCOL §3.3   `grep -c path_required specs/ENTITY-CORE-PROTOCOL.md` -> 0
  CONTENT v3.7 Appendix A     absent from the table

and Appendix A declares itself closed — "this table is that set for this handler. An
undefined spelling is non-conformant and falls back to the status's default."

GUIDE-EXTENSION-DEVELOPMENT §4.1 (line 171) says "This section is the authority for that
status" and reasons that §3.3's 400 row "sanctions them by name alongside `invalid_params`
and `unexpected_params`". That is an OPEN-CATEGORY reading of the row; Appendix A adopts a
CLOSED-SET reading of the same row. `path_required` is conformant under the first and
non-conformant under the second, and both readings are in the corpus at once.

WE DO NOT PICK. All three ports keep emitting `400 path_required` — it is what the two
MUSTs say, what the oracle asserts, and what changing would break. The contradiction is
routed to arch as a spec issue and recorded here so it cannot be mistaken for settled.
"""

# ── [surfaces] — which of the extension's faces an installed module actually uses ───────
# CONTENT has THREE faces, not four. It registers no emit consumer: "consumer" in this spec
# means a client of content, not a §6.13(c) emit subscriber. Face 3 (emit) arrives with
# HISTORY. Do not add an empty `emit_consumers` module "for symmetry" — an unused face is a
# surface nothing tests.
[surfaces]
handler        = "system/content"    # §6.1 manifest at the pattern path; index at
                                     # system/handler/system/content
types          = true                # the module publishes its own system/type/* entities:
                                     # keystone's registerHandler does NOT write them (measured,
                                     # languages/typescript/gates/host-seam/probe-seam.mjs: type_blob/chunk/descriptor = NO)
sdk            = true                # §3.4 + §4.3 + §5.3 — see [sdk]
emit_consumers = []                  # none. See the paragraph above.
service_owning = false               # §11.6.9 start/stop not required; the handler is stateless
                                     # over the peer's content store

[install]
model = "sdk-native"                 # installed in-process against a live peer object, NOT over the
                                     # wire. THE VALUE IS UNCHANGED; ITS AUTHORITY IS WITHDRAWN.
                                     # See [substrate.wire_install_refusal] and the note below.

# ── [substrate.wire_install_refusal] — was "forced by the spec", is now "refused by two peers" ──
#
# THROUGH 2026-09-09 THIS BLOCK DID NOT EXIST AND `model` CARRIED ITS OWN JUSTIFICATION:
# *"Forced, not chosen: the peer's `system/handler:register` op refuses `system/*` patterns
# (§6.2 'user-installed handlers MUST NOT register at system/* paths')... Every system-namespace
# extension inherits this."* **The sentence it quoted has been withdrawn from the core protocol.**
#
# `ENTITY-CORE-PROTOCOL` 0.8.2.13 (`entity-core-protocol` @ `02ad9a6`) withdraws the reservation
# outright -- both the unscoped form and the dispatch-path-scoped variant -- and §6.13 now reads:
# *"Installation at a `system/*` path is authorized by the same mechanism as any other
# registration... The protocol places no additional constraint on the `system/*` prefix."*
# Its Appendix line is explicit that this is no longer a conformance requirement: *"A peer that
# refuses `system/*` registrations is applying deployment policy and remains conformant; so does
# one that permits them."*
#
# SO THE MEASUREMENT SURVIVES AND THE GENERALISATION DOES NOT. Two peers refuse, measured, and
# each quotes the withdrawn sentence back to the caller in its own error string
# (`protocol-generator/python/src/entity_core/peer/handlers.py` `_is_reserved_system_pattern`;
# `protocol-generator/typescript/src/handlers/handlers-handler.ts:44` -- keystone @ `97bf1a05`).
# *"Every system-namespace extension inherits this"* was a claim about the SPEC and is now a claim
# about A DEPLOYMENT POLICY on 2 of 46 peers, 44 of which are unmeasured. That is D12/L8's shape on
# our own file: a cohort's uniform behaviour is a fact about the cohort, not about the standard.
# ── [requires] — what this extension needs FROM A PEER, by keystone contract name (W-16) ──────
#
# The names are keystone's: `protocol-generator/shared/peer-contract/requirements.toml` (REQUIRED and
# MODULE rows) and `CONTRACT-DRAFT.md` §5 (pending). **We never keep a copy of that vocabulary** —
# `tools/check-eligible.py` reads it out of keystone's tree on every run and fails a name it does
# not define. `make eligible` refuses a composition when any name below meets a report row that is
# not `pass` (`ROUTING-2026-09-13-a-entity-system-generator-the-contract-runs-rust-is-certified-and-what-we-changed-in-your-draft` §0).
#
# `pending` is the honest column: a surface this extension USES that no report certifies, because
# keystone lists it as named-not-measured. It is printed on every run and `--strict-pending` fails
# it. It is not a blessing; it is the list of things we build on without evidence.
#
# CENSUS, not recall: every name cites the call site that needs it. Taken on the `rust` cell
# (2026-09-13) and RE-CENSUSED across all three cells 2026-09-14, when keystone's S3 brought the
# `typescript` and `python` peers under the contract and the re-census this block promised came due
# (`ROUTING-2026-09-13-c-entity-system-generator-typescript-and-python-are-certified-your-pre-contract-declarations-now-fail-and-what-changed-under-your-arms`).
# The contract is the same interface in every language up to spelling, so the NAMES are the
# extension's, not the port's.
#
# **The re-census searched for the SPELLINGS, not for one spelling.** A first pass over the three
# cells reported no consumer registration in either `typescript` cell — which was a fact about the
# pattern (`register_tree_consumer`), not about the cells: `registerTreeConsumer`/`EmitBus` is how
# that target spells it, and all six cells do register one. D14's own declared limit, met in the
# work the limit was written about: a grep proves what it matches, and nothing about how the thing
# you are counting is spelled.
[requires]
contract = "keystone-peer-contract"
required = [
  "install.handler", "context.contents", "context.unforgeable", "context.frame_budget",
  "authority.path_permission", "embed.data",
]
modules  = []
# `embed.data` LEFT this list on 2026-09-14 — see the COMPUTE contract's note. The column stays,
# empty, because `pending` being empty is a fact worth being able to read.
pending  = []

[requires.why]
"install.handler"           = "languages/rust/extensions/content/src/lib.rs install_content -> Peer::register_handler(spec, body).detach()"
"context.contents"          = "src/handler.rs HandlerRequest::from_context: operation, pattern, caller_capability"
"context.unforgeable"       = "§3.4's capability-checking wrapper: src/handler.rs authorises on ctx.caller_capability(), sound only if nothing but the dispatcher builds a context"
"context.frame_budget"      = "src/handler.rs FrameBudget::Enforced(ctx.frame_budget()) — §6.2 Am. 1 batch sizing"
"authority.path_permission" = "src/handler.rs capability::check_path_permission(op, target, cap, CONTENT_PATTERN, local_peer)"
"embed.data"                = "REQUIRED since keystone 13-b. rust: Store::{put_entity, bind, get_at, get_by_hash} in src/; python and typescript the same operations in their own spelling — each port's binding row is in that peer's contract/bindings.toml, echoed into its report. publish_content_types binds types directly rather than through HandlerSpec::with_type (install.types) — W-20"

[substrate.wire_install_refusal]
must         = "NONE -- 0.8.2.13 withdrew the reservation. What remains is a deployment policy the protocol explicitly declines to constrain either way."
typescript   = "REFUSES -- `403 forbidden_pattern`, quoting the withdrawn §6.2 sentence"
python       = "REFUSES -- same, via `_is_reserved_system_pattern`"
# RE-MEASURED 2026-09-12 (second session), keystone `dev` 029d1c7 — H1/H3/H6/H7/H9/K-5 landed on `rust` for our K-9. The comment below this line describes the value this row held BEFORE, and is kept as the record.
rust         = "REFUSES per keystone's own statement (`ROUTING-2026-09-12-a-entity-system-generator-rust-can-install-a-handler-and-h1-status-no-longer-reads-the-wire-probe` §1: the wire register op still refuses `system/*`, deliberately, while the in-process `register_handler` does not). Unmeasured here."
other_peers  = "unknown (43) -- no probe has ever run this on any peer outside the tier-A pair"
consequence  = "`model = 'sdk-native'` is unchanged and is still the only thing that works TODAY on the peers we compose against. It is no longer FORCED, so it is no longer a fact a new extension may inherit without asking."
probe        = "unknown -- no gate in this tree exercises a wire register at a `system/*` pattern. The refusal was read out of peer source and out of a spec sentence, never executed here (D13: a source read decides what to build, never what is true)."

# ── [sdk] — the operation inventory, and the one entry that is a security surface ───────
# There is no conformance gate anywhere on the SDK face and per the operator that is correct:
# the SDK is a convention. So THE EXTENSION IS THE INSTRUMENT — the handler's own conformance
# path runs THROUGH these, not beside them. `reached_by` names which conformance check
# exercises each one. An entry whose `reached_by` is empty is genuinely unmeasured, and that
# set should stay near-empty.
[sdk.EnsureClosure]
cite       = "§3.3 verify_content"
public     = true
reached_by = []                      # CORRECTED 2026-09-12. This read
                                     # ["content/handler_op_get (indirectly, via get)"], and no
                                     # port's handler calls it: `grep -n -i 'ensure_\?closure'`
                                     # over languages/{typescript,python}/extensions/content/handler.*
                                     # and languages/rust/extensions/content/src/handler.rs
                                     # returns nothing. Unmeasured.
note       = "completeness + size consistency. §3.7 classifies it Conformance: the verdict is cross-peer-uniform."

[sdk.AtPeer]
cite       = "§6.4.2 Hash Tree Presence"
public     = true
reached_by = []                      # honestly unmeasured: the oracle's content category never
                                     # exercises namespace scoping. Named so it stays visible.
note       = "namespace binding probe: tree:get({namespace}/{hex(H)}). hex(H) INCLUDES the format byte (66 chars under SHA-256), per §6.4.2 + ENTITY-CORE-PROTOCOL §3.5."

[sdk.Reassemble]
cite       = "§3.4"
public     = false                   # ← THE MUST. NOT NEGOTIABLE, NOT A STYLE QUESTION.
capability_wrapper_required = true
reached_by = []
note = """
§3.4: "Implementations MUST NOT expose `reassemble_content` as a public substrate primitive
callable from third-party / SDK / external consumer code without an explicit capability-checking
wrapper -- direct substrate access bypasses the dispatcher cap discipline and creates a
capability-escalation surface for consumers holding non-root caps."

So the module ships the algorithm as MODULE-PRIVATE. It is not exported from the module's public
entry point in ANY language; the only public route is the SDK's `reassemble_under_capability`
wrapper, which no handler calls today (see [substrate.capability_wrapper] for what that wrapper does
and does not check). The export check is a test on the language's export surface, not a code
review: see languages/typescript/extensions/content/test,
languages/python/extensions/content/test and languages/rust/extensions/content/tests.
"""

# ── [assumptions] — open questions resolved to a value, greppable ───────────────────────
# Every entry is a place the spec did not decide for us. Each carries the value we used, the
# citation, and what would change if the resolution is wrong. NOT a place to record things the
# spec DOES decide.
[assumptions]
chunk_size   = { value = 1048576, cite = "§3.5 + §10.1 DEFAULT_CHUNK_SIZE (v3.6 reconciled both to 1 MiB)", note = "the v3.5 4 MiB reading is dead; §10.1 was the site that had drifted, and v3.6 fixed it" }
chunking_id  = { value = 1, cite = "§2.1 standardized values + §11.2 SHOULD FastCDC", note = "0 = fixed-size is conformant but loses edit-stability" }
path_required = { value = 400, cite = "§6.2/§6.3 MUST, code pinned by GUIDE-EXTENSION-DEVELOPMENT §171", note = "was OURS to route: PROPOSAL-PIN-THE-PATH-REQUIRED-STATUS, landed. The oracle checks the CODE only, not the status, so a peer answering 404 passes the gate and fails the spec." }
topology     = { value = "single-trust-domain", cite = "§6.4.1", note = "OPT-IN AND RESTRICTED. §6.4.1: MUST be documented as opt-in and MUST NOT be the default configuration; multi-party deployments under it are 'out-of-spec and security-defective'. Cycle 1 composes a single-peer conformance target, which is the one place §6.4.1 permits it. Namespace-scoped (§6.4.2) is the production default and is NOT implemented in cycle 1 -- named here so its absence is a declared gap, not a silent one." }
pending_field = { value = "omitted", cite = "§6.2 Amendment 2 sidecar", note = "OPTIONAL and SHOULD-populate only for impls with sync-state visibility. We have none: no subscription, no inbox. §6.2 says a receiver without sync-state awareness MAY omit, and callers then treat all `missing` as terminal 404. Emitting an empty array would ADVERTISE a capability we do not have." }

# ── [substrate] — MUSTs whose satisfiability differs per peer, measured per peer ──────
# Not a TODO list. Each row is a measured fact about a peer, with the probe that measured
# it. D13: a capability claim reads `unknown` unless it cites four sites or an executed
# probe. The block was called `[unimplementable]` for one day — renamed when the answer
# changed, because a block whose name asserts a verdict cannot record the verdict changing.
[substrate.frame_budget]
must = "§6.2 + §4.2 Amendment 1 -- consult the connection's configured budget at response-construction time, NOT a hardcoded 16 MiB literal"
typescript = "satisfiable"           # ctx.frameBudget() -> connection.maxFrameBytes ?? peer.maxFrameBytes
python     = "satisfiable"           # ctx.frame_budget() -> conn.max_frame_bytes ?? peer_max_frame.
                                     # WAS "UNSATISFIABLE" until 2026-09-06: nothing on
                                     # conn/ctx/peer/store carried a budget and wire.MAX_FRAME
                                     # was a module constant equal to the forbidden literal.
                                     # Routed as K-1, closed by keystone, re-measured here.
# RE-MEASURED 2026-09-12 (second session), keystone `dev` 029d1c7 — H1/H3/H6/H7/H9/K-5 landed on `rust` for our K-9. The comment below this line describes the value this row held BEFORE, and is kept as the record.
rust       = "satisfiable"           # HandlerContext::frame_budget() — connection value, peer default fallback; PeerConfig::max_frame_bytes. Probe scenario 3 BY VALUE, both arms.
                                     # AND THIS IS A THIRD VERDICT, not a repeat of K-1.
                                     # `wire::MAX_FRAME` is a pub const == 16,777,216, the
                                     # exact literal the amendment names as wrong, and
                                     # `CreateOptions` has no frame field and `Conn` carries
                                     # none (probe scenario 3). BUT it is also the only bound
                                     # `read_frame` enforces, and it is PUBLIC -- so a body
                                     # reading it reads the number in force. The MUST's
                                     # purpose (do not report a bound you are not enforcing)
                                     # is met; its mechanism (consult the CONNECTION'S
                                     # configured value) has nothing to configure.
                                     # Routed as "make it configurable", NOT as K-1's
                                     # "unimplementable". A different packet on purpose:
                                     # python's body could not see the number at all.
probe      = "languages/python/gates/host-seam/probe-seam.py + probe-seam.mjs + rust/probe-seam-rust.sh"
measured   = "BY VALUE, not by attribute name. The probe configures the peer to enforce 3,145,749 and asserts the body reads back 3,145,749; its negative-control arm builds the peer unconfigured and asserts the body reads 16,777,216, which the scoring REJECTS. The name-matching version of this check went green the day the fix landed and could not have gone red for a peer that stamped MAX_FRAME onto every connection -- that is D15, applied to our own instrument the session after ratifying it. ON `rust` THE BY-VALUE CHECK HAD NO SECOND ARM until keystone's H6 (2026-09-12) added `PeerConfig::max_frame_bytes`; the probe reported UNSATISFIABLE-AND-VACUOUS rather than scoring an arm it could not construct. It now measures both arms by value: `languages/rust/gates/host-seam/src/bin/probe.rs` scenario 3 (H6 by value YES)."

# §3.4 IS TWO CLAUSES, AND THEY DO NOT MOVE TOGETHER. Split at the third port, 2026-09-06,
# because `rust` is the strongest of the three on one clause and the weakest on the other
# -- and a single verdict column would have had to pick one and be wrong about the other.
# Two dynamic substrates could not have shown this: on both, the dispatcher's context type
# was reachable, so clause 2 was free and only clause 1 varied.
[substrate.export_boundary]
must = "§3.4 clause 1 -- reassemble_content MUST NOT be exposed as a public substrate primitive"
typescript = "ENFORCED"              # node's `exports` map: a deep import into internal/
                                     # raises ERR_PACKAGE_PATH_NOT_EXPORTED, and the test
                                     # asserts on the resolver's refusal
python     = "CONVENTION ONLY"       # underscore + __all__ + a test. Python enforces
                                     # nothing; a determined consumer can import
                                     # entity_content._internal.reassemble and it works.
                                     # test_export_surface.py asserts BOTH that the
                                     # convention holds AND that it can be walked around,
                                     # so the two ports' §3.4 claims are not read as equal.
rust       = "ENFORCED BY THE COMPILER"
                                     # `mod internal;` with no `pub`. error[E0603], and
                                     # there is no dynamic route around it at all -- no
                                     # reflection, no runtime import, nothing. STRONGEST of
                                     # the three. Measured by a compile that must FAIL
                                     # (src/bin/deep_import.rs), with tests/sdk.rs as the
                                     # positive control, because a compile-fail check with
                                     # no control reports its strongest result when the
                                     # toolchain is broken (D15).
note = "The same clause, three boundaries, three strengths: a manifest, a promise, and a compiler."

[substrate.capability_wrapper]
must = "§3.4 clause 2 -- reassembly is reachable only behind an EXPLICIT CAPABILITY-CHECKING wrapper, because direct substrate access bypasses the dispatcher cap discipline"
typescript = "CALLER-CONSTRUCTIBLE CONTEXT, NO CAPABILITY CHECK"
                                     # CORRECTED 2026-09-12 (cross-port review). This read
                                     # "DISPATCHER-ANCHORED". `HandlerContext` is exported with a
                                     # public constructor -- our own test/handler.test.ts builds
                                     # one -- and the wrapper checks only `ctx.pattern` and that
                                     # `callerCapability` is non-null, both caller-supplied. It
                                     # never checks the capability against the blob or namespace.
python     = "CALLER-CONSTRUCTIBLE CONTEXT, NO CAPABILITY CHECK"
                                     # CORRECTED 2026-09-12. `DispatchCtx` is a plain dataclass;
                                     # any object with `caller_cap`/`has_cap` passes, `store` is a
                                     # free argument, the handler pattern is never checked.
rust       = "CRATE-ANCHORED ONLY -- AND NOW THE ONLY ONE THAT IS UNFORGEABLE"
                                     # `DispatchAuthority` (private field, pub(crate) ctor) proves
                                     # "you came through this crate's handler", not "the dispatcher
                                     # authorized you". Until keystone's H1 (2026-09-12) there was
                                     # no dispatcher-built value to demand. THERE IS NOW:
                                     # `HandlerContext` has pub(crate) fields and one construction
                                     # site, `Peer::route`, after `check_permission`. Re-anchoring:
                                     # take `&HandlerContext`, require `ctx.pattern() ==
                                     # CONTENT_PATTERN`, call `check_path_permission` against
                                     # `ctx.caller_capability()`. OPEN -- see the handoff.
note = """
**This row's verdict inverted on 2026-09-12, and the old note's framing was wrong.** It said the two
§3.4 clauses invert between substrates (typescript/python strongest on the anchor, rust weakest) and
"both rows are right". The review found the typescript and python contexts are constructible by any
caller, so on the ANCHOR clause rust's crate-private token is the only unforgeable one of three, and
on the CHECK clause no port checks the capability at all. The fix is one design (demand a
dispatcher-built context AND check the capability against the target) applied three times; rust is
the only peer where the first half is available today.
"""

# ── [substrate.faces] — the row the third port added, and the one that reframes the tier ──
# An extension has four faces (docs/DESIGN-THE-SDK-LAYER.md §1). On the first two peers all
# four were available, so "CONTENT installs" was unambiguous and nothing needed this block.
# **On `rust` the four faces get different answers on ONE peer**, which means a per-peer host
# state was always the wrong granularity -- it is per (peer x face).
[substrate.faces]
typescript = { types = "installed", handler = "installed", emit_consumer = "available", sdk = "usable" }
python     = { types = "installed", handler = "installed", emit_consumer = "available", sdk = "usable" }
# RE-MEASURED 2026-09-12 (second session), keystone `dev` 029d1c7 — H1/H3/H6/H7/H9/K-5 landed on `rust` for our K-9. The comment below this line describes the value this row held BEFORE, and is kept as the record. The `measured` text below is the pre-H1 run; scenario 1 is now install -> 200 witness -> unregister -> 404.
rust       = { types = "installed", handler = "installed", emit_consumer = "available", sdk = "usable" }
probe      = "languages/rust/gates/host-seam/probe-seam-rust.sh"
measured   = """
handler, by execution over real loopback TCP, both arms: nothing bound -> 404 handler_not_found;
all four §11.6.1 tree writes bound -> 501 no_handler_body; the same body called DIRECTLY -> 200
with a witness derived from a request field AND a registration-time nonce, invocation counter
0 -> 1. So the dispatch attempt never reached a body, and the counter proves it was never asked.

Access/Read/Export, by rustc, 4 of 4 claims each producing its own error, with a positive
control that MUST compile in the same invocation:
  error[E0624]: method `register_handler` is private
  error[E0609]: no field `handlers` on type `Peer`
  error[E0603]: struct `Outcome` is private
  error[E0624]: method `resolve_handler` is private

emit, by execution with TWO negatives: no consumer registered -> 0 events; an identical
re-bind of the same entity at the same path -> no additional event. The second arm is the one
that separates "the counter tracks events" from "the counter tracks calls", and only the first
is the property §6.10 states.
"""
consequence = "Since keystone's H1 (2026-09-12) `install_content` installs the handler on `rust` through `Peer::register_handler`, which binds the four entities and the body in one call. WAS: The composition REFUSES to perform the four handler writes. Performing them would move the peer from `404 handler_not_found` -- which is true -- to `501 no_handler_body`, which says a handler exists and is broken. Making a peer worse to make a report look more installed is the failure mode `make regression` exists to catch, and doing it deliberately would be worse than tripping it by accident. `tools/compose.py` enforces the refusal by dropping the pattern from the plan when `[system.faces].handler = \"not-installable\"`."

# ── [sdk_surface] — OUR standard, because nobody upstream owns this ──────────────────
#
# `entity-system-architecture` does not mandate the SDK surface and that is CORRECT: arch
# enforces what has to be enforced, conformance lives on the wire, and a cross-impl surface
# oracle would enforce the thing `GUIDE-EXTENSION-DEVELOPMENT` explicitly disclaims. But
# "not required by the spec" and "not required by us" are different sentences. We generate
# N ports of one extension and we want them to be THE SAME EXTENSION, so the standard is
# ours to set -- exactly as the peer host contract was ours to write and keystone's to own.
# If it earns promotion it goes upstream as a proposal with `tools/sdk-parity.py`'s output
# as the evidence.
#
# THE RULE: every public name in every port is declared in exactly one class below. An
# UNDECLARED name is a gate failure, because the failure mode this exists to catch is a
# name arriving without anyone having decided.
#
# Measured 2026-09-06 across three ports: 24 in all three, 27 drifting, union 51.
# Command: `./tools/sdk-parity.py extension-contracts/content`
# Names are compared as `kind:snake_case`. The KIND is load-bearing -- `Blob` is a type and
# `BLOB` is a constant, and the first version of the extractor lowercased both to one key,
# reporting agreement where `typescript` exports no `BLOB` at all.

[sdk_surface]
# Class 1 — THE CONTRACT. Every port exports every one of these; missing from any port is
# a gate failure. This is the operation inventory, and the good news of the first run is
# that it HELD: all 15 functions are in all three ports, across two peers that host a
# handler and one that cannot.
required = [
  # the SDK face (§3.3, §5.3, §6.4.2, §3.4)
  "fn:ensure_closure", "fn:at_peer", "fn:bind_at_peer", "fn:create_descriptor",
  "fn:descriptor_path", "fn:descriptor_matches_anchor", "fn:hash_hex_with_format",
  "fn:reassemble_under_capability",
  # chunking (§3.2, §3.6)
  "fn:gear_table", "fn:cdc_params", "fn:cdc_boundaries",
  "fn:create_blob_fixed", "fn:create_blob_cdc", "fn:store_blob",
  # types (§2, §11.1)
  "fn:publish_content_types",
  # PROMOTED FROM `drift` 2026-09-07, on a second instrument rather than on a second
  # opinion. `gates/type-parity` reads every port's materialised type entities and
  # compares their content hashes; it could measure HISTORY on three ports and CONTENT on
  # two, because `typescript` shipped only the defs form. The drift entry had said, since
  # the day it was filed, that "a consumer cannot write one call that works on all three"
  # -- and the gate turned out to be that consumer. `contentTypeEntities` added to the
  # `typescript` port; the twin `fn:content_type_defs` stays in drift, deliberately, and
  # the reason is on that entry.
  "fn:content_type_entities",
  # the shapes a consumer names
  "type:blob", "type:cdc_params", "type:closure_verdict", "type:content_handler",
  # the constants a consumer must agree with us on
  "const:content_pattern", "const:default_chunk_size",
  "const:min_chunk_size", "const:max_chunk_size", "const:get_batch_size",
  # ── PROMOTED BACK TO `required` 2026-09-12 (second session). The install call and its return
  # were substrate-conditional while `rust` could not host the handler face (`register_handler`
  # private) — a call that meant "installed" on two peers and "partly installed" on the third.
  # Keystone landed H1 on `rust` for K-9, all three ports export the name, and the gate reported
  # the old declaration as a failure on its first run afterwards, which is the refusal working.
  "fn:install_content", "type:content_installation",
]

# Class 2 — SUBSTRATE-CONDITIONAL. Present only where the substrate allows. Exporting one
# of these from a port NOT listed is a failure: if the substrate does not force it, it is
# not substrate-conditional, it is drift with an excuse.

[sdk_surface.substrate."type:content_outcome"]
ports  = ["rust"]
reason = "the body's own return shape, mapped one-for-one onto the peer's `HandlerResult` at the dispatch boundary. It existed because `Outcome` was private (E0603); `HandlerResult` is public since keystone H1, so this is now a CANDIDATE FOR REMOVAL rather than a substrate fact — kept only because the unit tests assert on it. Undecided, recorded."

[sdk_surface.substrate."type:handler_request"]
ports  = ["rust"]
reason = "a third party cannot construct the peer's `HandlerContext` (its fields are `pub(crate)`), so the body is written against a request shape of ours and the unit tests reach it through that; the `Handler` impl builds one from the context on the dispatch path. The other two ports' tests construct the peer's own context. Was: \"there is no dispatch context type\" — true until keystone H1 (2026-09-12)."

[sdk_surface.substrate."type:frame_budget"]
ports  = ["rust"]
reason = "the budget's PROVENANCE carried in a type (CONTENT Am. 1). Since keystone H6 the dispatch path reads `HandlerContext::frame_budget` through `FrameBudget::from_context`, which is what the other two ports' `ctx.frame_budget()` is; the type remains because `HandlerRequest` carries it. Stands or falls with `type:handler_request`."

[sdk_surface.substrate."const:frame_reserve_bytes"]
ports  = ["rust"]
reason = "public only because FrameBudget's unit test needs it. Candidate for demotion to private; recorded rather than left as an accident."

[sdk_surface.substrate."type:dispatch_authority"]
ports  = ["rust"]
reason = "§3.4 clause 2. The other two ports demand the peer's dispatch context, which the dispatcher builds after `check_permission` ALLOWs. This port anchored the wrapper to an unforgeable crate-local token because no such value existed; since keystone H1 a `HandlerContext` does, and re-anchoring `reassemble_under_capability` to it is OPEN — the token is still materially weaker, recorded in [substrate.capability_wrapper]."

# Class 3 — DRIFT. Measured, unresolved, and NOT blessed. `--strict-drift` turns every one
# of these into an error; the flag is off today so the gate is honest on the day it was
# written rather than green because it was scoped around what already passes.
#
# ALMOST ALL OF IT IS ONE DECISION MADE ONCE AND NEVER MADE AGAIN. `typescript` bundles the
# type-name and chunking constants into `ContentTypes` and `Chunking` objects; `python` and
# `rust` export them flat. Same information, two shapes, and until this gate existed nothing
# recorded that a choice had been made at all. That is the class of difference no test
# catches: every port passes its own suite, the oracle never looks at an in-process surface,
# and a consumer writing against two ports finds the third has renamed half its vocabulary.

[sdk_surface.drift."const:blob"]
note = "ts bundles into ContentTypes.BLOB; py/rust export flat"
[sdk_surface.drift."const:chunk"]
note = "same"
[sdk_surface.drift."const:descriptor"]
note = "same"
[sdk_surface.drift."const:get_request"]
note = "same"
[sdk_surface.drift."const:content_response"]
note = "same"
[sdk_surface.drift."const:ingest_request"]
note = "same"
[sdk_surface.drift."const:ingest_result"]
note = "same"
[sdk_surface.drift."const:all_types"]
note = "same; ts has no flat equivalent at all"
[sdk_surface.drift."const:chunking_fixed"]
note = "ts bundles into the Chunking enum; py/rust export flat"
[sdk_surface.drift."const:chunking_fastcdc_nc2"]
note = "same"
[sdk_surface.drift."type:content_types"]
note = "the ts bundle object itself -- the other half of the ten rows above"
[sdk_surface.drift."type:chunking"]
note = "the ts enum -- the other half of the two rows above"
[sdk_surface.drift."fn:content_type_defs"]
note = """ts+rust. Returns declarations; python exports only the entities form. STAYS in \
drift after its twin `fn:content_type_entities` was promoted 2026-09-07, and the \
asymmetry is deliberate rather than unfinished: the entities form returns \
`(name, Entity)` -- a peer type with a content hash, identical in meaning on every port \
-- while the DEFS form returns each port's own builder representation (`TypeDef` objects \
on ts, dicts on python, `Value` on rust). Promoting it would declare a cross-port \
contract over three incompatible shapes, which is a name agreeing while the thing behind \
it does not. Revisit if a consumer ever needs the declarations rather than the entities."""
[sdk_surface.drift."const:operations"]
note = "rust exports the §6.1 op list as a const; ts/py carry it as a class member"
[sdk_surface.drift."fn:create_blob"]
note = "rust convenience for the default target size, which the other two get from a default argument. Harmless and undecided."
[sdk_surface.drift."type:descriptor_fields"]
note = "ts named-argument interface; the other two use keyword/Option parameters"
[sdk_surface.drift."type:content_handler_options"]
note = "ts constructor options object; the other two take positional/keyword args"

# ── [conformance] — §11's requirement inventory, and what measures each row ─────────────
#
# See `extension-contracts/history/EXTENSION.toml [conformance]` for why this block exists and
# what `gap` means. Two things are specific to CONTENT.
#
# **The inventory has a different SHAPE here, and that is itself the finding routed to arch.**
# HISTORY declared §9.1 as one table with a `Level` column; CONTENT declares §11.1-§11.4 as four
# level-named subsections of bullets. Both are machine-readable and neither is machine-readable
# the same way, so `tools/req-coverage.py` carries a parser per spec. At twenty-six extensions
# that is a parser per author's taste. Neither shape gave a row a STABLE ID either, so `C-R7`
# below is OUR invention and cannot be cited by anyone else.
#
# **HALF OF THAT IS FIXED, AND THE HALF THAT IS FIXED IS NOT THIS ONE `[2026-09-09]`.** We filed
# it (`ROUTING-2026-09-07-d`); arch ruled it (GI-11) and landed `SPECIFICATION-FORMAT` v1.3
# §8.5a — a declared id prefix, a `Level` from a closed six, and a `<PREFIX>-R<n>` allocated once
# and never renumbered. **`EXTENSION-HISTORY` v1.9 is the worked reference and now carries real
# `HIST-R<n>` ids**, so this tree's HISTORY rows are keyed to the spec's numbering and our
# `H-R<n>` inventions are retired. A third parser shape, `id-level-table`, was added for it.
#
# **CONTENT IS NOW THE ONE WITHOUT UPSTREAM IDS**, and that is a scheduling fact rather than a
# gap in the standard: §8.5a binds, and §11 has not been re-issued under it. `C-R<n>` stays ours
# until it is. **Note what that costs, because HISTORY just paid it:** without ids the join is by
# requirement TEXT, so a re-worded row at a CONTENT re-pin arrives as one STALE plus one
# UNDECLARED failure rather than as one row that moved — and the quickest way to make that green
# is to paste the new wording over the old mapping, which silently keeps whatever the old row
# claimed was measuring it. Do not do that; `req-coverage`'s rule 0 cannot protect this spec yet.
#
# Also worth carrying: our filing's FIRST CLAUSE WAS WRONG and arch said so. "No declared shape"
# is false — §5.1 has prescribed the section's form since the format standard was written and 19
# of 26 specs follow it. It was a declared shape with NO ENFORCEMENT POINT. "No stable ids" was
# the whole cost. Restating a correct rule changes nothing; giving it a gate changes everything,
# which is D16 stated from the other side.
#
# **The strongest and the weakest rows in this tree are both here.** C-R1/C-R2's
# `type_system_content_*_match` renders the type from `entity-core-go`'s own independent
# transcription of §2.1/§2.2 and compares CONTENT HASHES — the only place in the corpus where an
# extension's types are measured by value rather than by resolution. And four of the thirteen
# `content` checks PASS IN THE BARE ARM, on a peer with no content extension installed at all,
# on all three targets: they measure core-go's own in-process library. That is not a criticism of
# what they measure; it is that `summary.self_checks` reads `0`, so nothing in the output says so.

[conformance]
spec_file       = "EXTENSION-CONTENT.md"
section         = "11"
shape           = "level-sections"
oracle_category = "content"

[conformance.levels]
# DECLARED rather than inferred from the heading text. Inferring "a heading containing MUST is
# the MUST section" is one re-worded heading away from silently dropping eight requirements, and
# the drop presents as a clean run.
"MUST Implement"        = "MUST"
"SHOULD Implement"      = "SHOULD"
"MAY Implement"         = "MAY"
"Implementation-Defined" = "IMPL-DEFINED"

# ── §11.1 MUST ──────────────────────────────────────────────────────────────────────────

[[conformance.requirement]]
id     = "C-R1"
text   = "Content blob type (`system/content/blob`) — creation and parsing (§2.1)"
oracle = ["type_blob", "type_system/type_system_content_blob_fetch",
          "type_system/type_system_content_blob_match"]
gap    = """PARTIAL, and the partiality is on the second clause only. `_match` compares the type \
entity's CONTENT HASH against core-go's own independent transcription of §2.1 — the strongest \
type measurement in the corpus and the one `gates/type-parity` exists to give HISTORY, which has \
no equivalent. What none of the three does is exercise "creation and parsing": no check builds a \
blob from bytes on the peer and reads it back."""

[[conformance.requirement]]
id     = "C-R2"
text   = "Content chunk type (`system/content/chunk`) — creation and parsing (§2.2)"
oracle = ["type_chunk", "type_system/type_system_content_chunk_fetch",
          "type_system/type_system_content_chunk_match"]
gap    = "PARTIAL, identical in shape to C-R1: the type is hash-compared, the round trip is not driven."

[[conformance.requirement]]
id     = "C-R3"
text   = "Content creation algorithm — fixed-size (§3.2) or FastCDC (§3.6)"
oracle = []
ours   = ["gates/chunking-parity"]
note   = """NO ORACLE CHECK CHUNKS ANYTHING — established at `ed9b547` and unchanged in the \
executed corpus, where every name matching `chunk` is a type-definition check. §3.7 makes §3.2 \
and §3.6 Conformance algorithms whose divergence DOES NOT FAIL LOUDLY: every blob still \
reassembles and the peers simply stop deduplicating, with no error and no status code. §3.6.5's \
cross-impl vectors are named in the spec as a Stage-4 byproduct that does not exist. \
`gates/chunking-parity` puts one corpus through every port's §3.6 and compares byte for byte — \
3 ports agreeing on all 6 fields — and it is a CROSS-PORT COHERENCE instrument, never a \
conformance verdict: three of our own transcriptions agreeing is three of our own transcriptions \
agreeing (L18)."""

[[conformance.requirement]]
id     = "C-R4"
text   = "Content entities stored in content store, not entity tree (§3.1)"
oracle = []
note   = """NOTHING MEASURES THIS, and it is a MUST whose whole content is a negative — "not \
entity tree". `grep -i content_store` over the executed corpus returns 0. HISTORY's HIST-R1 is the \
same clause in a second spec with the same absence, which makes it a shape rather than an \
oversight: the corpus has no vocabulary for asserting WHERE an entity lives, because every check \
reaches it through a path that resolves either way."""

[[conformance.requirement]]
id     = "C-R5"
text   = "Content verification — completeness and size consistency (§3.3)"
oracle = []
note   = """NOTHING MEASURES THIS. `descriptor_integrity_check` is §5.3's body-to-path anchor \
mismatch, a different clause, and it is one of the four self-checks (see C-R12). No check \
assembles a blob from its chunks and compares total_size, and none plants a missing chunk."""

[[conformance.requirement]]
id     = "C-R6"
text   = "Handlers returning content refs **MUST** include the blob entity in the response envelope (§5.2)"
oracle = []
ours   = ["extension-contracts/content/checks/get-includes-blob-entity.toml"]
note   = """NOTHING UPSTREAM MEASURES THIS, and it is the clause behind one of the three \
findings we routed to keystone on 2026-09-05: the peer dropped the `included` map at three call \
sites, not the one we named (AP-5). A MUST another team fixed in three places, on our report, \
with nothing that would have caught the regression. **AUTHORED 2026-09-07** — Kind C, admitted \
by the arm rule (composed=pass, bare=fail), and it is NOT a conformance verdict: where the \
oracle has a vector the oracle is the measurement, and here it has none."""

[[conformance.requirement]]
id     = "C-R7"
text   = "Handlers serving content **MUST** validate blob ownership and chunk membership on get-request (§4.4)"
oracle = []
note   = """NOTHING MEASURES THIS, and it is the SECURITY MUST of this extension. `grep -i \
ownership` over the executed corpus returns 0. §4.4 is what stops a caller with a grant on one \
blob's path fetching chunks belonging to another; the `content` category drives `get` twice and \
both times on its error path (`get_path_required`). Same shape as HISTORY's HIST-R9."""

[[conformance.requirement]]
id     = "C-R8"
text   = "`content:ingest` result **MUST** include `root` when called in envelope mode with non-null `envelope.root` (§6.3)"
oracle = []
ours   = ["extension-contracts/content/checks/ingest-returns-root.toml"]
note   = """NOTHING UPSTREAM MEASURES THIS: `ingest_path_required` drives `ingest` with no \
resource and asserts an error code; nothing drives a successful envelope-mode ingest and reads \
the result. **AUTHORED 2026-09-07**, and it is the strongest of the first batch because §6.3 \
states BOTH halves — `root` present in envelope mode, ABSENT in entity mode — so the check \
drives both and a port that always emits `root` fails it. A presence check could not."""

# ── §11.2 SHOULD ────────────────────────────────────────────────────────────────────────

[[conformance.requirement]]
id     = "C-R9"
text   = "FastCDC content-defined chunking with the specified gear table and parameters (§3.6)"
