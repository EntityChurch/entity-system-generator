# gates/chunking-parity/rust — the `rust` arm of the chunking-parity gate.
#
# Its own crate, depending on the cell BY PATH so the probe consumes `entity_content`
# across the crate boundary -- the same discipline the other two arms follow by
# importing the staged package by name rather than reaching into the source tree.
[package]
name    = "chunking-parity-rust"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "probe"
path = "src/main.rs"

[dependencies]
entity-content = { path = "../../../extensions/content/rust" }
sha2           = { version = "=0.10.9", default-features = false }
