# ── NOT declared, deliberately ────────────────────────────────────────────────
#
# `docs/status/**` — dated handoffs, routing packets, trackers, reviews, proposals and
#   the internal ledger. Working memory and in-progress coordination; [ADR-0031] says
#   these are never published, and docs/status/README.md states it in the directory.
#
# `docs/adr/**` — AGENTS-STANDARD is explicit: do not declare anything under docs/adr/.
#   ADRs do not publish. Ecosystem ADRs are cited by number and never copied here.
#
# `docs/archive/**` — superseded documents kept for the breadcrumb, plus the 28 dated
#   handoffs, reviews and conformance snapshots that aged out of docs/status/ on
#   2026-09-17. A reader following an archive index into a withdrawn draft is being sent
#   backwards. Declared as an [[area]] of kind "archive" so it does not age out.
#
# `docs/outbox/**` — the 42 routing packets this repo has SENT, moved out of docs/status/
#   on 2026-09-17. Routing is internal and publishing the corpus is the expensive mistake
#   in the whole doc standard; a check (conform-audit R48) enforces that this directory is
#   never declared, and it keys off the DIRECTORY EXISTING rather than off a declaration,
#   so declaring nothing does not switch it off.
#
# `shared/spec-data/**` — 27 files: the PINNED SPEC SNAPSHOTS we generate against, each
#   with its MANIFEST. Another repo's normative text, vendored by digest. Not ours to
#   publish, and `canon-filter` never considers them anyway — they are prose outside a doc
#   root, which is the class the filter protects. Left undeclared on purpose, and the
#   reason is written here so the next reader does not "fix" it.
