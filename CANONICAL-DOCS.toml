# CANONICAL-DOCS.toml — what in this repo is canonical.
#
# You declare; the release pipeline publishes ([ADR-0031]). Which files reach public
# master, the gates, and the forge push are not ours. This file is the whole interface.
#
# IT IS A KEEP-LIST. `canon-filter` DROPS EVERY ROOT-LEVEL AND `docs/**` MARKDOWN FILE
# NOT NAMED HERE. Absence is a deletion, not an omission — so a durable document left
# undeclared is silently withdrawn from every reader outside this ecosystem.
#
# Everything declared here is addressed to a reader OUTSIDE this ecosystem. Release
# tooling, internal paths, who decided what and when do not belong in a declared file.
# Internal docs under docs/status/ publish nothing and carry no scrub obligation.
#
# `spec pins` is scoped to this keep-list, because this list IS the published surface.
# Run it before a release cut and after adding any commit citation to a declared doc:
#   python3 <arch-tools>/spec-tool/cli.py pins --root . --gate

# ── What each directory IS ([ADR-0021]; new 2026-09-17) ───────────────────────
#
# The doc rules used to carry one hardcoded idea of where documents live -- "dated docs
# belong under a path segment named `status`" -- and were wrong about any repo organised
# differently. These blocks say what a directory is instead of leaving it inferred.
# Longest path prefix wins, so a nested area can differ from its parent.
#
# NOTE, stated rather than discovered later: `[[area]]` is read by `conform-audit`. It is
# NOT read by `canon-filter`, whose doc-root test is an ANCHORED prefix match -- so a
# `status/` directory nested inside `languages/<t>/compositions/<c>/` was never a doc root
# to it and published ungated. That is why the four dated CONFORMANCE snapshots were MOVED
# to `docs/archive/status/` rather than declared in place (W-28). A declaration does not
# change what publishes; only the path does.

[[area]]
path      = "docs/status"
kind      = "status"      # dated, episodic, ages out. Handoffs, reviews, proposals.
publishes = false

[[area]]
path      = "docs/archive"
kind      = "archive"     # dated BY DESIGN and does not age out -- the record.
publishes = false

[[area]]
path      = "docs/outbox"
kind      = "outbox"      # routing packets we SENT. Never published, and a check enforces it.
publishes = false

[[area]]
path      = "docs/agents/memory"
kind      = "memory"      # durable, indexed, opened by trigger. Publishes.
publishes = true

[[area]]
path      = "docs/adr"
kind      = "docs"        # our own ADRs. Durable, and deliberately undeclared -- see the
publishes = false         # NOT-declared note at the foot of this file.

# ── Living docs: durable, edited in place, inside an otherwise-dated area ──────
#
# `internal = true` is the case that had no honest answer before. A tracker is durable AND
# must never publish; the only escape used to be "declare it canonical", which PUBLISHES
# it -- so keeping a tracker, which the routing standard requires, was nagged, and the only
# way to silence the nag was to leak seat-to-seat material.

[[living]]
glob     = "docs/status/TRACKER-*.md"
internal = true

[[living]]
path     = "docs/status/LEDGER-generator-open-work.md"
internal = true           # our open-work ledger: W-1..W-31, rewritten in place every session.

[[living]]
path     = "docs/status/LOG-the-rolling-engineering-narrative.md"
internal = true           # the narrative split out of docs/STATUS.md on 2026-09-17. 1,451
                          # lines written for the next session, not for a public reader.

[[living]]
path     = "docs/status/README.md"
internal = true           # states in the directory itself that nothing here publishes.

[project]
name   = "Entity System Generator"
slug   = "entity-system-generator"
repo   = "entity-system-generator"
github = "https://github.com/EntityChurch/entity-system-generator"
intro  = """
Generating the optional capability layer. This repo builds standard extension
implementations across many languages and installs them onto peers generated by
entity-core-keystone. Where keystone generates a conformant core peer from the three
core spec files, this generates the layer above it from the extension corpus — and is
measured by the complementary half of the same conformance oracle.
"""

