# as the other half of W-28.
#
# They were publishing already and that was the problem: `canon-filter` only ever considers
# prose under a doc root or loose at the top level, so a `README.md` under `gates/` was never
# ELIGIBLE to be dropped -- and `spec pins` is scoped to THIS FILE, so nothing was checking
# what they said either. Undeclared did not mean withheld; it meant published and ungated,
