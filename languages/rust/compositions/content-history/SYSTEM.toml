## SYSTEM.toml — languages/rust/compositions/content-history
##
## THE FIFTH COMPOSITION, and the first one where an extension's WRITE face installed and
## its READ face could not.
##
## At the port (2026-09-07) the emit consumer installed and recorded a real audit chain at
## `system/history/head/*`, but the handler could not be installed, so nothing could read
## that chain over the wire and the `history` category scored 7 of 34 against a working
## recorder. The first [gate.expectation] below is that pre-registration and its result.
##
## Since keystone landed H1 on this peer (2026-09-12) both extensions install every face
## through `install_content` and `install_history`. PRE-REGISTRATION 2 and MEASURED 2, above
## the baselines, record the first run with the handler installed.
##
## The resolved plan is DERIVED by `tools/compose.py` into
## `languages/rust/output/content-history/PLAN.json`.

[system]
name       = "content-history"
extensions = ["CONTENT", "HISTORY"]

[system.peer]
generator = "entity-core-keystone"
# Read-only, another team's tree. Consumed as a CRATE by path dependency, which is this
# language's packaging boundary.
path      = "../entity-core-keystone/protocol-generator/rust"

# ── [system.consumers] — SYSTEM-COMPOSITION §2.2 ────────────────────────────────────
#
# HISTORY is position 4. The peer's consumer list is a `Vec` and
# `Store::register_tree_consumer` PUSHES — no position argument, nothing that could
# enforce or check one. With a single consumer that is vacuous and saying so is the
# point: the first composition that could demonstrate the ordering is CONTENT + CLOCK +
# HISTORY.
[system.consumers]
order = ["HISTORY"]
positions = { HISTORY = 4 }
enforced_by = "the wiring program's call order — NOT by the peer"
note = """
Identical to the `typescript` and `python` compositions, and the identical-ness is a
finding rather than a copy: three peers, three consumer mechanisms (an `EmitBus` class, a
callback list, a `Vec<Box<dyn Fn>>`), and NONE of them takes a position. Nine ordered
positions are normative in SYSTEM-COMPOSITION §2.2 and no peer in the cohort has a place
to put one. Routed to keystone.
"""

# ── [system.faces] — per (extension x face), because a peer answers per face (D13) ──
#
# **`emit_consumer = "installed"` on `rust` is new here**, and it is the row cycle 1
# recorded as `available-unused`: measured live with two negatives, and used by nothing
# because CONTENT registers no consumer. HISTORY registers one, so the row moves from a
# capability we measured and did not use to one we are using.
#
# It moved on the strength of a measurement that did not exist in cycle 1 either.
# `gates/host-seam` arm G, added for this port: a consumer that WRITES to the store it is
# called from. `Store::fire` holds `consumers.read()` across the callback and a `bind`
# from inside re-enters it, which `std::sync::RwLock` documents as a possible panic and
# its futex implementation could deadlock. The arm ran that shape behind a 5-second
# timeout — because the failure it was looking for is a hang, and a probe that hangs
# reports nothing — and the seam held. Reading `store.rs` would have suggested the same
# answer and would not have been evidence for it.
# ** RE-DECLARED 2026-09-12 (second session). ** `handler` read `not-installable` for both
# extensions until keystone made `Peer::register_handler` public for K-9
# (`ROUTING-2026-09-12-a-entity-system-generator-rust-can-install-a-handler-and-h1-status-no-longer-reads-the-wire-probe`).
# Both now go in through `install_content` / `install_history`.
[system.faces.CONTENT]
types         = "installed"
handler       = "installed"
emit_consumer = "not-installed"     # CONTENT registers none; [surfaces].emit_consumers = []
sdk           = "installed"

[system.faces.HISTORY]
types         = "installed"
handler       = "installed"         # the read face, which was the one that could not install
emit_consumer = "installed"
sdk           = "installed"

[gate]
oracle     = "entity-core-go validate-peer"
# THREE categories, and the third is not decoration.
#   type_system  where CONTENT's six type checks move
#   content      CONTENT's type and handler checks
#   history      HISTORY's type checks and, through the query op, the recorder's transitions
#                (until H1 on 2026-09-12 the handler checks in both could not move here)
categories = ["type_system", "content", "history"]
profiles   = ["core"]

# ── [gate.expectation] — WRITTEN BEFORE THE RUN ─────────────────────────────────────
#
# `rs-content` got its prediction wrong in a way that produced a correction worth more
# than the prediction, and the miss was kept. Same rule here.
#
# The BARE arm is not a guess: `typescript` and `python` both measured
# `history` bare = 29 FAIL · 1 PASS · 4 SKIP of 34 in this session's `make check-all`
# (`languages/typescript/output/content-history/reports/bare-history-1.json`). A bare
# `rust` peer differs from those only in ways the history category never touches, so the
# bare arm is predicted to be the same three numbers.

[gate.expectation.history]
checks         = 34
measures_us    = 6
predicted_pass = 7
predicted_fail = 23
predicted_skip = 4
predicted = """
SIX checks move, all FAIL -> PASS, and they are the six `type_*` checks:
`type_transition`, `type_config`, `type_query_params`, `type_query_result`,
`type_rollback_params`, `type_rollback_result`. Those are `client.TreeGet` on
`system/type/system/history/*` (history.go:120-129) and nothing else — they assert the
paths RESOLVE. `Store::bind` is public, so they resolve.

NOTHING ELSE MOVES, and the composed arm must equal the bare arm on all 28 others:

  4 SKIP  handler_manifest_present is `optionalManifestPresent`, which SKIPs when the
          manifest is absent (S1: "absence of an optional extension is conformant"), and
          `Require` propagates a SKIP to the three dependents.

  23 FAIL `transition_recorded`, `chain_two_transitions`, `limit_returns_1`,
          `event_filter_only_created`, `rollback_restored_hash` and `w6_caller_cap_absent`
          each call `historyQuery`/`historyRollback` DIRECTLY — they do not Require the
          manifest — so they FAIL rather than skip, and `BlockCheck` propagates severity
          **Fail** to their 17 dependents. `transition_clock_structured` is among them: it
          WARNs on the other two ports and FAILs here, because it Requires
          `transition_recorded`.

  1 PASS  in BOTH arms: `rollback_invalid_hash_rejected`. See below.
"""
measured = """
EXACTLY AS PREDICTED, all four numbers and the split.

  bare      29 FAIL ·  1 PASS · 4 SKIP  of 34
  composed  23 FAIL ·  7 PASS · 4 SKIP  of 34

Six moved, all FAIL -> PASS, and they are exactly the six named above: type_transition,
type_config, type_query_params, type_query_result, type_rollback_params,
type_rollback_result. Nothing else differs between the arms in either direction.

Command: `make conformance TARGET=rust COMPOSITION=content-history ROUNDS=1`
Artifacts: languages/rust/output/content-history/reports/{bare,composed}-history-1.json
"""
verdict  = """
RIGHT, and it is the first pre-registered expectation in this repo that matched exactly.
`rs-content` got its counts wrong in both categories and the miss was the more instructive
half; this one had a measured basis the earlier ones did not -- the BARE arm was taken from
the `typescript` and `python` runs in the same session's `make check-all`, so only the
COMPOSED arm was a prediction.

**And the number that matters is not the 7.** It is that 23 of the 34 could not move,
because the oracle reaches transitions only through the query op, and the recorder those 23
would have measured is running correctly. See [substrate.oracle_read_path] in
extension-contracts/history/EXTENSION.toml.
"""

[gate.expectation.history.the_check_that_passes_for_the_wrong_reason]
check = "rollback_invalid_hash_rejected"
cite  = "HISTORY §7.5, entity-core-go cmd/internal/validate/history.go:502-518"
finding = """
**A §7.5 SECURITY CHECK THAT PASSES ON A PEER WITH NO HISTORY HANDLER AT ALL.**

It sends a rollback with a fabricated hash and asserts `resp.Status != 200`. On a peer
with no `system/history` handler the dispatcher answers `404 handler_not_found`, which is
not 200, so the check passes — "rollback with invalid hash returned status 404 (correctly
rejected)".

This is not a prediction about `rust`, it is a MEASUREMENT of the bare arm on the other
two ports: `history` bare is 29 FAIL · **1 PASS** · 4 SKIP, and that 1 PASS is this check.
§7.5 is the refusal that stops rollback being an unrestricted write primitive, and the
check that guards it is satisfied by the operation not existing.

Routed to `entity-core-go` — the fix is a status/code assertion (`404 not_in_history`, not
merely "not 200") or an S1 gate on the manifest, and which one is theirs to choose. It is
their oracle and our finding, produced by being the first composition to run the history
category against a peer that has the types and not the handler.
"""

[gate.expectation.content]
measures_us = 3
predicted = "identical to `rs-content`: three moved (type_blob, type_chunk, type_descriptor, FAIL -> PASS), the three handler checks SKIP in both arms, get/ingest_path_required FAIL in both."
measured  = "RIGHT. bare 5 FAIL · 4 PASS · 4 SKIP -> composed 2 FAIL · 7 PASS · 4 SKIP. The three type checks moved and nothing else."

[gate.expectation.type_system]
measures_us = 6
predicted = "identical to `rs-content`: six moved (fetch AND match for each of blob, chunk, descriptor). HISTORY's types are NOT in this category — `type_system` enumerates the core floor plus CONTENT's three §11.1 types, and it has no HISTORY rows at all."
measured  = "RIGHT. Six moved, all FAIL -> PASS, no HISTORY rows in the category. Adding a second extension changed nothing here, which is what a category scoped to CONTENT's §11.1 types should do."

[gate.expectation.core]
regressions = 0
predicted = """
0 regressions. The composition's writes are seven CONTENT type bindings, six HISTORY type
bindings, one config binding, and then whatever the recorder writes in response to the
oracle's own tree traffic.

**That last clause is new and is the risk this composition carries that no prior one
did.** `--profile core` drives 756 checks, many of which write to the tree, and every one
of those writes now produces a head-pointer binding under `system/history/head/`. If any
core check enumerates a subtree, counts bindings, or asserts on a listing, the recorder
changes its answer. That is precisely OUR second failure mode — the peer was right and we
broke it — and it is what `make regression` exists to catch. Predicted 0 because
`typescript` and `python` both ran the identical composition to 0 regressions this
session, but predicted, not assumed.
"""
measured = """
0 regressions, 6 improvements, 0 flaky. ROUNDS=2, 756 checks per arm.

The 6 improvements are CONTENT's type_system checks; `--profile core` includes that
category and HISTORY's six types are not in it.

**AND THE RISK DID NOT MATERIALISE, which is worth stating as a result rather than as an
absence.** The composed arm served 756 checks' worth of wire traffic with the recorder
live, and every tree write among them produced a head-pointer binding under
`system/history/head/`. Not one core check changed its answer. So no check in the core
profile enumerates a subtree, counts bindings, or asserts on a listing in a way the
recorder disturbs -- measured over two rounds, not reasoned from the code.

Command: `make regression TARGET=rust COMPOSITION=content-history`
Artifacts: languages/rust/output/content-history/reports/{bare,composed}-core-{1,2}.json
"""
verdict = "RIGHT."
side_finding = """
`languages/rust/gates/host-seam` scenario 4 measured that ONE wire PUT produces THREE
tree-change events on the responder: the caller's signature bound into the remote
namespace, the responder's own signature, and the application write. Two of those three
are the peer's protocol bookkeeping.

The `/{local}/system/signature/*` one is INSIDE this composition's `pattern: "*"` config
(which canonicalizes to `/{local}/*`), so a composed peer records a transition for it.
The remote-namespace one is not, and is not recorded.

**It corrupts nothing** -- head pointers are per PATH, so signature transitions live in
their own chains and no oracle check reads them -- and it is not free either: an audited
peer accumulates one transition per served request forever, auditing protocol material
rather than application state. §3.2's self-guard covers `system/history/head` only.
Whether §2.2's default config should carry an exclusion set, or §3.2's guard should extend
to engine-written protocol paths, is arch's call. Routed.
"""

# ── [history] — what the composition configures, because the oracle assumes it ──────
[history]
# The oracle's history category writes to `system/validate/history-ext/*` and NEVER
# configures history first. §6.3's own worked example is `pattern: "*"` for "a peer that
# wants history for all paths"; that is what this composition binds.
config_name    = "everything"
config_pattern = "*"
config_events  = ["created", "updated", "deleted"]
max_depth      = 0
max_depth_note = """
0 means ABSENT, not zero-retention: the field is `optional: true` (§2.2) and the
composition omits it. Pruning is a SHOULD (§9.1) and we do not implement it — v1.7's §3.3
algorithm described SEVERING an immutable content-addressed chain, which cannot be done
without rewriting every transition's hash. `internal/recorder.rs`'s `prune_history` walks
and reports rather than pretending.

**SETTLED BY v1.8, AND IT SETTLED OUR WAY (2026-09-08).** §3.3 now reads "`max_depth` is a
retention policy. The chain is never rewritten and the head is never re-pointed", with the
same argument we routed, and annotates the pseudocode "It MUTATES NOTHING" — which is what
`prune_history` already did. v1.8 also adds "A peer that collects nothing is conformant", so
omitting `max_depth` is not a shortfall against the SHOULD. No code changes.
"""

# ── provenance, declared where a reader will look ───────────────────────────────────
# THE TWO VALUES BELOW ARE THE 2026-09-07 DECLARATION AND NO LONGER DESCRIBE THE PEER; see the
# note. The live values are what the host prints on its `COMPOSED` line.
[history.provenance]
context_available       = "observed at runtime"   # HistoryInstallation::context_available(); was `false` (pre-H8)
handler_grant_available = true                    # read back by install_history; was `false` (pre-H1)
note = """
**BOTH FACTS BELOW CHANGED.** Keystone's H8 (2026-09-07) put an execution context on the
tree-change event for writes made through dispatch; `HistoryInstallation::context_available()` now
reports what the recorder has observed. Keystone's H1 (2026-09-12) gave this peer a handler, and
`install_history` reads back the grant `register_handler` bound, so `handler_grant_available` is
reported `true` by the installation and asserted by
`languages/rust/extensions/history/tests/sdk.rs`. The rest of this note is the
record of the port.

WAS: `context_available = false` is the same on all three targets: the peer's tree-change event
carries no execution context, so every transition records §2.1's autonomous-case values —
including for writes that arrived over the wire from a remote caller, which are not
autonomous. Four oracle checks read those fields and they are presence checks over values
we fabricate. On THIS peer they cannot run at all, because they Require
`transition_recorded`.

`handler_grant_available = false` is NEW HERE and is one step weaker than the other two
ports. §2.1's autonomous `capability` is "the handler grant"; `typescript` and `python`
read back the token their own `install_history` minted at
`system/capability/grants/system/history`. There is no mint on this peer (`Peer` exposes
`create` and `dispatch`) and no handler to grant for, so the host passes the local
identity hash and **`author == capability` on every transition here**. Reported so a
green row is never read as a satisfied §9.1 MUST.
"""


# ══ [gate.baseline] — THE TEMPORAL BASELINE (AP-18) ═══════════════════════════════════
#
# NOT the pre-registration in [gate.expectation] above, and the separation is the whole
# point. A PREDICTION is written before the run and never edited afterwards — `rs-content`
# predicted 0 and measured 3, and that miss is kept, because a pre-registered expectation
# whose misses get edited away is not a pre-registration. A BASELINE is what we last
# MEASURED, and it is updated deliberately, with a reason, whenever it legitimately
# changes. Two quantities were living in one block; asserting against the prediction would
# have made the gate permanently red on a preserved miss, and the locally-reasonable fix
# for that is to edit the prediction — which destroys the artifact.
#
# `improved` is a set of NAMES, not a count: the two-arm diff is blind to a LOST
# improvement (bare fails it too, so the comparison reads "no difference"), and a count
# that shrinks by one understates a capability with nothing re-checking in that direction.
# `history/w6_caller_cap_absent` went PASS -> FAIL on two targets with every gate green.
#
# Checked by `tools/check-expectation.py`, in `make check`. Regenerate with `--bless`.

# RE-BLESSED 2026-09-09 — THE ORACLE MOVED, NOT THE COMPOSITION. `entity-core-go`'s core
# profile grew by 20 check ENTRIES (756 -> 776, keyed `category.name`): 19 newly-named in
# `connectivity` (13) and `tree_operations` (6) from their tree_put_error_codes.go and
# connectivity_conn_errors.go, plus one a BARE-NAME diff cannot identify because its name
# already exists in another category. All pass in BOTH arms, so none of it is a statement
# about this composition. Verified before blessing: every improvement NAME set is unchanged.
# ── PRE-REGISTRATION 2 — written 2026-09-12 BEFORE the first composed run with H1 ─────────────
#
#   history      PREDICTED 32 PASS / 1 WARN / 1 FAIL of 34 — the `typescript` and `python` number, and
#                the same non-PASS pair by name. Was 7 / 23 FAIL / 4 SKIP with the read face absent.
#   content      PREDICTED 12 PASS / 1 SKIP of 13, the other two ports' number and name set.
#   type_system  PREDICTED unchanged from the baseline below.
#   core         PREDICTED the same 6 improvements by name and 0 regressions; the bare arm's absolute
#                counts may move by keystone's own change (their `dev` 029d1c7).
#
# One HISTORY-specific risk: the autonomous `capability` is now the real handler grant's hash
# instead of the local identity hash. `context_capability_present` checks non-zero and passed on
# both, so it should not move; a check that compared `capability` against `author` would.
#
# NAMED RISKS: this port's CONTENT and HISTORY bodies have never been reached over the wire.
# `ContentHandler` reads the H6 frame budget off the connection (16 MiB under the oracle, same
# as the other two ports). `HistoryHandler::check_target_access` moved from a `check_permission`
# carrier to keystone's H9 predicate in the same change, and under the degenerate seed policy the
# difference is unobservable. A miss is kept and written up below the numbers, never folded in.
#
# ── MEASURED 2 — 2026-09-12 (UTC 09-13), ROUNDS=2, oracle 78db4a9, keystone `dev` 029d1c7 ──────
#
# RIGHT, EXACTLY, on every category and every name set. 0 regressions, 0 flaky, in every arm.
#   content      12 PASS / 1 SKIP — the 8 improved names equal `python`'s and `typescript`'s.
#   history      32 PASS / 1 WARN / 1 FAIL — the other two ports' tally, non-PASS pair
#                (`transition_clock_structured` WARN, `w6_caller_cap_absent` FAIL) identical by name.
#   type_system  unchanged (118 / 11 WARN / 317 FAIL; the same 6 improvements).
#   core         the same 6 improvements by name; bare arm unchanged at 334 / 337 / 107.
# Baselines below re-blessed from this run; `make expectation` failed on the undeclared gains first,
# which is D21's gate doing its job.

