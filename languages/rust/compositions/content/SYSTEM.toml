## SYSTEM.toml — languages/rust/compositions/content
##
## The THIRD composition, and the first one that cannot claim what the other two claim.
##
## The python composition was the retarget test and it passed: `tools/compose.py` needed no
## change for it. **This one needed a new concept**, because on this peer an extension's
## four faces did not all install. `[system.faces]` below is that concept; it exists because
## the alternative was a composition that promises a handler and delivers `501`. Since
## keystone landed H1 on this peer (2026-09-12) all four faces install.
##
## The resolved plan is DERIVED by `tools/compose.py` into
## `languages/rust/output/content/PLAN.json`.

[system]
name       = "content"
extensions = ["CONTENT"]

[system.peer]
generator = "entity-core-keystone"
# Read-only, another team's tree. The composition consumes the peer as a CRATE, by path
# dependency -- which is this language's packaging boundary, exactly as `ts-content`
# consumes typescript's `exports["."]` and `py-content` consumes python's declared wheel
# `packages`. Neither compiles the peer from source into itself and none patches it.
path      = "../entity-core-keystone/protocol-generator/rust"

# ── [system.faces] — WHICH OF THE EXTENSION'S FACES THIS COMPOSITION INSTALLS ───────
#
# NEW IN THIS COMPOSITION, and it is a substrate fact rather than a choice. Measured by
# `languages/rust/gates/host-seam/`: half by a running program over real loopback TCP,
# half by rustc, because on an AOT substrate "is the symbol there" is not a runtime
# question. (The path was `gates/host-seam/rust/` (dead) until the 2026-09-06 target-major
# restructure moved it; the prose kept the old spelling until `tools/check-citations.py`
# ran, which is D18's third incident.)
#
#   handler  A. nothing bound at system/content       404  handler_not_found
#            B. all four §11.6.1 tree writes bound    501  no_handler_body
#            C. the same body called DIRECTLY         200  invocations 0 -> 1
#            error[E0624]: method `register_handler` is private
#            error[E0609]: no field `handlers` on type `Peer`
#            error[E0603]: struct `Outcome` is private
#
# **The composition does NOT perform the four writes**, and that refusal is deliberate.
# It would move the peer from `404 handler_not_found` -- which is true, no content
# handler exists -- to `501 no_handler_body`, which says one exists and is broken.
# Making a peer worse to make a report look more installed is the failure mode this
# repo's second gate (`make regression`) exists to catch, and doing it on purpose would
# be worse than tripping it by accident.
# ** RE-DECLARED 2026-09-12 (second session). ** The block above explains a refusal that was
# right while `register_handler` was private. Keystone made it public for K-9 —
# `ROUTING-2026-09-12-a-entity-system-generator-rust-can-install-a-handler-and-h1-status-no-longer-reads-the-wire-probe`
# — and it binds the four entities AND the body in one call, so there is no longer a way to
# produce the 404 -> 501 state. The handler is installed through `install_content`.
[system.faces]
types          = "installed"        # Store::bind is public. Oracle-checked; see [gate].
handler        = "installed"        # Peer::register_handler (keystone H1). The `content` category.
emit_consumer  = "available-unused" # Store::register_tree_consumer is live (probe
                                    # scenario 2, two negatives). CONTENT registers none
                                    # -- `EXTENSION.toml [surfaces] emit_consumers = []`
                                    # -- so this row records a capability we measured and
                                    # did not use, which is different from one we lack.
sdk            = "installed"        # the handler runs through it

[gate]
oracle     = "entity-core-go validate-peer"
# TWO categories. `type_system` measures CONTENT's types; `content` measures the handler,
# installed since keystone's H1 (2026-09-12). Before H1 `content` measured the handler's
# ABSENCE, which is the difference between "we did not install a handler" and "we did not
# check".
categories = ["type_system", "content"]
profiles   = ["core"]

# ── [gate.expectation] — WRITTEN BEFORE THE RUN, as on both prior compositions ──────
#
# `ts-content` and `py-content` each predicted an 8/4/1 split and each run matched it.
# The prediction here is different in kind: it is that ONE category moves and the other
# does not, and that the one that does not move is the one an over-eager wiring program
# would have moved.

## PREDICTED-VS-MEASURED IS KEPT BELOW, INCLUDING THE PREDICTION THAT WAS WRONG.
## A pre-registered expectation that is quietly overwritten with the result is not a
## prediction, it is a transcript. Both prior compositions matched theirs; this one did
## not, and the miss is the more instructive half of the run
## (`docs/archive/status/CONFORMANCE-2026-09-06-rust-content.md` §3).

[gate.expectation.type_system]
measures_us = 6            # CORRECTED after the run. Predicted 3; it is 6.
predicted   = "the three CONTENT type checks go from non-PASS (bare: the peer publishes only the 53-type core floor) to PASS (composed). No other check in the category moves."
measured    = "SIX moved, all FAIL -> PASS, and nothing else: _fetch AND _match for each of blob, chunk, descriptor."
verdict     = "DIRECTION RIGHT, COUNT WRONG. Each type carries a _fetch check and a _match check, so three types are six checks -- arithmetic nobody did before writing the number. Exactly the AP-1 shape: a count asserted rather than printed by the thing that knows it."
why_it_matters = """
`type_system_content_{blob,chunk,descriptor}_match` is the only third-party measurement
this substrate supports. validate-peer renders the same three §11.1 types from
entity-core-go's OWN independent transcription and compares content hashes, which lands on
exactly the surface where a hand-built field map fails silently: a wrong map produces a
well-formed entity that hashes differently from everyone else's, dedup stops for that type,
and nothing raises an error anywhere.
"""

[gate.expectation.content]
measures_us = 3            # CORRECTED after the run. Predicted 0; it is 3.
predicted   = "bare and composed IDENTICAL, check for check. A difference is a defect in the composition, not a result."
measured    = "THREE moved: type_blob, type_chunk, type_descriptor, all FAIL -> PASS. The three handler checks SKIP in both arms; get/ingest_path_required FAIL in both."
verdict     = """
WRONG, and this is the useful error. The prediction assumed the `content` category is
handler-driven end to end. It is not: three of its thirteen checks read type entities out of
the tree and never touch a handler, so a composition that publishes types moves them.

**It corrects a number we have already published.** Both prior compositions report "8 of 8
measure our handler" and docs/STATUS.md repeats it. The 8 is right about how many checks
measure our MODULE and wrong about which FACE: it is 5 handler + 3 types. This composition is
the experiment that splits them, because it is the first one where the two faces got
different answers -- with types installed and no handler, exactly the 3 pass and exactly the
5 do not. No composition where both faces installed could have shown it.
"""

[gate.expectation.core]
regressions = 0
predicted   = "0 regressions. The composition's only writes are seven tree bindings under system/type/."
measured    = "0 regressions, 6 improvements, 0 flaky (ROUNDS=2, 756 checks per arm). The 6 improvements are the type_system checks above; --profile core includes that category."
verdict     = "RIGHT."
# Our second failure mode is one keystone never has -- the peer was right and we broke it.


# ══ [gate.baseline] — THE TEMPORAL BASELINE (AP-18) ═══════════════════════════════════
#
# NOT the pre-registration in [gate.expectation] above, and the separation is the whole
# point. A PREDICTION is written before the run and never edited afterwards — `rs-content`
# predicted 0 and measured 3, and that miss is kept, because a pre-registered expectation
# whose misses get edited away is not a pre-registration. A BASELINE is what we last
# MEASURED, and it is updated deliberately, with a reason, whenever it legitimately
# changes. Two quantities were living in one block; asserting against the prediction would
# have made the gate permanently red on a preserved miss, and the locally-reasonable fix
# for that is to edit the prediction — which destroys the artifact.
#
# `improved` is a set of NAMES, not a count: the two-arm diff is blind to a LOST
# improvement (bare fails it too, so the comparison reads "no difference"), and a count
# that shrinks by one understates a capability with nothing re-checking in that direction.
# `history/w6_caller_cap_absent` went PASS -> FAIL on two targets with every gate green.
#
# Checked by `tools/check-expectation.py`, in `make check`. Regenerate with `--bless`.

# RE-BLESSED 2026-09-09 — THE ORACLE MOVED, NOT THE COMPOSITION. `entity-core-go`'s core
# profile grew by 20 check ENTRIES (756 -> 776, keyed `category.name`): 19 newly-named in
# `connectivity` (13) and `tree_operations` (6) from their tree_put_error_codes.go and
# connectivity_conn_errors.go, plus one a BARE-NAME diff cannot identify because its name
# already exists in another category. All pass in BOTH arms, so none of it is a statement
# about this composition. Verified before blessing: every improvement NAME set is unchanged.
# ── PRE-REGISTRATION 2 — written 2026-09-12 BEFORE the first composed run with H1 ─────────────
#
#   content      PREDICTED 12 PASS / 1 SKIP of 13 — the `typescript` and `python` number, and the
#                improved NAME SET equal to theirs (8 names). Was 7 / 2 FAIL / 4 SKIP without a handler.
#   type_system  PREDICTED unchanged from the baseline below: `register_handler` binds a handler
#                interface and no type entity, and this category reads `system/type/*`.
#   core         PREDICTED the same 6 improvements by name and 0 regressions. The bare arm is keystone's
#                host rebuilt at their `dev` 029d1c7, so its absolute counts may move by their change;
#                the diff is the claim, not the absolute.
#
# NAMED RISKS: this port's CONTENT and HISTORY bodies have never been reached over the wire.
# `ContentHandler` reads the H6 frame budget off the connection (16 MiB under the oracle, same
# as the other two ports). `HistoryHandler::check_target_access` moved from a `check_permission`
# carrier to keystone's H9 predicate in the same change, and under the degenerate seed policy the
# difference is unobservable. A miss is kept and written up below the numbers, never folded in.
#
# ── MEASURED 2 — 2026-09-12 (UTC 09-13), ROUNDS=2, oracle 78db4a9, keystone `dev` 029d1c7 ──────
#
# RIGHT, EXACTLY, on every category and every name set. 0 regressions, 0 flaky, in every arm.
#   content      12 PASS / 1 SKIP — the 8 improved names equal `python`'s and `typescript`'s.
#   type_system  unchanged (118 / 11 WARN / 317 FAIL; the same 6 improvements).
#   core         the same 6 improvements by name; bare arm unchanged at 334 / 337 / 107.
# Baselines below re-blessed from this run; `make expectation` failed on the undeclared gains first,
# which is D21's gate doing its job.

[gate.baseline.type_system]
measured = "2026-09-13"   # 2 round(s)
total    = 446
composed = { PASS = 118, WARN = 11, FAIL = 317 }
bare     = { PASS = 112, WARN = 11, FAIL = 323 }
improved = [
  "type_system.type_system_content_blob_fetch",
  "type_system.type_system_content_blob_match",
  "type_system.type_system_content_chunk_fetch",
  "type_system.type_system_content_chunk_match",
  "type_system.type_system_content_descriptor_fetch",
  "type_system.type_system_content_descriptor_match",
]


[gate.baseline.type_system.requirement]
# §5b -- the OBLIGATION each improved check carries, as the oracle itself
# states it in the report (`spec_ref`). EMITTED, never typed. This is what
# `check-expectation.py` joins on, so a re-pin that renames a check reads as
# a rename and not as a lost capability.
"Types §11.2" = ["type_system.type_system_content_blob_fetch", "type_system.type_system_content_chunk_fetch", "type_system.type_system_content_descriptor_fetch"]
"Types §12.3" = ["type_system.type_system_content_blob_match", "type_system.type_system_content_chunk_match", "type_system.type_system_content_descriptor_match"]

# RE-BLESSED 2026-09-09 — THE ORACLE MOVED, NOT THE COMPOSITION. `entity-core-go`'s core
# profile grew by 20 check ENTRIES (756 -> 776, keyed `category.name`): 19 newly-named in
# `connectivity` (13) and `tree_operations` (6) from their tree_put_error_codes.go and
# connectivity_conn_errors.go, plus one a BARE-NAME diff cannot identify because its name
# already exists in another category. All pass in BOTH arms, so none of it is a statement
# about this composition. Verified before blessing: every improvement NAME set is unchanged.
[gate.baseline.content]
measured = "2026-09-13"   # 2 round(s)
total    = 13
composed = { PASS = 12, SKIP = 1 }
bare     = { PASS = 4, FAIL = 5, SKIP = 4 }
improved = [
  "content.get_path_required",
  "content.handler_manifest",
  "content.handler_op_get",
  "content.handler_op_ingest",
  "content.ingest_path_required",
  "content.type_blob",
  "content.type_chunk",
  "content.type_descriptor",
]


[gate.baseline.content.requirement]
# §5b -- the OBLIGATION each improved check carries, as the oracle itself
# states it in the report (`spec_ref`). EMITTED, never typed. This is what
# `check-expectation.py` joins on, so a re-pin that renames a check reads as
# a rename and not as a lost capability.
"CONTENT §2.1 / §11.1 MUST" = ["content.type_blob"]
"CONTENT §2.2 / §11.1 MUST" = ["content.type_chunk"]
"CONTENT §2.4 (v3.5 A1)" = ["content.type_descriptor"]
"CONTENT §6.1" = ["content.handler_manifest"]
"CONTENT §6.2 / §11.3" = ["content.handler_op_get"]
"CONTENT §6.2 MUST (v3.4 → v3.5 reversal)" = ["content.get_path_required"]
"CONTENT §6.3 / §11.3" = ["content.handler_op_ingest"]
"CONTENT §6.3 MUST (v3.4 → v3.5 reversal)" = ["content.ingest_path_required"]

# PRIOR re-bless, earlier the same day, and its 776 is superseded by the note below.
# WAS: THE ORACLE MOVED, NOT THE COMPOSITION. `entity-core-go`'s core
# profile grew by 20 check ENTRIES (756 -> 776, keyed `category.name`): 19 newly-named in
# `connectivity` (13) and `tree_operations` (6) from their tree_put_error_codes.go and
# connectivity_conn_errors.go, plus one a BARE-NAME diff cannot identify because its name
# already exists in another category. All pass in BOTH arms, so none of it is a statement
# about this composition. Verified before blessing: every improvement NAME set is unchanged.
# ── RE-BLESSED 2026-09-09: the check SET grew by 2 and the cause is OURS, not the oracle's.
# `tools/host-launch` now starts entity-core-go's `entity-peer` on PORT+2 and passes
# `-reference-peer`, so the `origination` category's three checks EXECUTE instead of
# collapsing into one `origination/skipped` sentinel. 3 checks - 1 sentinel = +2, and the
# arms move identically: PASS +3, SKIP -1, WARN unchanged, `improved` UNCHANGED. That last
# one is the point -- all three PASS in BOTH arms, so they say nothing about this
# composition and this re-bless adds no capability claim. We had never passed the flag;
# keystone had, which is how 776 vs 778 at one oracle commit got noticed (AP-29).
[gate.baseline.core]
measured = "2026-09-13"   # 2 round(s)
total    = 778
composed = { PASS = 340, WARN = 331, SKIP = 107 }
bare     = { PASS = 334, WARN = 337, SKIP = 107 }
improved = [
  "type_system.type_system_content_blob_fetch",
  "type_system.type_system_content_blob_match",
  "type_system.type_system_content_chunk_fetch",
  "type_system.type_system_content_chunk_match",
  "type_system.type_system_content_descriptor_fetch",
  "type_system.type_system_content_descriptor_match",
]


[gate.baseline.core.requirement]
# §5b -- the OBLIGATION each improved check carries, as the oracle itself
# states it in the report (`spec_ref`). EMITTED, never typed. This is what
# `check-expectation.py` joins on, so a re-pin that renames a check reads as
# a rename and not as a lost capability.
"Types §11.2" = ["type_system.type_system_content_blob_fetch", "type_system.type_system_content_chunk_fetch", "type_system.type_system_content_descriptor_fetch"]
"Types §12.3" = ["type_system.type_system_content_blob_match", "type_system.type_system_content_chunk_match", "type_system.type_system_content_descriptor_match"]
