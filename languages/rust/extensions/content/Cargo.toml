# languages/rust/extensions/content — CONTENT v3.7 for the `rust` keystone peer.
#
# A member of the `languages/rust` workspace (by glob), and DELIBERATELY SELF-CONTAINED:
# no `.workspace = true` anywhere, because this crate is staged out of the tree and
# compiled with no workspace above it. See the root manifest for why.
#
# THE THIRD PORT, and the first one that is not a dynamic duck-typed substrate.
# `typescript` and `python` are both interpreted-or-JIT, both install a handler body
# after construction, and both answer "is the symbol there" at runtime. None of that
# is true here, and `arch/AUTHORING-NOTES.md` §2 is a three-column table because of it.
#
# NO DEPENDENCIES BEYOND THE PEER. The `[deps]` stance is `languages/rust/profile.toml`'s
# and it is the same in all three targets: an extension's only import is the peer.
#
# `sha2` IS declared below, and this comment used to say it was not -- it read "reachable
# transitively through the peer and is NOT declared here" while sitting fourteen lines
# above the declaration. Corrected 2026-09-06, and the correction is the argument for the
# check that replaced it: prose about a pin is not a pin. `languages/rust/build` now
# asserts at stage time that this version equals THE PEER'S, refusing otherwise, because
# the failure mode is silent -- two versions unify to two builds of one crate, the §3.6.1
# gear table hashes against a different SHA-256, and nothing raises an error anywhere.
# The peer's Cargo.toml is the artifact that produces the number (D14); this is a copy,
# and a copy is only safe while something compares it.

[package]
name    = "entity-content"
version = "3.6.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "entity_content"
path = "src/lib.rs"

[dependencies]
# The peer, consumed ACROSS THE CRATE BOUNDARY — which in this language is the
# packaging boundary (D13 Access). A `pub(crate)` item in the peer is invisible here,
# and that is the mechanism `tests/export_surface.rs` measures rather than asserts.
entity-core-protocol-rust = { path = "../../../../../entity-core-keystone/protocol-generator/rust" }
# SHA-256 for the §3.6.1 gear table. Pinned to the SAME version the peer pins so cargo
# unifies them to one build of one crate; a second version would compile silently and
# hash identically, but the pin is what makes that a fact rather than a hope.
sha2 = { version = "=0.10.9", default-features = false }

[features]
# Never enabled by a normal build. `languages/rust/test` enables it for exactly one
# invocation, to require that the invocation FAILS. See src/bin/deep_import.rs.
compile-fail-fixture = []

[[bin]]
name = "deep_import"
path = "src/bin/deep_import.rs"
required-features = ["compile-fail-fixture"]

# §3.4 clause 1's fixture. A SECOND binary rather than two claims in one, because `rustc`
# stops at the first phase with something to say: with both in `deep_import`, name
# resolution refused the file and the field-privacy error was never reached.
[[bin]]
name = "forge_context"
path = "src/bin/forge_context.rs"
required-features = ["compile-fail-fixture"]
