## languages/rust/profile.toml — the toolchain facts for ONE language.
##
## THIRD LANGUAGE, and the first one that broke the shape the first two shared.
## Compare `../typescript/profile.toml` and `../python/profile.toml`: the FIELDS are the
## same across all three, which is what "the language axis is a profile, not a rewrite"
## means. For the first nine compositions one VALUE here changed what a composition could
## claim — on this peer a handler body could not be installed at all — until keystone
## landed H1 on 2026-09-12 and `[extension_host]` below was re-measured.
##
## That is not a defect in the layout. It is the layout doing its job: the thing that
## differs is recorded as a VALUE in the one place per language, rather than as a
## special case in a driver.

[language]
name        = "rust"
packaging   = "crate"
compilation = "aot"          # ← the axis two dynamic substrates could not vary.
                             # Everything below that differs from `python` differs
                             # because of this one word.

# THE BOUNDARY IS THE CRATE, AND THE COMPILER ENFORCES IT.
# Three ports, three mechanisms for the SAME §3.4 MUST:
#   typescript — the `exports` map; node refuses a deep import at resolve time.
#   python     — convention; nothing refuses anything.
#   rust       — the absence of `pub`; rustc refuses at COMPILE time, `error[E0603]`,
#                and there is no dynamic route around it at all.
# This is the strongest of the three on §3.4's FIRST clause and the weakest on its
# SECOND (the capability-checking wrapper) — see EXTENSION.toml [substrate.export_boundary].
boundary    = "the crate: `mod internal;` without `pub`. Enforced by rustc (E0603)."

[toolchain]
image = "localhost/entity-core-keystone/rust-toolchain:latest"
# ANOTHER TEAM'S IMAGE, used read-only and recorded as a dependency rather than
# assumed. Same stance as the other two: the peer under test is built by that
# toolchain, and compiling our extension against a different rustc would measure a
# combination nobody ships.
rust    = "1.96.1"           # the image's pinned distro NVR; the peer's Cargo.toml
                             # asserts `rust-version = "1.96"` and this is what proves it
edition = "2021"             # the peer's edition. Ours matches it deliberately: an
                             # edition skew changes name resolution and closure capture,
                             # and neither should differ between a peer and a module
                             # compiled into the same binary.

[deps]
# We add NOTHING beyond what the peer already pulls. The extension's only import is the
# peer -- plus `sha2`, which is NOT an addition: the §3.6.1 gear table needs SHA-256,
# the peer already pins `sha2 = "=0.10.9"`, and the cell pins the SAME version so cargo
# unifies them into one build of one crate. A different version would compile silently.
runtime = ["sha2 = \"=0.10.9\"  (identical to the peer's pin; unified, not added)"]
dev     = []

[build]
# THREE COMPILES, and the middle one is the point.
#
#   1. each extension cell     -> an rlib, as its own crate
#   2. the composition host    -> a binary that depends on those crates BY NAME
#   3. `cargo test` per cell   -> integration tests in tests/, which see only `pub`
#
# Compiling the cell and the host as ONE crate would resolve every path internally and
# prove the symbol is reachable in the source tree, which D13's Access row calls the
# cheapest wrong answer. Separate crates means the crate boundary -- which in this
# language IS the packaging boundary -- decides what the host can see.
stage    = "output/<composition>/build"
offline  = true              # --network=none. The crate closure comes from keystone's
                             # own `cargo vendor` mirror, mounted read-only. Nothing is
                             # fetched and nothing in their tree is written.
compile  = true
vendor   = "../entity-core-keystone/protocol-generator/rust/output/vendor"

[gate]
oracle     = "entity-core-go validate-peer"
oracle_bin = "../entity-core-keystone/output/s4-oracles/validate-peer"
host_entry = "host/target/debug/composed-host"
# Speaks keystone's host CLI verbatim: --port / --name / --debug-open-grants /
# --validate, and a single `LISTENING ...` readiness line on stdout.

# The readiness budget, in 0.1 s ticks, for the host to print `LISTENING` on stdout.
# DECLARED HERE because it varies per target and a driver literal cannot: it WAS a literal,
# and it had already drifted 100/150/150 with no comment on any of the three (D17 / AP-10).
# Inherited from port 2. A debug-profile binary starts fast; the
# budget is generous rather than measured, and it is declared so that saying so is possible.
startup_ticks = 150

[extension_host]
# Facts about THIS peer that an extension module has to be built around, each MEASURED by
# `languages/rust/gates/host-seam/probe-seam-rust.sh` (a running program for Reach, rustc for H3).
#
# ** RE-MEASURED 2026-09-12 (second session) at keystone `dev` 029d1c7. ** Every handler-face row
# below read the opposite until then — `registration_surface = "none"`, `handler_install =
# "IMPOSSIBLE"`, `outcome_exported = false`, `frame_budget = "wire::MAX_FRAME (a public const, NOT
# configurable)"` — and all of it was true of the peer it was measured on. Keystone landed H1, H3,
# H6, H7, H9 and K-5 on this peer for our K-9
# (`ROUTING-2026-09-12-a-entity-system-generator-rust-can-install-a-handler-and-h1-status-no-longer-reads-the-wire-probe`).
# keystone now carries its own `[extension_host]` row for `rust`; these are ours, measured from
# outside the crate, and where the two disagree that is a finding.
registration_surface = "Peer::register_handler"   # public; probe scenario 1 B (witness, counter 0 -> 1)
handler_install      = "installable"              # probe scenario 1 A/B/C: 404 -> 200 witness -> 404
                                                  # after unregister_handler, counter unmoved
ctx_type             = "HandlerContext"           # public type, `pub(crate)` fields: a body receives
                                                  # one and cannot construct one (why each cell's
                                                  # unit tests keep their own HandlerRequest)
outcome_exported     = "HandlerResult"            # public. `peer::core::Outcome` is still private
                                                  # (E0603, access_absent claim 3) and nothing needs it
raw_container        = "private"                  # H3: E0616 `native_handlers`, E0609 `handlers`,
                                                  # E0624 `resolve_handler` — access_absent, each code required
emit_consumer        = "Store::register_tree_consumer"   # live, two negatives (scenario 2)
type_publication     = "Store::bind"
frame_budget         = "HandlerContext::frame_budget (configured by PeerConfig::max_frame_bytes)"
                                                  # probe scenario 3, BY VALUE: 3,145,749 configured
                                                  # -> read back; unconfigured -> 16,777,216
expression_evaluator = "Peer::set_expression_evaluator"  # probe scenario 5: 501 -> 200 (a request
                                                  # field folded in) -> 501 for a declined body; the
                                                  # compute/literal floor answered unasked
path_permission      = "capability::check_path_permission"  # H9; compiled against by access_control
local_dispatch       = "HandlerContext::dispatch_execute"   # K-5; measured by the compute category's
                                                  # three handler-mode checks through `install_compute`

# ── [error_surface] — the emit-call SHAPE, read by `tools/check-error-codes.py` ─────────
# D17: a per-target VALUE lives in the profile. The type name is left open (`\w+::err`)
# because the outcome type is per-EXTENSION here — `ContentOutcome` today, and the second
# extension will name its own. Binding the pattern to `ContentOutcome` would make this
# field silently stop matching at the first cell that is not CONTENT, which is the exact
# false green MIN_SITES and the self-test exist to refuse.
[error_surface]
# A LIST since 2026-09-12, at the third COMPUTE port — `typescript`'s reason, arriving here: the
# evaluator returns a `compute/error` VALUE named by a `CODE_*` constant, and the handler passes
# constants too, so the literal-string pattern saw five of the cell's sites and would have called
# the surface clean. CONTENT and HISTORY on this target use no `CODE_*` constants, so pattern 2
# adds nothing to their cells.
emit_pattern = [
  '\b\w+::err\(\s*\d+\s*,\s*"(?P<code>[a-z_]+)"',
  '\bCODE_(?P<code>[A-Z_]+)\b',
]
# D15's control, as data — ONE planted line per pattern, same order (see `--self-test`).
self_test_line = [
  'return ContentOutcome::err(400, "planted_bogus_code", "x");',
  'return ComputeOutcome::err(400, CODE_PLANTED_BOGUS_CODE, "x");',
]

# ── [sdk_surface] — the D16 gate's per-target facts ─────────────────────────────
# D17: a per-target VALUE lives in the profile. `entry_point` was a literal in
# `tools/sdk-parity.py`'s `ENTRY_POINTS` dict — one entry per target in a
# LANGUAGE-NEUTRAL file, which is the shape that becomes a 46-way table. Same defect as
# AP-9's toolchain image and AP-10's readiness budget, one file over.
#
# The PROCEDURE that reads this file lives at `languages/rust/gates/sdk-surface/extract.py` beside it,
# because a per-target procedure belongs under the target (§1.2b) — not behind a dispatch
# in the neutral half. The neutral half now discovers both by wildcard.
[sdk_surface]
entry_point = "src/lib.rs"
# The crate root. `pub` is the boundary here and rustc enforces it (E0603), which is why this target's extractor is the shortest of the three.
