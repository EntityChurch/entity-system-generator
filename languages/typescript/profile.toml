## languages/typescript/profile.toml — the toolchain facts for ONE language.
##
## There is exactly one of these per language and never one per (extension x language)
## cell. That is the firm part of the layout: a build driver in the cell position is
## 26 x 46 = 1,196 copies of one script, and keystone reached 46 copies of `run-s4.sh`
## with one defect -- a `-json-out` default that republished the tracked report --
## reproduced in 36 of them. `languages/<lang>/` exists so that number is 46 forever.

[language]
name      = "typescript"
packaging = "npm"
compilation = "jit"

# D13's Access layer, as a FIELD rather than as a comment -- which is what it was until
# 2026-09-06, while `python` and `rust` both declared it. Nothing parsed the profile, so
# nothing noticed that the schema had drifted on the port whose boundary is the strongest
# mechanism of the three. `tools/compose.py` now requires it.
#
# The boundary is the MANIFEST, not the module. Our own module is staged as a real package
# and consumed by name, so the extension's public surface is enforced by node, not by review.
boundary  = "the `exports` map in package.json; node refuses a deep import at resolve time (ERR_PACKAGE_PATH_NOT_EXPORTED)."

[toolchain]
image = "localhost/entity-core-keystone/node24:latest"
# ANOTHER TEAM'S IMAGE, used read-only and recorded as a dependency rather than assumed.
# We do not author a node Containerfile in cycle 1: the peer under test is built by that
# toolchain, and compiling our extension against the peer's own `dist/` under a different
# node would measure a combination nobody ships. Revisit when a second peer generator exists.
node       = ">=24"
typescript = "5.8.3"                 # resolved from the peer's devDependencies, NOT pinned
                                     # here. Pinning it twice is the drift D14 is about:
                                     # the compiler that builds our module MUST be the one
                                     # that built the peer's .d.ts we type against.

[deps]
# We add NOTHING. The extension's only import is the peer package. A profile that
# accumulates per-extension deps has stopped being a profile.
#
# THIS COMMENT USED TO ROUTE THE DECISION TO A PLACE THAT DOES NOT EXIST. It read "an
# extension that needed a runtime dependency would declare it in its own EXTENSION.toml"
# -- and `EXTENSION.toml` has no such block, and nothing would read one. Corrected
# 2026-09-06 rather than left as a plan: a routing rule pointing at a phantom is AP-9's
# family (a declaration nothing executes), one layer up, and it reads as a decision that
# has been made. **The mechanism is UNBUILT.** The first extension that needs a runtime
# dependency is the one that designs it, and it will be a new block in `EXTENSION.toml`
# read by `tools/compose.py` into the plan -- not a field added here.
runtime = []
dev     = []

[build]
# `build <composition>` stages into output/<composition>/build and runs tsc TWICE:
#
#   1. the extension cell -> node_modules/@entity-core/extension-<name>/dist
#   2. the composition host -> dist/host.js, importing the extension BY PACKAGE NAME
#
# Two passes rather than one, on purpose. A single `rootDir: .` pass would compile the
# extension and the host together and resolve the import by relative path, which is
# exactly the read that D13's Access row calls the cheapest wrong answer: it proves the
# symbol is reachable in the SOURCE TREE and says nothing about the packaging boundary.
# Compiling the cell into a package and importing it by name means node's `exports` map
# decides what the host can see -- and `test/export-surface.test.ts` asserts on the same
# boundary, so the §3.4 MUST is enforced by the module resolver.
stage    = "output/<composition>/build"
offline  = true                       # --network=none. Nothing is fetched; node_modules
                                      # is staged from the peer's own resolved tree.

[gate]
oracle     = "entity-core-go validate-peer"
oracle_bin = "../entity-core-keystone/output/s4-oracles/validate-peer"
# The oracle is NOT ours and is not in this tree. It is the oracle BECAUSE it is not the
# thing under test. Path recorded; the binary is a gitignored local build.
host_entry = "dist/host.js"           # speaks keystone's host CLI verbatim: --port /
                                      # --name / --debug-open-grants / --validate, and a
                                      # single `LISTENING ...` readiness line on stdout.
# The readiness budget, in 0.1 s ticks, for the host to print `LISTENING` on stdout.
# DECLARED HERE because it varies per target and a driver literal cannot: it WAS a literal,
# and it had already drifted 100/150/150 with no comment on any of the three (D17 / AP-10).
# Raised from 100. The 100 was port 1's original and was never a
# measurement -- ports 2 and 3 were written at 150 and nobody went back. Loosening a
# timeout can only make a failure slower, never falser, so this is the safe direction.
startup_ticks = 150


# ── [error_surface] — the emit-call SHAPE, read by `tools/check-error-codes.py` ─────────
# D17: a per-target VALUE lives in the profile. The shape of the call that puts a code on
# the wire differs per target — a symbolic `Status.` member here, a bare integer in the
# other two — and that is a value, not a procedure, so the shared gate holds one copy of
# the protocol and each profile declares its own pattern.
[error_surface]
# A LIST, NOT A STRING, since 2026-09-09 — because an extension can emit its error
# surface by more than one mechanism and the first COMPUTE run proved it. §3.2's F10 rule
# makes an evaluated `compute/error` a VALUE at status 200, so thirteen of COMPUTE's
# sixteen §9.1 codes never reach `errorResult`. The single pattern saw 5 of 13 and called
# the surface clean.
emit_pattern = [
  # 1. the transport-status form — CONTENT and HISTORY use this for everything
  '\berrorResult\(\s*Status\.\w+\s*,\s*"(?P<code>[a-z_]+)"',
  # 2. the ERROR-AS-VALUE form, via the named code constants. COMPUTE's `[sdk_surface]`
  #    requires the `CODE_*` names as cross-port contract, so the emit sites carry a
  #    constant rather than a literal and pattern 1 is structurally blind to them.
  '\bCODE_(?P<code>[A-Z_]+)\b',
]
# D15's control, as data. `--self-test` runs the pattern above against this line and
# asserts it extracts `planted_bogus_code`. A pattern that silently stops matching reports
# a clean surface, and a clean surface is this gate's most convincing wrong answer.
# ONE PLANTED LINE PER PATTERN, in the same order. `--self-test` refuses if the two
# lists differ in length: a pattern with no line of its own is uncontrolled, and an
# uncontrolled pattern is exactly the one that silently stops matching.
self_test_line = [
  'return errorResult(Status.BadRequest, "planted_bogus_code", "x");',
  'return err(CODE_PLANTED_BOGUS_CODE, "x");',
]

# ── [sdk_surface] — the D16 gate's per-target facts ─────────────────────────────
# D17: a per-target VALUE lives in the profile. `entry_point` was a literal in
# `tools/sdk-parity.py`'s `ENTRY_POINTS` dict — one entry per target in a
# LANGUAGE-NEUTRAL file, which is the shape that becomes a 46-way table. Same defect as
# AP-9's toolchain image and AP-10's readiness budget, one file over.
#
# The PROCEDURE that reads this file lives at `languages/typescript/gates/sdk-surface/extract.py` beside it,
# because a per-target procedure belongs under the target (§1.2b) — not behind a dispatch
# in the neutral half. The neutral half now discovers both by wildcard.
[sdk_surface]
entry_point = "index.ts"
# The PUBLIC entry point, not the source tree: a parser pointed at src/** would report every internal symbol and the §3.4 boundary would vanish.

# ── [peer_contract] is GONE, and its own rule is what removed it ─────────────────────────────
#
# This target carried `status = "pre-contract"` from 2026-09-13 as the ONE declared exception to
# `tools/check-eligible.py`'s "no report, not eligible" rule, under a comment ending *"Delete it
# when that happens."* Keystone published a report for this peer the next day and the gate's R0
# rule failed all three typescript compositions, exactly as the block said it would. Deleted
# 2026-09-14 — `ROUTING-2026-09-13-c-entity-system-generator-typescript-and-python-are-certified-your-pre-contract-declarations-now-fail-and-what-changed-under-your-arms` §0.
#
# Kept as a comment rather than a silent deletion because the block is the only instance in this
# tree of an exemption that carried its own expiry CONDITION instead of a date, and it expired on
# the condition. That is the shape to copy the next time a target needs one.

# ── [peer_drift] — the certified commit is OLD, declared and self-expiring ────────────────────
#
# Read by `tools/check-eligible.py` (`make eligible`) and it covers ONE rule, F1's `moved` arm.
# Keystone's 45-language sweep (`c255fdfe` sentinel, `2f6547ae` vanguard 0.8.2.23) landed
# capability changes on all three peers AFTER the commits their contract reports were measured
# at, and a merge put both lines in one tree. The report is still a true statement about
# `certified` below; it is no longer a statement about the source we compile.
#
# **This is a DECLARATION, not a suppression, and the difference is mechanical.** It names the
# commit it is ABOUT, so it expires on the CONDITION rather than on a date: the day keystone
# re-certifies, `delivery.commit` changes, `drift_applies()` returns False and F1 fires again
# with nobody having to remember. `--strict-drift` promotes it back today. `routed` must resolve
# (D18) and the gate REFUSES a declaration missing it — a declaration with no destination is a
# suppression (D21).
#
# **We are deliberately NOT asking keystone to re-certify.** They have an arc running; the
# operator's call is that we absorb the drift rather than stall it. We measured the delta
# ourselves instead, and it moved a real answer on `rust` — see the routed packet §5 and
# `extension-contracts/compute/EXTENSION.toml [assumptions].reserved_relative_path_forms`.
[peer_drift]
certified = "fd31d9cacc90"
since     = "2026-09-14"
routed    = "docs/outbox/ROUTING-2026-09-14-keystone-g5-and-g6-are-done-and-the-evaluator-seam-has-two-shapes-across-your-three-peers.md"
reason    = "keystone's 45-language sweep moved peer capability source after certification; absorbed by operator ruling rather than routed as a re-certification ask"
