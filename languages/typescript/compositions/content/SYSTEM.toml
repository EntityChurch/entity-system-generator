## SYSTEM.toml — languages/typescript/compositions/content
##
## A composition NAMES things and DECLARES NOTHING NEW. Every fact about CONTENT lives in
## `extension-contracts/content/EXTENSION.toml`; every fact about the toolchain lives in
## `languages/typescript/profile.toml`. If a fact is in two places, one of them is wrong.
##
## WAS `compositions/ts-content/`. The `ts-` prefix is gone because the target is now the
## path: an undeclared abbreviation set (`ts`/`py`/`rs` — and what would `csharp` have
## been?) is a naming scheme that does not survive forty targets. `[system.peer].language`
## is gone for the same reason. It was a second copy of a fact the directory already
## carries, and `tools/compose.py` REFUSES a composition that states it and contradicts
## its own location.
##
## The resolved plan — dependency closure, handler patterns, namespace set, install order,
## and now the resolved profile — is DERIVED by `tools/compose.py` into
## `languages/typescript/output/content/PLAN.json` as an OUTPUT. Never edited, and
## regenerating it must be byte-identical.

[system]
name       = "content"
extensions = ["CONTENT"]

[system.peer]
generator = "entity-core-keystone"
# Read-only, another team's tree. The composition consumes the peer's PUBLISHED artifact
# (`exports["."]` -> dist/src/index.js) exactly as an external npm consumer would; it does
# not compile the peer from source and it never patches it. A peer that cannot host what we
# generate is a finding about the seam, routed -- not a peer we fork.
path      = "../entity-core-keystone/protocol-generator/typescript"

[gate]
# What this composition is measured by. `content` is the extension under test; `core` is the
# regression guard, and it is not optional: our second failure mode is one keystone never has
# --- the peer was right and we broke it.
oracle     = "entity-core-go validate-peer"
categories = ["content"]
profiles   = ["core"]

[gate.expectation]
# The HONEST target, computed by reading every check body in the oracle's content category
# (cmd/internal/validate/content.go @ ed9b547) --- 13 checks, not 12:
#   8 measure our MODULE    handler_manifest, handler_op_get, handler_op_ingest,
#                           type_blob, type_chunk, type_descriptor,
#                           get_path_required, ingest_path_required
#     CORRECTED 2026-09-06: this line read "8 measure our handler". The COUNT is right
#     and the word was not -- 5 of the 8 measure the handler face and 3 (type_blob,
#     type_chunk, type_descriptor) measure the TYPES face. On this peer both faces
#     install, so the distinction was invisible and cost nothing. `rs-content` is where
#     it stops being invisible: there the types face installs, the handler face cannot,
#     and exactly the 3 pass while exactly the 5 do not. Measured, not re-read --
#     languages/rust/compositions/content/status/CONFORMANCE-2026-09-06.md §3.1.
#   4 measure the oracle's own library   inline_include_at_threshold and
#                           inline_include_above_threshold call exerciseInlineInclude, which
#                           builds an in-memory store and never contacts the peer;
#                           descriptor_presence_rule and descriptor_integrity_check call
#                           content.ValidateDescriptor in-process
#   1 declared skip         frame-limit-respected needs a writable local/files root to seed
#                           oversized content, which a CONTENT-only composition has no way
#                           to provide
# Never report this as 13P/0F. A skip is a failure, reported with its cause.
measures_us        = 8
inattributable     = 4
declared_skips     = ["frame-limit-respected"]
skip_cause         = "needs a local/files root to seed >16 MiB of content; not installed in this composition"
