## SYSTEM.toml — languages/typescript/compositions/content
##
## A composition NAMES things and DECLARES NOTHING NEW. Every fact about CONTENT lives in
## `extension-contracts/content/EXTENSION.toml`; every fact about the toolchain lives in
## `languages/typescript/profile.toml`. If a fact is in two places, one of them is wrong.
##
## WAS `compositions/ts-content/`. The `ts-` prefix is gone because the target is now the
## path: an undeclared abbreviation set (`ts`/`py`/`rs` — and what would `csharp` have
## been?) is a naming scheme that does not survive forty targets. `[system.peer].language`
## is gone for the same reason. It was a second copy of a fact the directory already
## carries, and `tools/compose.py` REFUSES a composition that states it and contradicts
## its own location.
##
## The resolved plan — dependency closure, handler patterns, namespace set, install order,
## and now the resolved profile — is DERIVED by `tools/compose.py` into
## `languages/typescript/output/content/PLAN.json` as an OUTPUT. Never edited, and
## regenerating it must be byte-identical.

[system]
name       = "content"
extensions = ["CONTENT"]

[system.peer]
generator = "entity-core-keystone"
# Read-only, another team's tree. The composition consumes the peer's PUBLISHED artifact
# (`exports["."]` -> dist/src/index.js) exactly as an external npm consumer would; it does
# not compile the peer from source and it never patches it. A peer that cannot host what we
# generate is a finding about the seam, routed -- not a peer we fork.
path      = "../entity-core-keystone/protocol-generator/typescript"

[gate]
# What this composition is measured by. `content` is the extension under test; `core` is the
# regression guard, and it is not optional: our second failure mode is one keystone never has
# --- the peer was right and we broke it.
oracle     = "entity-core-go validate-peer"
categories = ["content"]
profiles   = ["core"]

[gate.expectation]
# The HONEST target, computed by reading every check body in the oracle's content category
# (cmd/internal/validate/content.go @ ed9b547) --- 13 checks, not 12:
#   8 measure our MODULE    handler_manifest, handler_op_get, handler_op_ingest,
#                           type_blob, type_chunk, type_descriptor,
#                           get_path_required, ingest_path_required
#     CORRECTED 2026-09-06: this line read "8 measure our handler". The COUNT is right
#     and the word was not -- 5 of the 8 measure the handler face and 3 (type_blob,
#     type_chunk, type_descriptor) measure the TYPES face. On this peer both faces
#     install, so the distinction was invisible and cost nothing. `rs-content` is where
#     it stops being invisible: there the types face installs, the handler face cannot,
#     and exactly the 3 pass while exactly the 5 do not. Measured, not re-read --
#     languages/rust/compositions/content/status/CONFORMANCE-2026-09-06.md §3.1.
#   4 measure the oracle's own library   inline_include_at_threshold and
#                           inline_include_above_threshold call exerciseInlineInclude, which
#                           builds an in-memory store and never contacts the peer;
#                           descriptor_presence_rule and descriptor_integrity_check call
#                           content.ValidateDescriptor in-process
#   1 declared skip         frame-limit-respected needs a writable local/files root to seed
#                           oversized content, which a CONTENT-only composition has no way
#                           to provide
# Never report this as 13P/0F. A skip is a failure, reported with its cause.
measures_us        = 8
inattributable     = 4
declared_skips     = ["frame-limit-respected"]
skip_cause         = "needs a local/files root to seed >16 MiB of content; not installed in this composition"


# ══ [gate.baseline] — THE TEMPORAL BASELINE (AP-18) ═══════════════════════════════════
#
# NOT the pre-registration in [gate.expectation] above, and the separation is the whole
# point. A PREDICTION is written before the run and never edited afterwards — `rs-content`
# predicted 0 and measured 3, and that miss is kept, because a pre-registered expectation
# whose misses get edited away is not a pre-registration. A BASELINE is what we last
# MEASURED, and it is updated deliberately, with a reason, whenever it legitimately
# changes. Two quantities were living in one block; asserting against the prediction would
# have made the gate permanently red on a preserved miss, and the locally-reasonable fix
# for that is to edit the prediction — which destroys the artifact.
#
# `improved` is a set of NAMES, not a count: the two-arm diff is blind to a LOST
# improvement (bare fails it too, so the comparison reads "no difference"), and a count
# that shrinks by one understates a capability with nothing re-checking in that direction.
# `history/w6_caller_cap_absent` went PASS -> FAIL on two targets with every gate green.
#
# Checked by `tools/check-expectation.py`, in `make check`. Regenerate with `--bless`.

# ── AP-23: a difference that is REAL, STABLE and NOT ATTRIBUTABLE ──────────────────────
#
# DECLARED 2026-09-09, and the reason it is late is the finding. `content-history` on this
# same target declared this exact check on 2026-09-08 with this exact reasoning, and this
# composition — written FIRST — never got it. That is AP-10's shape on a declaration rather
# than on a driver: a correction made while working on composition N lands in N..last and
# never in 1..N-1, because N+1 is written by copying N and nobody goes back.
#
# It surfaced as a LOST IMPROVEMENT during the 2026-09-09 oracle re-base: the check was in
# `improved`, and it stopped improving — which is the one thing D21's temporal baseline
# fails on unconditionally, correctly, because it cannot tell a machine-load flip from a
# composition that stopped doing something.
#
# This is BIAS, not noise and not a regression: the composed peer is genuinely ~3 ms slower
# per sequential baseline, and on this target the baseline sits AT the oracle's 50 ms floor.
# The same composition on `python`, whose baseline is 9 ms, shows the same ~3 ms with both
# arms PASS. The verdict is a function of the target's absolute speed against a constant,
# not of anything the check is named for.
[[gate.straddle]]
check  = "concurrency.t1_1_concurrent_demux"
why    = "50 ms floor; ts baseline sits at it, so a ~3 ms composed cost flips the verdict. Same composition on python (9 ms baseline): same cost, both arms PASS. The oracle's own message calls the signal informational and not a §6.11 violation."
routed = "docs/status/ROUTING-2026-09-07-f-core-go-a-fixed-floor-makes-a-check-verdict-a-function-of-machine-speed.md"

# RE-BLESSED 2026-09-09 — THE ORACLE MOVED, NOT THE COMPOSITION. `entity-core-go`'s core
# profile grew by 20 check ENTRIES (756 -> 776, keyed `category.name`): 19 newly-named in
# `connectivity` (13) and `tree_operations` (6) from their tree_put_error_codes.go and
# connectivity_conn_errors.go, plus one a BARE-NAME diff cannot identify because its name
# already exists in another category. All pass in BOTH arms, so none of it is a statement
# about this composition. Verified before blessing: every improvement NAME set is unchanged.
[gate.baseline.content]
measured = "2026-09-09"   # 2 round(s)
total    = 13
composed = { PASS = 12, SKIP = 1 }
bare     = { PASS = 4, FAIL = 5, SKIP = 4 }
improved = [
  "content.get_path_required",
  "content.handler_manifest",
  "content.handler_op_get",
  "content.handler_op_ingest",
  "content.ingest_path_required",
  "content.type_blob",
  "content.type_chunk",
  "content.type_descriptor",
]


[gate.baseline.content.requirement]
# §5b -- the OBLIGATION each improved check carries, as the oracle itself
# states it in the report (`spec_ref`). EMITTED, never typed. This is what
# `check-expectation.py` joins on, so a re-pin that renames a check reads as
# a rename and not as a lost capability.
"CONTENT §2.1 / §11.1 MUST" = ["content.type_blob"]
"CONTENT §2.2 / §11.1 MUST" = ["content.type_chunk"]
"CONTENT §2.4 (v3.5 A1)" = ["content.type_descriptor"]
"CONTENT §6.1" = ["content.handler_manifest"]
"CONTENT §6.2 / §11.3" = ["content.handler_op_get"]
"CONTENT §6.2 MUST (v3.4 → v3.5 reversal)" = ["content.get_path_required"]
"CONTENT §6.3 / §11.3" = ["content.handler_op_ingest"]
"CONTENT §6.3 MUST (v3.4 → v3.5 reversal)" = ["content.ingest_path_required"]

# PRIOR re-bless, earlier the same day, and its 776 is superseded by the note below.
# WAS: THE ORACLE MOVED, NOT THE COMPOSITION. `entity-core-go`'s core
# profile grew by 20 check ENTRIES (756 -> 776, keyed `category.name`): 19 newly-named in
# `connectivity` (13) and `tree_operations` (6) from their tree_put_error_codes.go and
# connectivity_conn_errors.go, plus one a BARE-NAME diff cannot identify because its name
# already exists in another category. All pass in BOTH arms, so none of it is a statement
# about this composition. Verified before blessing: every improvement NAME set is unchanged.
# ── RE-BLESSED 2026-09-09: the check SET grew by 2 and the cause is OURS, not the oracle's.
# `tools/host-launch` now starts entity-core-go's `entity-peer` on PORT+2 and passes
# `-reference-peer`, so the `origination` category's three checks EXECUTE instead of
# collapsing into one `origination/skipped` sentinel. 3 checks - 1 sentinel = +2, and the
# arms move identically: PASS +3, SKIP -1, WARN unchanged, `improved` UNCHANGED. That last
# one is the point -- all three PASS in BOTH arms, so they say nothing about this
# composition and this re-bless adds no capability claim. We had never passed the flag;
# keystone had, which is how 776 vs 778 at one oracle commit got noticed (AP-29).
[gate.baseline.core]
measured = "2026-09-09"   # 2 round(s)
total    = 777
composed = { PASS = 341, WARN = 329, SKIP = 107 }
bare     = { PASS = 335, WARN = 335, SKIP = 107 }
improved = [
  "type_system.type_system_content_blob_fetch",
  "type_system.type_system_content_blob_match",
  "type_system.type_system_content_chunk_fetch",
  "type_system.type_system_content_chunk_match",
  "type_system.type_system_content_descriptor_fetch",
  "type_system.type_system_content_descriptor_match",
]


[gate.baseline.core.requirement]
# §5b -- the OBLIGATION each improved check carries, as the oracle itself
# states it in the report (`spec_ref`). EMITTED, never typed. This is what
# `check-expectation.py` joins on, so a re-pin that renames a check reads as
# a rename and not as a lost capability.
"Types §11.2" = ["type_system.type_system_content_blob_fetch", "type_system.type_system_content_chunk_fetch", "type_system.type_system_content_descriptor_fetch"]
"Types §12.3" = ["type_system.type_system_content_blob_match", "type_system.type_system_content_chunk_match", "type_system.type_system_content_descriptor_match"]
