## SYSTEM.toml — languages/python/compositions/content-history
##
## THE FIRST COMPOSITION WITH TWO EXTENSIONS. Everything `compositions/` was built for and
## nothing CONTENT alone could reach: a dependency closure with more than one node, I6/I7
## checked against a real second namespace, and SYSTEM-COMPOSITION §2.2 consumer ordering.
##
## A composition NAMES things and DECLARES NOTHING NEW. Every fact about CONTENT lives in
## `extension-contracts/content/EXTENSION.toml`, every fact about HISTORY in
## `extension-contracts/history/EXTENSION.toml`, every fact about the toolchain in
## `languages/typescript/profile.toml`.

[system]
name       = "content-history"
extensions = ["CONTENT", "HISTORY"]

[system.peer]
generator = "entity-core-keystone"
path      = "../entity-core-keystone/protocol-generator/python"

# ── [system.consumers] — NEW, and the reason this composition exists ────────────────
#
# SYSTEM-COMPOSITION §2.2 fixes nine ordered consumer positions. HISTORY is position 4.
# The peer's `EmitBus.registerConsumer` APPENDS to a list and takes no position argument,
# so ordering is achieved ONLY by the order the wiring program calls it in — there is no
# mechanism in the peer that could enforce or even check it.
#
# **With one consumer that is vacuous, and saying so is the point.** HISTORY is the only
# emit consumer here, so it fires first and last and position 4 is satisfied by having
# nowhere else to be. This block exists so that the day a second consumer arrives (CLOCK at
# 2/3, COMPUTE at 5, SUBSCRIPTION at 8) the ordering is a declared fact that `compose.py`
# can sort, rather than a property of the order someone happened to write two lines in.
[system.consumers]
order = ["HISTORY"]
positions = { HISTORY = 4 }
enforced_by = "the wiring program's call order — NOT by the peer"
note = """
No oracle category tests consumer ordering. 68 categories, none. That was logged in
docs/STATUS.md during cycle 1 as the thing nothing measures, and building the first
consumer has not changed it: this composition cannot demonstrate that position 4 is
honoured, because with a single consumer every position produces identical behaviour.
The first composition that CAN is CONTENT + CLOCK + HISTORY.
"""

# ── [system.faces] — per (extension x face), because a peer answers per face (D13) ──
# VOCABULARY NOTE, found by writing the second one. `extension-contracts/*/EXTENSION.toml`
# `[substrate.faces]` writes the SDK face as `usable` / `library-only`; `tools/compose.py`
# enforces `installed | not-installed | not-installable | available-unused | library-only`
# and has never seen `usable`. Two word sets for one concept, one of them checked and one
# of them not — AP-9's family, in a vocabulary rather than a file. The composition uses the
# ENFORCED set; the contract block is left alone for now and the drift is recorded rather
# than quietly unified, because which set is right is a design question and not a typo.
[system.faces.CONTENT]
types = "installed"
handler = "installed"
emit_consumer = "not-installed"   # CONTENT registers none; its [surfaces].emit_consumers is []
sdk = "installed"

[system.faces.HISTORY]
types = "installed"
handler = "installed"
emit_consumer = "installed"       # THE FIRST TIME THIS VALUE IS USED IN THIS REPO
sdk = "installed"

[gate]
oracle     = "entity-core-go validate-peer"
categories = ["content", "history"]
profiles   = ["core"]

[gate.expectation]
# Pre-registered BEFORE the run, per the cycle-1 discipline. `rs-content` got its
# prediction wrong and the miss is what produced a correction worth more than the
# prediction; the same rule applies here.
#
# `content`: unchanged from the CONTENT-only composition — 8 measure our module, 4 measure
# the oracle's own library, 1 declared skip.
#
# `history`: **34** declared checks.
#   $ grep -c 'r\.Declare(' ../entity-core-go/cmd/internal/validate/history.go
#   34
#
# **THIS NUMBER WAS 27 UNTIL THE RUN, AND THE 27 WAS READ BY EYE OFF GREP OUTPUT.**
# That is AP-1, third instance, and it is ours in the same session that shipped a gate for
# a different D14 shape. The command above prints the count; the earlier one printed the
# LINES and the count was counted from them. D14 exists for exactly this and it still
# happened — recorded rather than quietly corrected, because a pre-registered expectation
# whose misses get edited away is not a pre-registration.
#
# Predicted (at 27) vs measured (at 34): the shape of the prediction held — every
# manifest/type/record/chain/query/rollback check passes — and the two flagged as
# uncertain resolved as flagged. Only the denominator was wrong.
measures_us        = 33
inattributable     = 4
history_checks     = 34
declared_skips     = ["frame-limit-respected"]
skip_cause         = "needs a local/files root to seed >16 MiB of content; not installed in this composition"
context_provenance = "fallback"
context_note       = "Every transition this composition records carries provenance=autonomous-fallback. The peer's tree-change event carries no execution context on any of the three targets. Reported here so a green history category is not read as a satisfied §9.1 MUST."

# ── [history] — what the composition configures, because the oracle assumes it ──────
[history]
# The oracle's history category writes to `system/validate/history-ext/*` and NEVER
# configures history first (cmd/internal/validate/history.go:134,276,368,430). So a peer
# with history installed but unconfigured records nothing and fails 20 of 27 checks.
# §6.3's own worked example is `pattern: "*"` for "a peer that wants history for all
# paths"; that is what this composition binds, at `system/history/config/everything`.
config_name    = "everything"
config_pattern = "*"
config_events  = ["created", "updated", "deleted"]
max_depth      = 0
max_depth_note = """
0 means ABSENT, not zero-retention: the field is `optional: true` (§2.2) and the composition
omits it. Pruning is a SHOULD (§9.1) and we do not implement it -- §3.3's algorithm describes
severing an immutable content-addressed chain, which cannot be done without rewriting every
transition's hash. Routed. See extension-contracts/history/EXTENSION.toml and
internal/recorder.ts's `pruneHistory`, which walks and reports rather than pretending.
"""

# ── MEASURED on `typescript`; this target is re-measured on its own run
# ── MEASURED, 2026-09-06, after the run ─────────────────────────────────────────────
#
#   content   12 PASS ·  0 FAIL · 1 SKIP   of 13   (identical to the CONTENT-only composition)
#   history   33 PASS ·  0 FAIL · 1 WARN   of 34
#   core      0 regressions
#
# Command: `make conformance TARGET=typescript COMPOSITION=content-history ROUNDS=1`
# Artifact: languages/typescript/output/content-history/reports/composed-history-1.json
#
# THE WARN IS THE PREDICTED ONE. `transition_clock_structured` reports "transition has no
# clock field (clock extension may not be present)" — §2.1 makes `clock` absent when CLOCK
# is not installed, and it is not. Predicted as a SKIP and it is a WARN; the oracle grades
# it more softly than we expected and the outcome is the same.
#
# ── AND THE FOUR THAT PASSED WITHOUT MEANING WHAT THEY LOOK LIKE ───────────────────
#
# `context_author_present`, `context_capability_present`, `context_handler_present` and
# `context_operation_present` all PASS. **They are presence checks, and the values whose
# presence they confirm are fabricated by us.** The peer's tree-change event carries no
# execution context on any target, so `author` is the local peer identity and `capability`
# is our own handler grant on EVERY write — including the oracle's, which arrived over the
# wire from a remote caller and is recorded as autonomous.
#
# So: 33/34 is an accurate count of checks passed and NOT a claim that §9.1's
# author/capability MUST is satisfied. The distinction is exactly the one D13 was amended
# for, one level up: a green check is evidence about the check, not about the property.
# Routed as H8. See extension-contracts/history/EXTENSION.toml [substrate.execution_context].


# ══ [gate.baseline] — THE TEMPORAL BASELINE (AP-18) ═══════════════════════════════════
#
# NOT the pre-registration in [gate.expectation] above, and the separation is the whole
# point. A PREDICTION is written before the run and never edited afterwards — `rs-content`
# predicted 0 and measured 3, and that miss is kept, because a pre-registered expectation
# whose misses get edited away is not a pre-registration. A BASELINE is what we last
# MEASURED, and it is updated deliberately, with a reason, whenever it legitimately
# changes. Two quantities were living in one block; asserting against the prediction would
# have made the gate permanently red on a preserved miss, and the locally-reasonable fix
# for that is to edit the prediction — which destroys the artifact.
#
# `improved` is a set of NAMES, not a count: the two-arm diff is blind to a LOST
# improvement (bare fails it too, so the comparison reads "no difference"), and a count
# that shrinks by one understates a capability with nothing re-checking in that direction.
# `history/w6_caller_cap_absent` went PASS -> FAIL on two targets with every gate green.
#
# Checked by `tools/check-expectation.py`, in `make check`. Regenerate with `--bless`.

[gate.baseline.content]
measured = "2026-09-07"   # 2 round(s)
total    = 13
composed = { PASS = 12, SKIP = 1 }
bare     = { PASS = 4, FAIL = 5, SKIP = 4 }
improved = [
  "content.get_path_required",
  "content.handler_manifest",
  "content.handler_op_get",
  "content.handler_op_ingest",
  "content.ingest_path_required",
  "content.type_blob",
  "content.type_chunk",
  "content.type_descriptor",
]

# `history.w6_caller_cap_absent` IS DELIBERATELY ABSENT from `improved` below, and this
# comment is the reason a re-bless needs. It PASSED at 13:05 and FAILED at 17:41 on
# 2026-09-07 (AP-18) — our `build_context` selects between `caller_capability` and
# `handler_grant`, which EXTENSION-HISTORY §5.1 forbids, and we cannot comply because the
# peer carries no `capability` field. Routed as ROUTING-2026-09-07-e-keystone-*; not
# patched, because inverting the precedence turns the check green and is still the
# interpretation §5.1 forbids. **Putting this name back into `improved` is the acceptance
# test for whatever keystone or arch answers.**
[gate.baseline.history]
measured = "2026-09-07"   # 2 round(s)
total    = 34
composed = { PASS = 32, WARN = 1, FAIL = 1 }
bare     = { PASS = 1, FAIL = 29, SKIP = 4 }
improved = [
  "history.chain_latest_event_updated",
  "history.chain_latest_hash",
  "history.chain_linked",
  "history.chain_previous_hash",
  "history.chain_two_transitions",
  "history.context_author_present",
  "history.context_capability_present",
  "history.context_handler_present",
  "history.context_operation_present",
  "history.event_filter_only_created",
  "history.first_transition_no_previous",
  "history.handler_manifest_decode",
  "history.handler_manifest_present",
  "history.handler_op_query",
  "history.handler_op_rollback",
  "history.head_pointer_set",
  "history.limit_has_more",
  "history.limit_returns_1",
  "history.rollback_new_transition",
  "history.rollback_restored_hash",
  "history.rollback_verify_binding",
  "history.transition_clock_structured",
  "history.transition_event_created",
  "history.transition_has_timestamp",
  "history.transition_hash_matches",
  "history.transition_recorded",
  "history.type_config",
  "history.type_query_params",
  "history.type_query_result",
  "history.type_rollback_params",
  "history.type_rollback_result",
  "history.type_transition",
]

[gate.baseline.core]
measured = "2026-09-07"   # 2 round(s)
total    = 756
composed = { PASS = 320, WARN = 330, SKIP = 106 }
bare     = { PASS = 314, WARN = 336, SKIP = 106 }
improved = [
  "type_system.type_system_content_blob_fetch",
  "type_system.type_system_content_blob_match",
  "type_system.type_system_content_chunk_fetch",
  "type_system.type_system_content_chunk_match",
