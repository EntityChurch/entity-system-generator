## SYSTEM.toml — languages/python/compositions/content
##
## The retarget test. Compare `../../../typescript/compositions/content/SYSTEM.toml`: under
## target-major the only field that differs is `[system.peer].path`, because `name` is now
## `content` in both and the target that used to be a field is the directory. The claim the
## second composition exists to check — that a composition names things and declares
## nothing new, so retargeting is a profile change and not a rewrite — is *stronger* after
## the move than before it, since the two manifests are now nearly byte-identical.
##
## The resolved plan is DERIVED by `tools/compose.py` into
## `languages/python/output/content/PLAN.json`.

[system]
name       = "content"
extensions = ["CONTENT"]

[system.peer]
generator = "entity-core-keystone"
# Read-only, another team's tree. The composition consumes the peer as its own wheel
# manifest declares it ships -- `[tool.hatch.build.targets.wheel] packages` -- exactly as
# `ts-content` consumes typescript's `exports["."]`. Neither compiles the peer from source
# and neither patches it.
path      = "../entity-core-keystone/protocol-generator/python"

[gate]
oracle     = "entity-core-go validate-peer"
categories = ["content"]
profiles   = ["core"]

[gate.expectation]
# Identical to ts-content's, and identical BEFORE the run rather than after it. If the
# python port lands a different 8/4/1 split, the difference is ours and not the oracle's:
# these 13 checks are wire-driven or in-process-to-the-oracle, and none of them knows what
# language the peer is written in.
measures_us        = 8
inattributable     = 4
declared_skips     = ["frame-limit-respected"]
skip_cause         = "needs a local/files root to seed >16 MiB of content; not installed in this composition"
