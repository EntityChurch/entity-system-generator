[gate.baseline.compute.requirement]
# §5b -- the OBLIGATION each improved check carries, as the oracle itself
# states it in the report (`spec_ref`). EMITTED, never typed. This is what
# `check-expectation.py` joins on, so a re-pin that renames a check reads as
# a rename and not as a lost capability.
"COMPUTE F10 (v3.19) — strict status-200 pin for evaluated compute/error" = ["compute.v319_f10_error_at_200"]
"COMPUTE F11 (v3.19) — filter-args lambda key renamed predicate → fn" = ["compute.v319_f11_filter_fn_arg"]
"COMPUTE N.5 (v3.19)" = ["compute.v319_n5_compute_compose", "compute.v319_n5_nested_field"]
"COMPUTE N.5 (v3.19) — closure-captured-param navigation; tracks F9-B-residual (scope-binding identity spec fork)" = ["compute.v319_n5_closure_field"]
"COMPUTE N.5 (v3.19) — record whose keys happen to be {type, data, name} navigates as a record, NOT envelope-peeled; cross-impl disambiguation gate (Python heuristic vs Go flat-read)" = ["compute.v319_n5_disambiguation"]
"COMPUTE v3.19b N2 — captures a fixed-content scope and prints the resulting compute/scope content_hash; cross-impl hashes must agree bit-for-bit (the N2 ratification gate)" = ["compute.v319b_scope_hash_agreement"]
"COMPUTE v3.19b §2.3 N1+N3+N4 — kind-tagged scope binding round-trip; entity captured into scope survives capture/load + field-navigates .data" = ["compute.v319b_scope_entity_round_trip"]
"COMPUTE v3.19b §2.3 N8 + F10 — a kind:entity binding whose hash doesn't resolve yields compute/error{scope_unreachable} at status 200" = ["compute.v319b_scope_unreachable"]
"COMPUTE v3.19c Part A R3 + N3 (arch 6e73d3d read-back ruling) — cross-impl regression detector. Read-back nav of a system/hash field on a *materialized* (stored / hand-built) entity MUST return the bare hash bytes, NOT auto-resolve to the referenced entity. The caller follows the ref via explicit compute/lookup/hash. No shape-sniffing, no 'N-byte = entity ref' heuristic (N3 forbids it; per V7 §1.2 the hash length itself isn't an invariant — system/hash is variable-length with an extensible LEB128 format-code). An auto-resolved Entity result means a heuristic snuck back in." = ["compute.v319c_readback_navigation_returns_hash"]
"COMPUTE v3.19c Part A R3 — M1 hash-gate: a compute/construct with an entity-valued field MUST produce a content_hash byte-identical to entity.NewEntity-built form (per V7 §1.4 bare system/hash refs). Cross-impl three-way agreement on the materialized form is the ratification gate." = ["compute.v319c_construct_entity_valued_field"]
