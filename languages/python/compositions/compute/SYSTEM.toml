## SYSTEM.toml — languages/python/compositions/compute
##
## A composition NAMES things and DECLARES NOTHING NEW. Every fact about COMPUTE lives in
## `extension-contracts/compute/EXTENSION.toml`; every fact about the toolchain lives in
## `languages/python/profile.toml`. If a fact is in two places, one of them is wrong.
##
## THE SECOND PORT OF THE LARGEST EXTENSION IN THE CORPUS, and the first composition in this
## tree whose FACE SET IS SMALLER THAN ITS SIBLING'S ON A PEER THAT HOSTS EVERYTHING ELSE.
## `ts-compute` installs five faces; this one installs four, because the fifth —
## `Peer.setExpressionEvaluator`, keystone's H7 — exists on ONE of the 46 peers and this is not
## it. See `[system.faces.COMPUTE]`.

[system]
name       = "compute"
extensions = ["COMPUTE"]

[system.peer]
generator = "entity-core-keystone"
# Read-only, another team's tree. The composition consumes the peer as its own wheel manifest
# declares it ships -- `[tool.hatch.build.targets.wheel] packages` -- exactly as `ts-compute`
# consumes typescript's `exports["."]`. Neither compiles the peer from source and neither
# patches it.
path      = "../entity-core-keystone/protocol-generator/python"

# ── [system.consumers] — declared here and NOT in the typescript twin ────────────────
#
# COMPUTE registers one emit consumer, at `SYSTEM-COMPOSITION` §2.2 position 5, class
# *unbounded reactive*, under §2.7A's stable name `compute/reevaluator`. **`ts-compute` has no
# `[system.consumers]` block and should**; the omission is ours, it is in the other port, and it
# is recorded here rather than routed because it is nobody else's finding. Nothing enforces this
# block today — no oracle category tests consumer ordering, in 68 categories — so its value is
# that the position is written down where a second consumer would have to argue with it.
[system.consumers]
order = ["COMPUTE"]
positions = { COMPUTE = 5 }
enforced_by = "the wiring program's call order — NOT by the peer"
note = """
With a single consumer every position produces identical behaviour, so this composition cannot
demonstrate that position 5 is honoured. What it CAN demonstrate, and what `content-history`
could not, is that the consumer WRITES BACK: §7.2's `on_tree_change` re-enters the evaluator and
binds a result, which re-enters the bus. On this peer `Store.bind` snapshots its consumer list
under the lock and fires OUTSIDE it, so re-entrancy costs stack rather than liveness — a peer
that fired under its lock would HANG here instead of overflowing, and a hang after the
measurement is indistinguishable from a hang before it (AP-21).
"""

# ── [system.faces] — five, and the fifth is the finding twice over ───────────────────
#
# **`evaluator = "unverifiable"` since 2026-09-17. It read `not-installable` for three days
# after that stopped being true, and this block is the record of both the value and the lag.**
#
# **What it used to say, and why it was right when written.** The seam did not exist on this
# peer. Measured:
#
#   $ grep -rniE "expression_evaluator|set_evaluator|unsupported_expression|entity_native_dispatch" \
#         protocol-generator/{python,rust,typescript}/src     # entity-core-keystone
#   24 hits across 5 files; the python and rust hits are `_entity_native_dispatch` and its
#   `501 unsupported_expression`, with no seam of any spelling in either.
#
# `Peer._entity_native_dispatch` evaluated the built-in `compute/literal` shape in-process and
# then answered `501 unsupported_expression` with no consultation step at any visibility, so
# `not-installable` was the correct D13 verdict: a thing the substrate does not host, not a
# thing we had not built.
#
# **What changed.** Keystone's S3 bring-up landed `Peer.set_expression_evaluator` on this peer.
# Installing against it moved `entity_native` 3 → 9 of 13 and exposed two defects of ours that
# had been unreachable — see the re-bless note under `[gate.baseline.entity_native]` below,
# which is where the measurement lives. **That note went in on 2026-09-14 and this line did
# not**, so one file said both things for three days.
#
# **Why `unverifiable` and not `installed`.** `install_compute`'s detector is three-valued and
# this peer lands in the middle: the setter accepts our evaluator and the peer exposes **no
# read-back** to confirm it took. `typescript` and `rust` both expose one, so those two read
# `installed` on evidence this port cannot produce. The state was added to `compose.py`'s
# `FACE_STATES` in the same change, because the vocabulary did not have a word for *installed
# and unconfirmable* and the absence of the word is what kept the wrong one in place. It becomes
# `installed` the day keystone adds `Peer.expression_evaluator`, with no edit to the port —
# the value is OBSERVED, which is the whole reason the detector returns it rather than reading
# it from here.
#
# **The lesson is D23's, on our own declaration rather than on a peer's.** A face reported
# absent is a face whose contents are unmeasured — and a face reported absent *after it stopped
# being absent* is worse, because the report is no longer even honest about the gap. Nothing in
# this tree re-reads `[system.faces]` against the peer (`make probe` is in neither `check` nor
# `check-all`), so this value is maintained by hand and went stale the first time it could.
[system.faces.COMPUTE]
types         = "installed"
handler       = "installed"
emit_consumer = "installed"
sdk           = "installed"
evaluator     = "unverifiable"

[gate]
oracle     = "entity-core-go validate-peer"
categories = ["compute", "entity_native"]
profiles   = ["core"]

# ── [gate.expectation] — PRE-REGISTERED, written BEFORE the first composed run ───────
#
# **AND THIS ONE IS A DIFFERENT KIND OF PREDICTION FROM `ts-compute`'s, WHICH IS WHY THE BAND IS
# NARROWER AND THE NAMED RISKS ARE LONGER.** That one was a first port of an unread extension
# and its band was 40–80 for a measured 100 — a miss on the high side, kept, and worth more than
# the prediction. This is a SECOND port of a spec already read to 125 of 128. The interesting
# question is no longer *"how much of this category does an evaluator reach"*; it is **"which of
# the substrate's own semantics silently disagree with §4.1's"**, and every one of those is
# named below rather than absorbed into a wide interval.
[gate.expectation]
compute_checks = 128

# The BARE arm. Not re-measured before writing this: it was measured on the `typescript` peer on
# 2026-09-09 at 0 of 128, and the structural argument carries to any bare peer — 101 of the 128
# are `blocked: depends on handler_present`, 6 on `handler_op_install`, 3 on
# `handler_manifest_decode`, 2 on `reactive_final_result`, and a bare peer has none of those. If
# the measured bare arm here is not 0, that is a finding about the ORACLE (a check passing
# against a peer with the extension absent — AP-19's shape) and not about this port.
bare_pass  = 0
bare_fail  = 128
bare_skip  = 0

predicted_composed_pass_low  = 118
predicted_composed_pass_high = 125
predicted_regressions        = 0
prediction_basis = """
The high end is `typescript`'s 125, which is what a faithful second derivation of the same spec
reading should reach: the same three `compute/apply` HANDLER MODE checks are unreachable here
for the same reason (keystone K-5, no re-entrant local dispatch), and the fifth face's absence
costs nothing measurable because the one check that touches the entity-native path already fails
on the port that has the seam.

The low end is 118 and it is SEVEN CHECKS OF NAMED SUBSTRATE RISK, not a safety margin. Each of
these is a place where this runtime's own semantics differ from §4.1's and a port that reached
for the host's operator would be wrong while looking right:

  1. `%` IS FLOORED HERE AND TRUNCATED THERE. §4.1's `truncated_remainder` is C/Go/JS/BigInt
     semantics; Python's `%` differs in SIGN whenever the operands' signs differ.
     `v36_mod_neg_dividend` / `_neg_divisor` / `_both_neg` — 3 checks.
  2. FLOAT DIVISION BY ZERO RAISES. §4.1 makes it IEEE-754 (`±Inf`/`NaN`), CPython raises
     `ZeroDivisionError`. An escaping exception is a 5xx where the spec wants a value.
  3. `bool` IS AN `int` SUBCLASS. Every integer test and the `eq` type-class rule has a silent
     wrong answer that does not exist on a tagged value model: `eq(true, 1)` must be FALSE.
  4. THE 33 TYPE ENTITIES ARE HASH-COMPARED AGAINST `entity-core-go`'s OWN TRANSCRIPTION by 63
     core `type_compute_*_match` checks. A single extra or missing field-spec key is a named
     failure — which is a BETTER position than HISTORY's, where the six `type_*` checks only
     assert that a path resolves (G-3), but it means a field-map slip lands in the CORE
     baseline rather than in the category.
  5. NEGATIVE INDEXING. Python's `[-1]` is a legal read; §2.2 says `index_out_of_range`.
  6. TRUTHINESS. Python calls `{}` and `b""` falsy; §4.5's list does not include either, so an
     `if` would take the wrong branch on a map or a byte string.
  7. CANONICAL MAP-KEY ORDER for `compute/construct`'s field evaluation is length-then-lex, not
     `sorted()`. Observable through the budget: two peers charging in different orders disagree
     about WHICH field's error comes back.

Every one of the seven has a unit test with a control, written before the composed run. **The
prediction is that the tests caught them and the band is what it costs if one did not.** If the
measurement lands below 118 the miss is kept and the reason is written up, on `rs-content`'s
rule: a pre-registration whose misses get edited away is not a pre-registration.

NOT predicted, deliberately: the CORE arm's improvement count. `ts-compute` measures 63 and they
are all `type_system.type_compute_*`, which is a function of the type layer agreeing rather than
of anything language-specific — so a number there is not a prediction, it is the same assertion
as risk 4 restated.
"""

# ── `entity_native` — ADDED 2026-09-12 (second session), PRE-REGISTERED BEFORE ITS FIRST RUN ─────
#
# `validate-peer`'s `entity_native` category (13 checks, `cmd/internal/validate/entity_native.go`
# @ 78db4a9) measures §3.2 E1 — the H7 evaluator face — and it sits OUTSIDE `--profile core`, so no
# run in this tree had ever reached it. The contract row that read "§3.2 ... Not measured here" was
# a statement about the categories WE declare, not about the oracle (D22). Found by the compute-arc
# review. Five checks have a `compute/literal` body the PEER answers before any evaluator is asked,
# so they read the same in both arms by construction: `dispatch_basic`, `hot_swap_expression`,
# `missing_grant_fail_closed`, `empty_handler_grant_dispatches`, `dispatch_with_deliver_to`.
# `result_unwrapped` is also a literal body and FAILS in both arms on every keystone peer: the
# peer's literal floor returns a `compute/result` wrapper (§3.2 E1 says unwrap) — keystone's, routed.
#
#   PREDICTED improvements: 0. This peer has no H7 seam (`evaluator = "not-installable"`), so every
#   non-literal body answers the peer's own `501` in both arms. Run anyway, as the CONTROL for the
#   other two ports: a composed arm that moved here would be measuring something other than H7.
#   MEASURED 2026-09-12 (UTC 09-13), ROUNDS=2: RIGHT — 0 improvements, 0 regressions; bare and composed
#   identical, 3 PASS / 10 FAIL. The control read as a control.

# ── [compute] — what the composition configures ──────────────────────────────────────
[compute]
# §9.3's recommended limits, taken as-is and identical to `ts-compute`'s. §10.4 makes both
# implementation-defined and §10.3's single MAY is the cascade limit's configurability.
max_operations = 100000
max_depth      = 1024
note = """
Not tuned. §9.3's values are the peer-wide defaults a capability constraint may lower (§5.2's
minimum rule), and raising either would make our `budget_exhausted` step count disagree with a
peer that did not — which §4.2 makes a cross-impl determinism surface. The two ports MUST carry
the same numbers for the same reason.
"""

# ══ [gate.baseline.*] — D21's REFERENCE IN TIME, first bless 2026-09-11 at ROUNDS=2 ══
#
# NOT the pre-registration. `[gate.expectation]` above is written BEFORE the run and is kept
# wrong on purpose; this is what was MEASURED, and it is what a later run is compared against.
# Asserting against the prediction would go permanently red on a preserved miss, and the
# locally-reasonable fix for that is to edit the prediction, which destroys the artifact.
#
# `improved` is a set of NAMES and never a count (D14): a count that shrinks by one understates
# a capability, and nothing re-checks in that direction.
#
# ── THE MEASUREMENT, AND WHAT IT SETTLES ────────────────────────────────────────────
#
# ** 125 PASS · 0 WARN · 3 FAIL of 128, from a bare arm of 0 of 128. 0 core regressions across
# 778 core checks. 115 unit tests. ** The pre-registered band was 118–125 and this is the TOP
# of it; the three that remain are `compute/apply` HANDLER MODE — `v38_apply_handler_mode`,
# `v310_apply_resource_field_accepted`, `v314_compute_apply_to_entity_native` — which need a
# re-entrant LOCAL dispatch the peer does not expose (keystone K-5, routed) and are the same
# three the `typescript` port cannot reach.
#
# ** AND THE NUMBER THAT IS WORTH MORE THAN THE TOTAL: THE IMPROVEMENT NAME SETS ARE IDENTICAL
# ACROSS THE TWO PORTS. ** 125 of 125 in `compute` and 63 of 63 in `core`, name for name,
# verified as SETS rather than as counts before this block was written. Two independent
# derivations of one spec, on two runtimes with different value models, agreeing on every check
# the oracle scores and on every check it does not.
#
# **That is the strongest independence this seat can currently produce, and it is still not
# independence** (L18). Both ports were written by the same team from the same reading of the
# same pinned snapshot; a cohort agreeing is a cohort agreeing. What the agreement DOES settle
# is narrower and real: the 33 type entities are byte-identical to `entity-core-go`'s own
# transcription (the 63 `type_compute_*_match` checks are a hash comparison against a third
# codebase), and none of the seven substrate risks named in `prediction_basis` cost a check.
#
# ** NO `[[gate.straddle]]` HERE, AND THE ABSENCE IS MEASURED. ** `ts-compute` declares
# `concurrency.t1_1_concurrent_demux` because that arm's baseline sits at the oracle's fixed
# 50 ms floor, so a ~3 ms composed cost flips the verdict (`ROUTING-2026-09-07-f-core-go-*`).
# This port's baseline for that check is ~9 ms, so the same cost leaves both arms PASSING —
# which is why `total` reads 778 here and 777 there. The difference between the two numbers is
# one check that is a function of machine speed and of nothing else.

[gate.baseline.compute]
measured = "2026-09-13"   # 2 round(s)
total    = 128
composed = { PASS = 125, FAIL = 3 }
bare     = { FAIL = 128 }
