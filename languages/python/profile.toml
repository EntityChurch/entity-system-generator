## languages/python/profile.toml — the toolchain facts for ONE language.
##
## Second language, and the point of the exercise. Compare `../typescript/profile.toml`:
## the FIELDS are the same, so the language axis really is a profile rather than a rewrite.
## The VALUES differ everywhere that matters, and every difference below is a thing a
## naive template would have got wrong.

[language]
name      = "python"
packaging = "wheel"
compilation = "interpreted"

# THE BOUNDARY IS CONVENTION, NOT A MECHANISM, AND THIS IS THE FIELD THAT SAYS SO.
# `typescript`'s boundary is the `exports` map and node ENFORCES it: a deep import into
# `internal/` raises ERR_PACKAGE_PATH_NOT_EXPORTED. Python has no enforced boundary at
# any level -- a consumer can import `entity_content._internal.reassemble` and it works.
# D13's Access row in one line: the boundary is not the class, it is the boundary, and
# here the boundary is a promise. The §3.4 MUST is therefore enforced more weakly in this
# port than in that one, which is stated in the module and in the conformance report
# rather than papered over.
boundary  = "convention (underscore + __all__ + a test); NOT enforced by the runtime"

[toolchain]
image = "localhost/entity-core-keystone/python-toolchain:latest"
# ANOTHER TEAM'S IMAGE, used read-only and recorded as a dependency rather than assumed.
python = ">=3.13"        # the image resolves 3.14.x; the peer's pyproject floor is 3.9
runtime_deps = ["cryptography==48.0.0"]  # the PEER's one dependency, inherited not added

[deps]
# We add NOTHING. The extension's only import is the peer package.
runtime = []
dev     = ["pytest"]     # present in the toolchain image's test layer; not shipped

[build]
# THERE IS NO COMPILE STEP, and that is the largest single difference from `typescript`.
#
# `languages/typescript/build` runs tsc TWICE -- the module into a package, then the tests
# against the built package -- specifically so the tests resolve the module through its
# `exports` map. Here there is no compiler to run and no map to resolve through, so
# "build" is a STAGE: copy the cell into a package directory on `sys.path` and verify it
# imports. That verification is not ceremony. It is the only build-time signal this
# language has: a `typescript` cell with a bad import fails to compile, a `python` one
# fails at the first test that touches it, which is later and reads as a test failure.
stage    = "output/<composition>/build"
offline  = true          # --network=none. The peer is staged from its own declared
                         # wheel `packages`, never installed from an index.
compile  = false

[gate]
oracle     = "entity-core-go validate-peer"
oracle_bin = "../entity-core-keystone/output/s4-oracles/validate-peer"
host_entry = "host.py"   # speaks keystone's host CLI verbatim: --port / --name /
                         # --debug-open-grants / --validate, and a single `LISTENING ...`
                         # readiness line on stdout. Same contract, different runtime.

# The readiness budget, in 0.1 s ticks, for the host to print `LISTENING` on stdout.
# DECLARED HERE because it varies per target and a driver literal cannot: it WAS a literal,
# and it had already drifted 100/150/150 with no comment on any of the three (D17 / AP-10).
# Set at port 2, when 100 proved tight for interpreter startup.
startup_ticks = 150

# ── the keystone host facts are NOT declared here ─────────────────────────────────────
# `[extension_host]` lived here until 2026-09-13 and was removed on purpose: nothing in this tree
# read it, the three targets carried three different shapes, and it was a second copy of the row
# keystone keeps in its own profile. The authority is keystone's contract report once it exists
# (docs/status/PROPOSAL-2026-09-13-the-keystone-peer-contract.md §D); until then, keystone's own
# `[extension_host]` row. What a COMPOSITION gets on this peer is `[system.faces]`, per composition.

# ── [error_surface] — the emit-call SHAPE, read by `tools/check-error-codes.py` ─────────
# D17: a per-target VALUE lives in the profile. See the typescript profile for the reason
# this is a profile field and not a constant in the shared gate.
[error_surface]
emit_pattern = '\b_err\(\s*\d+\s*,\s*"(?P<code>[a-z_]+)"'
# D15's control, as data — see `--self-test`.
self_test_line = 'return _err(400, "planted_bogus_code", "x")'

# ── [sdk_surface] — the D16 gate's per-target facts ─────────────────────────────
# D17: a per-target VALUE lives in the profile. `entry_point` was a literal in
# `tools/sdk-parity.py`'s `ENTRY_POINTS` dict — one entry per target in a
# LANGUAGE-NEUTRAL file, which is the shape that becomes a 46-way table. Same defect as
# AP-9's toolchain image and AP-10's readiness budget, one file over.
#
# The PROCEDURE that reads this file lives at `languages/python/gates/sdk-surface/extract.py` beside it,
# because a per-target procedure belongs under the target (§1.2b) — not behind a dispatch
# in the neutral half. The neutral half now discovers both by wildcard.
[sdk_surface]
entry_point = "__init__.py"
# The package initialiser, whose `__all__` IS the declared surface on this target — convention rather than enforcement, and the cell states it.

# ── [peer_contract] is GONE, and its own rule is what removed it ─────────────────────────────
#
# This target carried `status = "pre-contract"` from 2026-09-13 as the ONE declared exception to
# `tools/check-eligible.py`'s "no report, not eligible" rule, under a comment ending *"Delete it
# when that happens."* Keystone published a report for this peer the next day and the gate's R0
# rule failed all three python compositions, exactly as the block said it would. Deleted
# 2026-09-14 — `ROUTING-2026-09-13-c-entity-system-generator-typescript-and-python-are-certified-your-pre-contract-declarations-now-fail-and-what-changed-under-your-arms` §0.
#
# Kept as a comment rather than a silent deletion because the block is the only instance in this
# tree of an exemption that carried its own expiry CONDITION instead of a date, and it expired on
# the condition. That is the shape to copy the next time a target needs one.

# ── [peer_drift] — the certified commit is OLD, declared and self-expiring ────────────────────
#
# Read by `tools/check-eligible.py` (`make eligible`) and it covers ONE rule, F1's `moved` arm.
# Keystone's 45-language sweep (`c255fdfe` sentinel, `2f6547ae` vanguard 0.8.2.23) landed
# capability changes on all three peers AFTER the commits their contract reports were measured
# at, and a merge put both lines in one tree. The report is still a true statement about
# `certified` below; it is no longer a statement about the source we compile.
#
# **This is a DECLARATION, not a suppression, and the difference is mechanical.** It names the
# commit it is ABOUT, so it expires on the CONDITION rather than on a date: the day keystone
# re-certifies, `delivery.commit` changes, `drift_applies()` returns False and F1 fires again
# with nobody having to remember. `--strict-drift` promotes it back today. `routed` must resolve
# (D18) and the gate REFUSES a declaration missing it — a declaration with no destination is a
# suppression (D21).
#
# **We are deliberately NOT asking keystone to re-certify.** They have an arc running; the
# operator's call is that we absorb the drift rather than stall it. We measured the delta
# ourselves instead, and it moved a real answer on `rust` — see the routed packet §5 and
# `extension-contracts/compute/EXTENSION.toml [assumptions].reserved_relative_path_forms`.
[peer_drift]
certified = "fd31d9cacc90"
since     = "2026-09-14"
routed    = "docs/status/ROUTING-2026-09-14-keystone-g5-and-g6-are-done-and-the-evaluator-seam-has-two-shapes-across-your-three-peers.md"
reason    = "keystone's 45-language sweep moved peer capability source after certification; absorbed by operator ruling rather than routed as a re-certification ask"
